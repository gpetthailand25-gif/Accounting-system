<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STOCKCOUNT — ระบบนับสต็อกสิ้นเดือน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#0F1115;
  --surface:#181B21;
  --surface2:#1F232B;
  --surface3:#272C36;
  --border:#2A2F3A;
  --border-soft:#20242C;
  --text:#EDEEF1;
  --text-dim:#9CA3AF;
  --text-faint:#5E6673;
  --amber:#F5A623;
  --amber-soft:#FFC966;
  --amber-dim:#8A5E1E;
  --green:#3DCB63;
  --green-bg:#132B1C;
  --red:#F2555B;
  --red-bg:#331619;
  --blue:#5B9DFF;
  --blue-bg:#101E36;
  --gray:#5B6472;
  --gray-bg:#1C2028;
  --radius-sm:7px;
  --radius:12px;
  --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.24);
  --shadow-md:0 4px 14px rgba(0,0,0,0.28);
  --shadow-lg:0 12px 32px rgba(0,0,0,0.38);
  --ease:cubic-bezier(.4,0,.2,1);
  --mono:'IBM Plex Mono',monospace;
  --sans:'Inter','Noto Sans Thai',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html, body{
  width:100%; max-width:100%; overflow-x:hidden;
  overscroll-behavior-x:none; /* กัน swipe ซ้าย/ขวาแล้วหน้าเว็บขยับ (browser back/forward gesture) บนมือถือ/แท็บเล็ต */
}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(245,166,35,0.05), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1, "cv05" 1;
  overscroll-behavior-x:none;
  touch-action:pan-y; /* จำกัดการลากด้วยนิ้วให้เลื่อนได้แค่แนวตั้ง ไม่ให้ลากซ้าย-ขวาทั้งหน้าจอ */
}
::selection{background:var(--amber); color:#14161A;}

/* ---- hazard stripe signature ---- */
.hazard{
  height:4px;
  width:100%;
  background:linear-gradient(90deg, var(--amber), var(--amber-soft), var(--amber));
  opacity:0.9;
}

/* ---- layout ---- */
.app{display:flex; min-height:100vh;}
.sidebar{
  width:240px; flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.brand{
  padding:20px 18px 16px 18px;
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px;
}
.brand .mark{
  width:34px; height:34px; border-radius:9px; flex-shrink:0;
  background:linear-gradient(145deg, var(--amber-soft), var(--amber));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-weight:800; font-size:14px; color:#241704;
  box-shadow:var(--shadow-sm);
}
.brand .brandtext{min-width:0;}
.brand .name{font-size:15px; font-weight:700; letter-spacing:-0.01em;}
.brand .sub{font-size:11px; color:var(--text-faint); margin-top:1px; font-family:var(--mono);}

.nav{padding:14px 10px; display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto;}
.nav-group-label{font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); padding:16px 10px 6px 10px; font-family:var(--mono); font-weight:600;}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 11px; border-radius:var(--radius-sm); cursor:pointer;
  color:var(--text-dim); font-size:13.5px; font-weight:500;
  border:1px solid transparent; position:relative;
  transition:background .15s var(--ease), color .15s var(--ease);
}
.nav-item:hover{background:var(--surface2); color:var(--text);}
.nav-item.active{background:var(--surface3); color:var(--text); font-weight:600;}
.nav-item.active::before{
  content:''; position:absolute; left:-10px; top:20%; height:60%; width:3px;
  background:var(--amber); border-radius:0 3px 3px 0;
}
.nav-item.active .dot{background:var(--amber); box-shadow:0 0 0 3px rgba(245,166,35,0.18);}
.nav-item .dot{width:6px; height:6px; border-radius:50%; background:var(--text-faint); flex-shrink:0; transition:background .15s var(--ease), box-shadow .15s var(--ease);}
.nav-item .count{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--text-faint); background:var(--surface); padding:1px 6px; border-radius:20px;}

.sidebar-foot{padding:14px 18px; border-top:1px solid var(--border); font-size:11px; color:var(--text-faint); font-family:var(--mono);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}

.topbar{
  position:sticky; top:0; z-index:10;
  background:rgba(15,17,21,0.85); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:14px 28px;
  box-shadow:var(--shadow-sm);
}
.topbar-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.page-title{font-size:19px; font-weight:700; margin-right:auto; letter-spacing:-0.015em;}
.page-title .sub{display:block; font-size:12px; font-weight:400; color:var(--text-faint); margin-top:2px;}

.filter{
  display:flex; flex-direction:column; gap:3px;
}
.filter label{font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; font-family:var(--mono);}
.filter select{
  background:var(--surface2); border:1px solid var(--border); color:var(--text);
  padding:7px 10px; border-radius:var(--radius-sm); font-size:12.5px; font-family:var(--sans);
  min-width:140px; cursor:pointer; transition:border-color .15s var(--ease);
}
.filter select:hover{border-color:var(--text-faint);}
.filter select:focus{outline:2px solid var(--amber); outline-offset:1px;}

.content{padding:24px 28px 60px 28px;}
.section{display:none;}
.section.active{display:block; animation:fadein .28s var(--ease);}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

.section-title{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin:28px 0 12px 0; display:flex; align-items:center; gap:8px;}
.section-title:first-child{margin-top:0;}
.section-title .line{flex:1; height:1px; background:var(--border);}

/* ---- KPI cards ---- */
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:12px;}
.kpi{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px; position:relative; overflow:hidden;
  box-shadow:var(--shadow-sm); transition:transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease);
}
.kpi:hover{transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--border-soft);}
.kpi .label{font-size:11.5px; color:var(--text-faint); font-weight:600;}
.kpi .value{font-family:var(--mono); font-size:26px; font-weight:600; margin-top:6px; letter-spacing:-0.01em;}
.kpi .unit{font-size:12px; color:var(--text-faint); font-weight:400; margin-left:3px;}
.kpi .delta{font-size:11px; margin-top:6px; color:var(--text-dim); font-family:var(--mono);}
.kpi.accent-amber{border-color:var(--amber-dim);}
.kpi.accent-amber .value{color:var(--amber);}
.kpi.accent-green .value{color:var(--green);}
.kpi.accent-red .value{color:var(--red);}
.kpi.accent-blue .value{color:var(--blue);}
.kpi-bar{height:5px; border-radius:4px; background:var(--surface3); margin-top:12px; overflow:hidden;}
.kpi-bar-fill{height:100%; background:var(--amber); border-radius:4px; transition:width .4s var(--ease);}

/* ---- panels / grid ---- */
.grid2{display:grid; grid-template-columns:1.3fr 1fr; gap:14px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media(max-width:1100px){.grid2,.grid3{grid-template-columns:1fr;}}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow-sm); transition:box-shadow .18s var(--ease);}
.panel:hover{box-shadow:var(--shadow-md);}
.panel-title{font-size:13px; font-weight:700; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;}
.panel-title .tag{font-size:10.5px; font-family:var(--mono); color:var(--text-faint); font-weight:400;}

/* ---- bars chart ---- */
.hbar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12.5px;}
.hbar-row .lbl{width:150px; flex-shrink:0; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.hbar-track{flex:1; height:16px; background:var(--surface3); border-radius:4px; overflow:hidden; position:relative;}
.hbar-fill{height:100%; border-radius:4px; background:var(--amber);}
.hbar-val{width:88px; text-align:right; font-family:var(--mono); font-size:11.5px; color:var(--text-dim); flex-shrink:0;}

/* ---- donut ---- */
.donut-wrap{display:flex; align-items:center; gap:18px;}
.donut-legend{display:flex; flex-direction:column; gap:8px; font-size:12.5px;}
.legend-item{display:flex; align-items:center; gap:8px;}
.legend-item .sw{width:10px; height:10px; border-radius:3px;}
.legend-item .n{font-family:var(--mono); margin-left:auto; padding-left:14px; color:var(--text-dim);}

/* ---- status badges ---- */
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:20px; white-space:nowrap;}
.badge .dot{width:6px; height:6px; border-radius:50%;}
.badge-green{background:var(--green-bg); color:#6FE08C;}
.badge-green .dot{background:var(--green);}
.badge-red{background:var(--red-bg); color:#FF8A8E;}
.badge-red .dot{background:var(--red);}
.badge-amber{background:#3A2C0F; color:var(--amber);}
.badge-amber .dot{background:var(--amber);}
.badge-blue{background:var(--blue-bg); color:#8FC1FF;}
.badge-blue .dot{background:var(--blue);}
.badge-gray{background:var(--gray-bg); color:var(--text-dim);}
.badge-gray .dot{background:var(--gray);}

/* ---- tables ---- */
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm);}
table{width:100%; border-collapse:collapse; font-size:12.5px;}
thead th{
  text-align:left; padding:11px 12px; background:var(--surface2); color:var(--text-faint);
  font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;
  border-bottom:1px solid var(--border); white-space:nowrap; font-family:var(--mono);
  position:sticky; top:0;
}
tbody td{padding:10px 12px; border-bottom:1px solid var(--border-soft); white-space:nowrap;}
tbody tr{transition:background .12s var(--ease);}
tbody tr:hover{background:var(--surface2);}
tbody tr:last-child td{border-bottom:none;}
td.num, th.num{text-align:right; font-family:var(--mono);}
td.mono{font-family:var(--mono); font-size:12px;}
.prodname{max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-dim); font-size:12px;}
.pos{color:var(--green);}
.neg{color:var(--red);}

.toolbar{display:flex; gap:10px; margin-bottom:12px; align-items:center; flex-wrap:wrap;}
.search{
  background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:8px 12px; color:var(--text); font-size:12.5px; width:260px; font-family:var(--sans);
  transition:border-color .15s var(--ease);
}
.search:hover{border-color:var(--text-faint);}
.search:focus{outline:2px solid var(--amber); outline-offset:1px;}
.btn{
  background:var(--surface3); border:1px solid var(--border); color:var(--text);
  padding:8px 14px; border-radius:var(--radius-sm); font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--sans);
  box-shadow:var(--shadow-sm); transition:border-color .15s var(--ease), transform .1s var(--ease), box-shadow .15s var(--ease);
}
.btn:hover{border-color:var(--text-faint); box-shadow:var(--shadow-md); transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:linear-gradient(160deg, var(--amber-soft), var(--amber)); border-color:var(--amber); color:#1A1300;}
.btn-primary:hover{filter:brightness(1.05);}
.btn-danger{background:var(--red-bg); border-color:#5C2020; color:#FF8A8E;}
.pillnote{margin-left:auto; font-size:11.5px; color:var(--text-faint); font-family:var(--mono);}

/* ---- expiry / non-moving bucket cards ---- */
.bucket-row{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:18px;}
@media(max-width:1000px){.bucket-row{grid-template-columns:repeat(2,1fr);}}
.bucket{border-radius:var(--radius); padding:14px; border:1px solid var(--border); background:var(--surface); cursor:pointer; box-shadow:var(--shadow-sm); transition:transform .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease);}
.bucket:hover{transform:translateY(-2px); box-shadow:var(--shadow-md);}
.bucket.selected{border-width:2px; box-shadow:0 0 0 1px currentColor inset, var(--shadow-md);}
.bucket .n{font-family:var(--mono); font-size:22px; font-weight:700;}
.bucket .lbl{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
.bucket .v{font-size:17px; color:var(--text); margin-top:6px; font-family:var(--mono); font-weight:700;}
.bucket.urgent{border-color:#5C2020; background:var(--red-bg);}
.bucket.urgent .n{color:var(--red);}
.bucket.warn{border-color:var(--amber-dim); background:#2E2410;}
.bucket.warn .n{color:var(--amber);}
.bucket.watch{border-color:#2E3D5C; background:var(--blue-bg);}
.bucket.watch .n{color:var(--blue);}
.bucket.ok{border-color:#1F4A2A; background:var(--green-bg);}
.bucket.ok .n{color:var(--green);}

/* ---- mobile mockup ---- */
.phone-stage{display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap;}
.phone{
  width:340px; background:#000; border-radius:34px; padding:10px; border:1px solid #333;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.phone-screen{
  background:var(--bg); border-radius:26px; overflow:hidden; min-height:640px; display:flex; flex-direction:column;
}
.phone-bar{background:var(--surface); padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px;}
.phone-bar .back{color:var(--text-faint); font-size:16px;}
.phone-bar .t{font-weight:700; font-size:14px;}
.phone-bar .loc{margin-left:auto; font-size:11px; color:var(--amber); font-family:var(--mono); background:#2E2410; padding:3px 8px; border-radius:6px;}
.phone-scan{
  margin:16px; border:2px dashed var(--border); border-radius:14px; padding:22px; text-align:center;
  color:var(--text-faint); font-size:12.5px;
}
.phone-scan .icon{font-size:26px; margin-bottom:8px;}
.phone-search{margin:0 16px 14px 16px;}
.phone-search input{width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:9px; padding:10px 12px; color:var(--text); font-size:13px;}
.count-card{margin:0 16px 14px 16px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px;}
.count-card .code{font-family:var(--mono); font-size:11px; color:var(--amber);}
.count-card .name{font-weight:700; font-size:14.5px; margin-top:4px; line-height:1.35;}
.count-card .meta{display:flex; gap:14px; margin-top:10px; font-size:11.5px; color:var(--text-dim);}
.count-card .meta div span{display:block; color:var(--text-faint); font-size:10px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:2px;}
.count-card .qty-input{margin-top:14px;}
.count-card .qty-input label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;}
.count-card .qty-row{display:flex; align-items:center; gap:10px; margin-top:6px;}
.qty-btn{width:38px; height:38px; border-radius:9px; background:var(--surface3); border:1px solid var(--border); color:var(--text); font-size:18px; cursor:pointer;}
.qty-field{flex:1; text-align:center; font-family:var(--mono); font-size:22px; font-weight:700; background:var(--surface2); border:1px solid var(--border); border-radius:9px; padding:8px; color:var(--text);}
.save-btn{margin:16px; background:var(--amber); color:#1A1300; border:none; padding:13px; border-radius:11px; font-weight:700; font-size:14px;}
.no-sysqty-note{margin:0 16px 6px 16px; font-size:10.5px; color:var(--text-faint); display:flex; gap:6px; align-items:center;}
.hidden-lock{font-family:var(--mono); font-size:10px; color:var(--text-faint); background:var(--surface2); padding:2px 6px; border-radius:5px;}

.phone-caption{max-width:280px; padding-top:8px;}
.phone-caption h4{font-size:14px; margin-bottom:8px;}
.phone-caption ul{padding-left:18px; color:var(--text-dim); font-size:12.5px; display:flex; flex-direction:column; gap:6px;}

/* ---- count list ---- */
.round-card{
  display:flex; align-items:center; gap:16px; padding:16px 18px; border:1px solid var(--border);
  border-radius:var(--radius); background:var(--surface); margin-bottom:10px;
  box-shadow:var(--shadow-sm); transition:box-shadow .18s var(--ease), border-color .18s var(--ease);
}
.round-card:hover{box-shadow:var(--shadow-md); border-color:var(--border-soft);}
.round-card .rid{font-family:var(--mono); font-weight:700; font-size:14px; color:var(--amber); width:130px;}
.round-card .meta{display:flex; flex-direction:column; gap:2px;}
.round-card .meta .m1{font-size:13px; font-weight:600;}
.round-card .meta .m2{font-size:11.5px; color:var(--text-faint);}
.round-card .meta .m3{font-size:10.5px; color:var(--text-faint); margin-top:3px; font-family:var(--mono);}
.round-card .prog{flex:1; max-width:220px;}
.round-card .prog .pt{font-size:11px; color:var(--text-faint); margin-bottom:4px; font-family:var(--mono);}
.round-card .spacer{flex:1;}

.reason-select{background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:5px 8px; border-radius:6px; font-size:11.5px; font-family:var(--sans);}

.footer-note{margin-top:40px; padding:16px 18px; border:1px dashed var(--border); border-radius:var(--radius); font-size:12px; color:var(--text-faint); line-height:1.7;}
.footer-note b{color:var(--text-dim);}

/* ---- v2 additions: identity bar, round selector, toast, audit, loading ---- */
.identity-bar{
  display:flex; align-items:center; gap:10px; padding:8px 28px;
  background:var(--surface2); border-bottom:1px solid var(--border); font-size:12px;
}
.identity-bar input{
  background:var(--surface); border:1px solid var(--border); color:var(--text);
  padding:5px 10px; border-radius:6px; font-size:12px; width:160px; font-family:var(--sans);
}
.identity-bar .il{color:var(--text-faint); font-family:var(--mono); font-size:11px;}
.identity-bar .rid-pill{
  margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--amber);
  background:#2E2410; padding:3px 10px; border-radius:20px; display:flex; align-items:center; gap:6px;
}
.identity-bar .rid-pill select{background:transparent; border:none; color:var(--amber); font-family:var(--mono); font-size:11px; cursor:pointer;}

.loading-screen{
  position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:12px; z-index:999;
}
.loading-screen .spin{
  width:28px; height:28px; border-radius:50%; border:3px solid var(--surface3); border-top-color:var(--amber);
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-screen .lt{font-family:var(--mono); font-size:12px; color:var(--text-faint);}

.login-screen{
  position:fixed; inset:0;
  background:
    radial-gradient(900px 500px at 50% -10%, rgba(245,166,35,0.08), transparent 60%),
    var(--bg);
  display:flex; align-items:center; justify-content:center; z-index:998;
}
.login-card{
  width:100%; max-width:320px; padding:36px 30px; background:var(--surface2); border:1px solid var(--border);
  border-radius:var(--radius-lg); text-align:center; box-shadow:var(--shadow-lg);
  animation:fadein .3s var(--ease);
}
.login-card .lc-title{font-weight:800; font-size:16px; color:var(--amber); margin-bottom:4px; letter-spacing:-0.01em;}
.login-card .lc-sub{font-size:12px; color:var(--text-faint); margin-bottom:20px;}
.login-card input{
  width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
  padding:12px 14px; border-radius:var(--radius-sm); font-size:16px; font-family:var(--mono); text-align:center;
  letter-spacing:.05em; box-sizing:border-box; transition:border-color .15s var(--ease);
}
.login-card input:focus{outline:2px solid var(--amber); outline-offset:1px;}
.login-card button{
  width:100%; margin-top:14px; padding:12px; border:none; border-radius:var(--radius-sm);
  background:linear-gradient(160deg, var(--amber-soft), var(--amber));
  color:#1a1206; font-weight:700; font-size:14px; cursor:pointer; box-shadow:var(--shadow-sm);
  transition:filter .15s var(--ease), transform .1s var(--ease);
}
.login-card button:hover{filter:brightness(1.05); transform:translateY(-1px);}
.login-card .lc-err{color:var(--red); font-size:12px; margin-top:10px; min-height:16px;}
.identity-bar .logout-btn{
  background:transparent; border:1px solid var(--border); color:var(--text-faint); font-size:11px;
  padding:4px 10px; border-radius:var(--radius-sm); cursor:pointer; font-family:var(--sans);
  transition:color .15s var(--ease), border-color .15s var(--ease);
}
.identity-bar .logout-btn:hover{color:var(--text); border-color:var(--text-faint);}

.reason-manage-panel{
  display:flex; flex-direction:column; gap:8px; background:var(--surface2); border:1px solid var(--border);
  border-radius:10px; padding:14px; margin-bottom:16px;
}
.reason-row{display:flex; gap:8px; align-items:center;}
.reason-edit-input{
  flex:1; background:var(--surface); border:1px solid var(--border); border-radius:7px;
  padding:8px 12px; color:var(--text); font-size:13px; font-family:var(--sans);
}
.reason-edit-input:focus{outline:2px solid var(--amber); outline-offset:1px;}

.toast-stack{position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:1000;}
.toast{
  background:var(--surface3); border:1px solid var(--border); border-left:3px solid var(--amber);
  padding:10px 16px; border-radius:8px; font-size:12.5px; box-shadow:0 8px 24px rgba(0,0,0,0.4);
  animation:toastin .18s ease; max-width:320px;
}
.toast.success{border-left-color:var(--green);}
.toast.error{border-left-color:var(--red);}
@keyframes toastin{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

.empty-state{padding:40px 20px; text-align:center; color:var(--text-faint); font-size:13px;}
.empty-state .icon{font-size:28px; margin-bottom:10px; opacity:.5;}

.new-round-form{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:16px;
  display:grid; grid-template-columns:repeat(4,1fr); gap:12px; align-items:end;
}
.new-round-form .f{display:flex; flex-direction:column; gap:4px;}
.new-round-form label{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; font-family:var(--mono);}
.new-round-form input, .new-round-form select{
  background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:7px; font-size:12.5px; font-family:var(--sans);
}

.step-actions{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
.btn-danger{background:var(--red-bg); border-color:#5C2020; color:#FF9DA0;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

.recount-flag{font-size:10.5px; color:var(--amber); margin-top:4px; display:flex; align-items:center; gap:5px;}
.mini{font-size:11px; color:var(--text-faint);}

.audit-row{display:grid; grid-template-columns:150px 110px 1fr; gap:14px; padding:10px 0; border-bottom:1px solid var(--border-soft); font-size:12px;}
.audit-row .u{color:var(--amber); font-family:var(--mono);}
.audit-row .t{color:var(--text-faint); font-family:var(--mono); font-size:11px;}
.audit-row .d{color:var(--text-dim);}
.audit-row .d b{color:var(--text);}

/* ---- v3: import / export ---- */
.dropzone{
  border:2px dashed var(--border); border-radius:var(--radius); padding:32px; text-align:center;
  background:var(--surface); cursor:pointer; transition:border-color .15s, background .15s;
}
.dropzone:hover, .dropzone.drag{border-color:var(--amber); background:var(--surface2);}
.dropzone .icon{font-size:28px; margin-bottom:8px; color:var(--text-faint);}
.dropzone .main{font-size:13.5px; font-weight:600;}
.dropzone .sub{font-size:11.5px; color:var(--text-faint); margin-top:4px;}
.dropzone input{display:none;}

.col-check-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:6px; margin-top:10px;}
.col-check{display:flex; align-items:center; gap:6px; font-size:11.5px; padding:5px 8px; border-radius:6px; background:var(--surface2); font-family:var(--mono);}
.col-check.ok{color:var(--green);}
.col-check.missing{color:var(--red); background:var(--red-bg);}
.col-check .m{margin-left:auto; font-size:9.5px; color:var(--text-faint);}

.import-summary{display:flex; gap:20px; flex-wrap:wrap; margin:14px 0;}
.import-summary .stat{display:flex; flex-direction:column; gap:2px;}
.import-summary .stat .n{font-family:var(--mono); font-size:20px; font-weight:700;}
.import-summary .stat .l{font-size:11px; color:var(--text-faint);}

.mode-choice{display:flex; gap:10px; margin:14px 0;}
.mode-card{
  flex:1; border:1px solid var(--border); border-radius:var(--radius); padding:14px; cursor:pointer;
  background:var(--surface); transition:border-color .12s;
}
.mode-card.selected{border-color:var(--amber); background:#2E2410;}
.mode-card .mt{font-weight:700; font-size:13px; display:flex; align-items:center; gap:8px;}
.mode-card .md{font-size:11.5px; color:var(--text-dim); margin-top:6px; line-height:1.5;}
.mode-card input{margin-right:2px;}

.confirm-box{
  border:1px solid var(--amber-dim); background:#2E2410; border-radius:var(--radius); padding:16px; margin-top:14px;
}
.confirm-box .ct{font-weight:700; color:var(--amber); font-size:13px; margin-bottom:6px;}
.confirm-box .cd{font-size:12.5px; color:var(--text-dim); line-height:1.6;}

.report-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px;}
.report-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px;}
.report-card .rt{font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px;}
.report-card .rd{font-size:12px; color:var(--text-faint); margin:6px 0 14px 0; line-height:1.5;}
.report-card .rrow{font-size:11.5px; color:var(--text-dim); margin-bottom:10px; font-family:var(--mono);}
.report-actions{display:flex; gap:8px; flex-wrap:wrap;}
.report-actions .btn{flex:1; padding:7px 10px; font-size:11.5px;}

.anomaly-list{margin-top:10px; font-size:11.5px; color:var(--text-dim);}
.anomaly-list div{padding:4px 0; border-bottom:1px solid var(--border-soft);}

/* ============================================================
   RESPONSIVE OVERHAUL — mobile / tablet (portrait+landscape) / desktop
   ============================================================ */

/* hamburger (hidden on desktop) */
.hamburger{
  display:none; width:34px; height:34px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface2); color:var(--text); align-items:center; justify-content:center;
  font-size:16px; cursor:pointer; flex-shrink:0;
}
.nav-overlay{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:29;
}
.nav-overlay.show{display:block;}

@media (max-width: 1024px){
  .hamburger{display:flex;}
  .sidebar{
    position:fixed; top:0; left:0; height:100vh; z-index:30;
    transform:translateX(-100%); transition:transform .22s ease; box-shadow:0 0 40px rgba(0,0,0,0.5);
  }
  .sidebar.open{transform:translateX(0);}
  .identity-bar{padding:8px 14px; flex-wrap:wrap; row-gap:6px;}
  .identity-bar .rid-pill{margin-left:0; width:100%; justify-content:space-between;}
  .topbar{padding:12px 14px;}
  .content{padding:16px 14px 50px 14px;}
  .topbar-row{gap:8px;}
  .page-title{width:100%; font-size:17px;}
  .filter{flex:1 1 auto; min-width:0;}
  .filter select{min-width:0; width:100%;}
}

@media (max-width: 700px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .kpi .value{font-size:21px;}
  .round-card{flex-wrap:wrap;}
  .round-card .rid{width:auto;}
  .round-card .prog{max-width:none; width:100%; order:5;}
  .round-card .spacer{display:none;}
  .bucket-row{grid-template-columns:repeat(2,1fr);}
  .new-round-form{grid-template-columns:1fr 1fr;}
  .mode-choice{flex-direction:column;}
  .donut-wrap{flex-direction:column; align-items:flex-start;}
}

@media (max-width: 420px){
  .kpi-grid{grid-template-columns:1fr 1fr;}
  .kpi{padding:12px 14px;}
  .brand{padding:16px 14px 12px 14px;}
}

/* landscape phones: reclaim vertical space */
@media (max-height: 460px) and (orientation:landscape){
  .brand{padding:12px 16px;}
  .nav{padding:8px 8px;}
  .nav-item{padding:7px 10px;}
  .sidebar-foot{display:none;}
}

/* ---- mobile count screen v2: real responsive grid, no fake phone bezel ---- */
.mobile-sticky-head{
  position:sticky; z-index:5; background:var(--bg); padding-top:6px; margin-top:-6px;
  width:100%; max-width:100%;
}
.count-toolbar{
  display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap;
  padding:4px 0 8px 0; width:100%; max-width:100%;
}
.count-toolbar input{
  flex:1 1 220px; min-width:0; max-width:100%; background:#132A2E; border:2px solid var(--teal, #17B0A8); border-radius:10px;
  padding:13px 16px; color:#fff; font-size:15.5px; font-family:var(--sans); font-weight:600;
  box-shadow:0 0 0 3px rgba(23,176,168,0.15);
}
.count-toolbar input::placeholder{color:#8FD8D3;}
.count-toolbar input:focus{outline:none; border-color:#22D6CB; box-shadow:0 0 0 4px rgba(34,214,203,0.25);}
.count-toolbar input[readonly]{cursor:pointer;}

.code-keypad{
  width:100%; max-width:320px; margin:0 auto; display:grid; gap:8px;
  background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px; box-shadow:var(--shadow-md); position:relative; z-index:6;
}
.kp-row{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.kp-btn{
  padding:16px 0; font-size:20px; font-weight:700; font-family:var(--mono);
  background:var(--surface3); border:1px solid var(--border); border-radius:var(--radius-sm);
  color:var(--text); cursor:pointer; transition:background .12s var(--ease);
}
.kp-btn:active{background:var(--amber); color:#1A1300;}
.kp-clear, .kp-back{font-size:14px; font-family:var(--sans); color:var(--text-dim);}
.kp-done{
  margin-top:4px; padding:12px; border:none; border-radius:var(--radius-sm);
  background:linear-gradient(160deg, var(--amber-soft), var(--amber)); color:#1A1300;
  font-weight:700; font-size:14px; cursor:pointer;
}
.count-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(min(300px,100%),1fr)); gap:14px;
  width:100%; max-width:100%;
}
.count-item{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px;
  display:flex; flex-direction:column; box-shadow:var(--shadow-sm); transition:box-shadow .18s var(--ease), border-color .18s var(--ease);
  min-width:0; max-width:100%;
}
.count-item:hover{box-shadow:var(--shadow-md); border-color:var(--border-soft);}
.count-item .code{font-family:var(--mono); font-size:15px; font-weight:800; color:var(--amber);}
.count-item .name{font-weight:700; font-size:18px; margin-top:6px; line-height:1.35;}
.count-item .meta{display:flex; gap:16px; margin-top:12px; font-size:15px; color:var(--text); flex-wrap:wrap;}
.count-item .meta > div{font-weight:700;}
.count-item .meta > div span{display:block; color:var(--text-faint); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px; font-weight:400;}
.count-item .meta .sysqty{color:var(--blue); font-size:18px;}
.count-item .qty-input{margin-top:14px;}
.count-item .qty-input label{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;}
.count-item .qty-row{display:flex; align-items:center; gap:8px; margin-top:6px;}
.count-item .qty-add-row{display:flex; align-items:center; gap:8px; margin-top:8px;}
.count-item .qty-add-row input{
  flex:1; background:var(--surface2); border:1px dashed var(--border); border-radius:8px;
  padding:9px 12px; color:var(--text); font-size:13.5px; font-family:var(--sans);
}
.count-item .qty-add-row input:focus{outline:2px solid var(--green); outline-offset:1px;}
.count-item .qty-add-btn{
  background:var(--green-bg); border:1px solid #1F4A2A; color:var(--green); font-weight:700; font-size:13px;
  padding:9px 14px; border-radius:8px; cursor:pointer; white-space:nowrap;
}
.count-item .qty-add-btn:hover{filter:brightness(1.15);}
.count-item .save-row{margin-top:12px;}
.count-item .save-row .save-btn{
  width:100%; background:var(--amber); color:#1A1300; border:none; padding:11px; border-radius:9px; font-weight:700; font-size:13.5px; cursor:pointer;
}
.count-item .save-row .save-btn:disabled{opacity:.6;}

/* ---- v4: location/LOT mismatch exception report ---- */
.exc-toggle{
  margin-top:10px; background:none; border:1px dashed var(--amber-dim); color:var(--amber);
  padding:8px 10px; border-radius:8px; font-size:11.5px; cursor:pointer; width:100%; text-align:center;
  font-family:var(--sans);
}
.exc-toggle:hover{background:#2E2410;}
.exc-form{
  margin-top:10px; padding:12px; background:var(--surface2); border:1px solid var(--border); border-radius:10px;
  display:flex; flex-direction:column; gap:10px;
}
.exc-type-row{display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--text-dim);}
.exc-type-row label{display:flex; align-items:center; gap:6px;}
.exc-field label{font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:4px;}
.exc-field select, .exc-field input{
  width:100%; background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:8px 10px;
  color:var(--text); font-size:12.5px; font-family:var(--sans);
}
.exc-field select:focus, .exc-field input:focus{outline:2px solid var(--amber); outline-offset:1px;}

.print-btn{
  display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px;
  background:var(--amber); color:#1a1206; font-weight:700; font-size:12.5px; border:none; cursor:pointer;
}
.print-btn:hover{filter:brightness(1.08);}
.print-header{display:none;}

@media print{
  .sidebar, .topbar, .identity-bar, .hazard, .toast-stack, .nav-overlay, .print-btn, .no-print, .login-screen, .loading-screen{ display:none !important; }
  .app{ display:block !important; }
  .main{ margin:0 !important; width:100% !important; }
  html, body{ background:#fff !important; color:#111 !important; }
  *{ box-shadow:none !important; text-shadow:none !important; }

  @page{ size:A4; margin:24mm 14mm 14mm 14mm; }

  /* หัวกระดาษ: ปักไว้ตายตัวบนสุดของทุกหน้า (Chrome/Edge จะพิมพ์ position:fixed ซ้ำทุกหน้าอัตโนมัติ) */
  .print-header{
    display:block !important;
    position:fixed; top:0; left:0; right:0;
    background:#fff; padding-bottom:10px; margin-bottom:0 !important;
    border-bottom:2px solid #333; z-index:999;
  }
  .print-header .ph-title{ font-size:18px; font-weight:800; color:#111; }
  .print-header .ph-sub{ font-size:11px; color:#555; margin-top:3px; }
  /* เว้นที่ด้านบนของเนื้อหาให้พ้นหัวกระดาษ ไม่ให้บรรทัดแรกถูกบัง */
  .content{ padding:0 !important; padding-top:6mm !important; }

  /* พื้นหลังขาวล้วนทุก component ประหยัดหมึก + อ่านง่ายบนกระดาษ */
  .panel, .kpi, .bucket, .table-wrap, table, .round-card, .count-item, .reason-manage-panel{
    background:#fff !important; border:1px solid #d0d0d0 !important; color:#111 !important;
  }
  thead th{ background:#f2f2f2 !important; color:#333 !important; border-color:#ccc !important; }
  tbody td{ border-color:#e2e2e2 !important; }
  tbody tr:hover{ background:transparent !important; }
  .badge-green{ background:#e6f7e9 !important; color:#1a7a34 !important; }
  .badge-red{ background:#fdeceb !important; color:#b3261e !important; }
  .badge-amber{ background:#fff4e0 !important; color:#8a5a00 !important; }
  .badge-blue{ background:#e8f1ff !important; color:#1a56b0 !important; }
  .badge-gray{ background:#eee !important; color:#444 !important; }
  .bucket.urgent{ background:#fdeceb !important; }
  .bucket.warn{ background:#fff4e0 !important; }
  .bucket.watch{ background:#e8f1ff !important; }
  .bucket.ok{ background:#e6f7e9 !important; }
  .bucket .n, .bucket .lbl, .bucket .v{ color:#111 !important; }
  .section-title{ color:#111 !important; }
  .section-title .line{ background:#ccc !important; }
  .kpi .value, .kpi .label{ color:#111 !important; }
  .kpi.accent-amber .value{ color:#a15c00 !important; }
  .kpi.accent-green .value{ color:#1a7a34 !important; }
  .kpi.accent-red .value{ color:#b3261e !important; }
  .kpi.accent-blue .value{ color:#1a56b0 !important; }
  .mini, .text-faint, .text-dim, .footer-note{ color:#555 !important; }
  .prodname{ color:#333 !important; }
  .pos{ color:#1a7a34 !important; }
  .neg{ color:#b3261e !important; }

  /* จัดคอลัมน์ให้คงที่ตอนพิมพ์ ไม่ขึ้นกับความกว้าง viewport ของหน้าจอที่แสดงตอนกดพิมพ์ */
  .kpi-grid{ grid-template-columns:repeat(3,1fr) !important; gap:8mm 6mm !important; }
  .bucket-row{ grid-template-columns:repeat(5,1fr) !important; gap:4mm !important; }

  /* กันการ์ด/แถวตารางถูกตัดขาดกลางคันระหว่างหน้า */
  .panel, .kpi, .bucket, .round-card, .count-item, tr{ break-inside:avoid; }
  .section-title{ break-after:avoid; }
}
</style>

// ---------------- Firestore storage helpers ----------------
// Firestore doc size limit is 1 MiB — our biggest payloads (~270KB) are safely within that.
// Every key is stored as one document in the "kv" collection: { value: <JSON string>, updatedAt }
let db = null;
let firestoreReady = false;
function initFirestore(){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firestoreReady = true;
  }catch(e){
    console.error('Firebase init failed', e);
    firestoreReady = false;
  }
}
async function sGet(key, shared){
  try{
    const snap = await db.collection('kv_store').doc(key).get();
    if(!snap.exists) return null;
    const v = snap.data().value;
    return v ? JSON.parse(v) : null;
  }catch(e){
    console.error('sGet failed', key, e);
    toast('โหลดข้อมูลไม่สำเร็จ (' + key + '): ' + (e.code||e.message), 'error');
    return null;
  }
}
async function sSet(key, value, shared){
  try{
    await db.collection('kv_store').doc(key).set({ value: JSON.stringify(value), updatedAt: Date.now() });
    return true;
  }catch(e){
    console.error('sSet failed', key, e);
    toast('บันทึกไม่สำเร็จ (' + key + '): ' + (e.code||e.message), 'error');
    return false;
  }
}
async function sDelete(key){
  try{ await db.collection('kv_store').doc(key).delete(); return true; }
  catch(e){ console.error('sDelete failed', key, e); toast('ลบข้อมูลไม่สำเร็จ ('+key+'): '+(e.code||e.message), 'error'); return false; }
}

function toast(msg, type){
  const stack = document.getElementById('toastStack');
  const t = document.createElement('div');
  t.className = 'toast' + (type?' '+type:'');
  t.textContent = msg;
  stack.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 2600);
}

async function logAudit(action, oldValue, newValue){
  AUDIT.unshift({logId: Math.random().toString(36).slice(2,8), user: currentUser, datetime: nowStr(), action, oldValue: oldValue==null?'-':String(oldValue), newValue: newValue==null?'-':String(newValue)});
  if(AUDIT.length>400) AUDIT = AUDIT.slice(0,400);
  await sSet('audit_log', AUDIT, true);
}

function waitForLogin(){
  return new Promise(resolve=>{
    const screen = document.getElementById('loginScreen');
    const input = document.getElementById('loginCodeInput');
    const btn = document.getElementById('loginSubmitBtn');
    const err = document.getElementById('loginError');
    screen.style.display = 'flex';
    input.value = '';
    err.textContent = '';
    input.focus();
    function attempt(){
      const code = input.value.trim().toUpperCase();
      const name = EMPLOYEES[code];
      if(!name){
        err.textContent = 'รหัสไม่ถูกต้อง กรุณาลองใหม่';
        input.select();
        return;
      }
      currentUser = name;
      screen.style.display = 'none';
      resolve();
    }
    btn.onclick = attempt;
    input.onkeydown = (e)=>{ if(e.key==='Enter') attempt(); };
  });
}

// ---------------- init ----------------
async function init(){
  initFirestore();
  if(!firestoreReady){
    document.getElementById('loadingScreen').innerHTML = '<div class="lt" style="color:var(--red); max-width:320px; text-align:center;">เชื่อมต่อ Firebase ไม่สำเร็จ — ตรวจสอบ firebaseConfig และการตั้งค่า Firestore ใน Firebase Console แล้วรีโหลดหน้านี้</div>';
    return;
  }
  BASE = await sGet('seed_v1', true);
  if(!BASE){
    BASE = SEED.map(i=>({...i}));
    await sSet('seed_v1', BASE, true);
  }
  SEED_META = await sGet('seed_meta', true);
  if(!SEED_META){
    SEED_META = {filename:'AppSheet_ViewData_2026-08-25.csv', importedAt: nowStr(), importedBy:'ระบบ (ข้อมูลตั้งต้น)', itemCount: BASE.length, mode:'initial'};
    await sSet('seed_meta', SEED_META, true);
  }
  IMPORT_HISTORY = await sGet('import_history', true) || [];
  ROUNDS = await sGet('rounds', true) || [];
  AUDIT = await sGet('audit_log', true) || [];

  document.getElementById('loadingScreen').style.display='none';
  await waitForLogin();

  if(ROUNDS.length===0){
    await createRound(true); // auto-create current month's round so app isn't empty
  }
  ACTIVE_ROUND = ROUNDS.find(r=>r.status!=='closed')?.id || ROUNDS[0]?.id;

  populateFilters();
  renderIdentityBar();
  setupDrawer();
  document.getElementById('loadingScreen').style.display='none';
  render();
}

// ---------------- round management ----------------
function monthNameTH(m){
  return ['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'][m];
}
async function createRound(silent, opts){
  const d = new Date();
  const month = opts?.month || (d.getMonth()+1);
  const year = opts?.year || (d.getFullYear()+543);
  const location = opts?.location || 'ทุกคลัง';
  const id = `COUNT-${year}${String(month).padStart(2,'0')}-${Math.random().toString(36).slice(2,5).toUpperCase()}`;
  const detail = BASE.filter(i=> !location || location==='ทุกคลัง' || i.loc===location).map((i,idx)=>({
    id: idx, code:i.c, name:i.n, cat:i.cat, unit:i.u, loc:i.loc, exp:i.exp, et:i.et, dte:i.dte, lotRaw:i.lotRaw,
    systemQty:i.qty, unitCost:i.uc, stockValue:i.sv,
    countQty1:null, countQty2:null, finalQty:null, diff:null,
    status:'uncounted', reason:'', countedBy:null, countedAt:null
  }));
  const meta = {id, month, monthLabel:monthNameTH(month), year, location, status:'counting', owner:currentUser, createdBy:currentUser, createdDate:nowStr(), itemsCount:detail.length,
    sourceData: SEED_META ? {filename:SEED_META.filename, importedAt:SEED_META.importedAt, importedBy:SEED_META.importedBy, itemCount:SEED_META.itemCount} : null};
  DETAIL_CACHE[id] = detail;
  const ok = await mutateRoundsAtomic(latest=>{ latest.unshift(meta); return latest; });
  if(!ok) return null;
  await sSet('round_detail:'+id, detail, true);
  await logAudit('สร้างรอบนับ', '-', id);
  if(!silent) toast('สร้างรอบนับ '+id+' สำเร็จ', 'success');
  ACTIVE_ROUND = id;
  return id;
}

async function loadDetail(roundId){
  if(DETAIL_CACHE[roundId]) return DETAIL_CACHE[roundId];
  const d = await sGet('round_detail:'+roundId, true) || [];
  DETAIL_CACHE[roundId] = d;
  return d;
}
async function saveDetail(roundId){
  await sSet('round_detail:'+roundId, DETAIL_CACHE[roundId], true);
}
async function saveRounds(){ await sSet('rounds', ROUNDS, true); }

// ป้องกันข้อมูลถูกเขียนทับเวลามีคนหลายคน/หลายเครื่องใช้งานพร้อมกัน:
// อ่านข้อมูล 'rounds' ล่าสุดจากเซิร์ฟเวอร์ใน transaction แล้วค่อยแก้ไข+บันทึกแบบอะตอมมิก
// แทนที่จะใช้ ROUNDS ที่อาจค้างอยู่ในหน่วยความจำของเครื่องนี้ (ซึ่งอาจเก่ากว่าของคนอื่น)
async function mutateRoundsAtomic(mutatorFn){
  const ref = db.collection('kv_store').doc('rounds');
  try{
    await db.runTransaction(async (tx)=>{
      const snap = await tx.get(ref);
      let latest = [];
      if(snap.exists){
        const v = snap.data().value;
        latest = v ? JSON.parse(v) : [];
      }
      const updated = mutatorFn(latest) || latest;
      tx.set(ref, { value: JSON.stringify(updated), updatedAt: Date.now() });
      ROUNDS = updated;
    });
    return true;
  }catch(e){
    console.error('mutateRoundsAtomic failed', e);
    toast('บันทึกรอบนับไม่สำเร็จ: '+(e.code||e.message), 'error');
    return false;
  }
}

async function setRoundStatus(roundId, status){
  const r = ROUNDS.find(x=>x.id===roundId);
  const old = r ? r.status : null;
  const ok = await mutateRoundsAtomic(latest=>{
    const rr = latest.find(x=>x.id===roundId);
    if(rr) rr.status = status;
    return latest;
  });
  if(!ok) return;
  await logAudit(`เปลี่ยนสถานะรอบ ${roundId}`, old, status);
}

async function deleteRound(roundId){
  const r = ROUNDS.find(x=>x.id===roundId);
  if(!r) return;
  const ok = await mutateRoundsAtomic(latest=> latest.filter(x=>x.id!==roundId));
  if(!ok) return; // ถ้าบันทึกไม่สำเร็จ ไม่ต้องลบ round_detail/exceptions ต่อ ป้องกันข้อมูลไม่ตรงกัน
  await sDelete('round_detail:'+roundId);
  await sDelete('exceptions:'+roundId);
  delete DETAIL_CACHE[roundId];
  delete EXC_CACHE[roundId];
  await logAudit('ลบรอบนับ', roundId, '-');
  if(ACTIVE_ROUND===roundId){
    ACTIVE_ROUND = ROUNDS.find(x=>x.status!=='closed')?.id || ROUNDS[0]?.id || null;
  }
  toast(`ลบรอบ ${roundId} เรียบร้อยแล้ว`, 'success');
}

// ---------------- count entry ----------------
async function submitCount(roundId, itemId, qty){
  if(isRoundLocked(roundId)){ toast('รอบนี้ปิดแล้ว ไม่สามารถแก้ไขข้อมูลการนับได้','error'); return null; }
  const detail = await loadDetail(roundId);
  const item = detail.find(x=>x.id===itemId);
  if(!item) return;
  const isRecount = item.countQty1 !== null;
  const oldVal = item.finalQty;
  if(!isRecount){
    item.countQty1 = qty;
    item.finalQty = qty;
  } else {
    item.countQty2 = qty;
    item.finalQty = qty; // recount overrides as the authoritative figure
  }
  item.diff = item.finalQty - item.systemQty;
  item.status = item.diff===0 ? 'matched' : 'mismatch';
  item.countedBy = currentUser;
  item.countedAt = nowStr();
  await saveDetail(roundId);
  await logAudit(`นับ ${item.code} (${item.loc})`, oldVal, item.finalQty);
  return item;
}

async function setReason(roundId, itemId, reason){
  if(isRoundLocked(roundId)){ toast('รอบนี้ปิดแล้ว ไม่สามารถแก้ไขเหตุผลได้','error'); return; }
  const detail = await loadDetail(roundId);
  const item = detail.find(x=>x.id===itemId);
  if(!item) return;
  const old = item.reason;
  item.reason = reason;
  await saveDetail(roundId);
  await logAudit(`ระบุเหตุผลผลต่าง ${item.code}`, old||'-', reason);
}

// ---------------- location / LOT mismatch exceptions ----------------
function daysBetweenISO(isoStr){
  if(!isoStr) return null;
  return Math.round((new Date(isoStr) - new Date())/86400000);
}
async function loadExceptions(roundId){
  if(EXC_CACHE[roundId]) return EXC_CACHE[roundId];
  const d = await sGet('exceptions:'+roundId, true) || [];
  EXC_CACHE[roundId] = d;
  return d;
}
async function saveExceptions(roundId){ await sSet('exceptions:'+roundId, EXC_CACHE[roundId], true); }

// รายการ "เหตุผล" ของผลต่าง — เก็บใน Firestore แบบ shared เพื่อให้ทุกคนเห็นรายการเดียวกัน และหัวหน้างานเพิ่ม/แก้ไขได้เอง
let REASON_LIST = null;
const DEFAULT_REASONS = ['สูญเสีย','เสียหาย','ชั่งน้ำหนักผิด','เบิกไม่ได้ตัด','รับสินค้าไม่ได้เข้า','นับผิด','อื่น ๆ'];
async function loadReasonList(){
  if(REASON_LIST) return REASON_LIST;
  REASON_LIST = await sGet('reason_list', true);
  if(!REASON_LIST || !Array.isArray(REASON_LIST) || REASON_LIST.length===0){
    REASON_LIST = DEFAULT_REASONS.slice();
    await sSet('reason_list', REASON_LIST, true);
  }
  return REASON_LIST;
}
async function saveReasonList(){ await sSet('reason_list', REASON_LIST, true); }

// รวมจำนวนที่พบจากรายงานผิดตำแหน่ง/ผิด LOT (exceptions) กลับเข้ากับแถวต้นทางที่รายงานเรื่องนั้น
// เหตุผล: ถ้ารหัสสินค้าเดียวกัน แต่เจอผิด Location/LOT ให้นับรวมเป็นยอดเดียวกัน เพราะสิ่งที่ต้องเช็คหลักคือ "จำนวนรวมตรงไหม"
// ส่วนตำแหน่ง/LOT ที่ผิดจริงจะไปแก้ไขข้อมูลภายหลัง (ผ่านการอนุมัติ exception) ไม่ใช่ตัวชี้วัดความถูกต้องของยอดนับ
// คืนค่า array ใหม่ (ไม่แก้ไขของเดิม) พร้อมฟิลด์เพิ่ม: effQty (ยอดนับรวมหลังบวก exception), effDiff, effStatus, exceptionQty (ยอดที่มาจาก exception)
function applyExceptionMatches(detail, exceptions){
  return detail.map(i=>{
    if(i.status==='uncounted') return {...i, effQty:null, effDiff:null, effStatus:'uncounted', exceptionQty:0};
    const extra = (exceptions||[])
      .filter(e=> e.code===i.code && e.origLoc===i.loc && e.origExp===i.exp)
      .reduce((a,e)=>a+(+e.foundQty||0),0);
    const effQty = (i.finalQty||0) + extra;
    const effDiff = effQty - i.systemQty;
    const effStatus = effDiff===0 ? 'matched' : 'mismatch';
    return {...i, effQty, effDiff, effStatus, exceptionQty: extra};
  });
}

async function reportException(roundId, payload){
  if(isRoundLocked(roundId)){ toast('รอบนี้ปิดแล้ว ไม่สามารถแจ้งรายงานผิดปกติเพิ่มได้','error'); return null; }
  const list = await loadExceptions(roundId);
  const rec = {
    id: Math.random().toString(36).slice(2,9),
    ...payload,
    reportedBy: currentUser, reportedAt: nowStr(),
    status: 'pending', resolution: ''
  };
  list.unshift(rec);
  await saveExceptions(roundId);
  await logAudit(
    `แจ้งพบผิด${payload.type==='location_mismatch'?'ตำแหน่ง':'LOT'} ${payload.code}`,
    '-', `${payload.foundLoc||''} ${payload.foundExp||''} จำนวน=${payload.foundQty}`
  );
  return rec;
}

async function resolveException(roundId, excId, action, note){
  if(isRoundLocked(roundId)){ toast('รอบนี้ปิดแล้ว ไม่สามารถดำเนินการรายงานผิดปกติได้','error'); return; }
  const list = await loadExceptions(roundId);
  const exc = list.find(e=>e.id===excId);
  if(!exc) return;
  exc.status = 'resolved';
  exc.resolution = action + (note ? ' — '+note : '');
  exc.resolvedBy = currentUser; exc.resolvedAt = nowStr();
  await saveExceptions(roundId);

  if(action==='transfer_location'){
    const rec = BASE.find(i=> i.c===exc.code && i.exp===exc.origExp && i.loc===exc.origLoc);
    if(rec){
      const oldLoc = rec.loc;
      rec.loc = exc.foundLoc;
      await sSet('seed_v1', BASE, true);
      await logAudit(`แก้ไขตำแหน่ง Stock Balance ${exc.code}`, oldLoc, exc.foundLoc);
    }
  } else if(action==='add_new_lot'){
    const newItem = {
      c: exc.code, n: exc.name, cat: exc.cat||'', u: exc.unit, loc: exc.foundLoc||exc.origLoc,
      exp: exc.foundExp||null, et: !!exc.foundExp, dte: exc.foundExp ? daysBetweenISO(exc.foundExp) : null,
      qty: exc.foundQty, uc: 0, sv: 0,
      lmd: todayISO(), lmt: 'ปรับปรุง', dsm: 0
    };
    BASE.push(newItem);
    await sSet('seed_v1', BASE, true);
    await logAudit(`เพิ่มสต็อกใหม่จาก Unknown LOT ${exc.code}`, '-', `${exc.foundExp||'-'} จำนวน=${exc.foundQty}`);
  }
  await logAudit(`ดำเนินการรายงานผิดปกติ (${action}) ${exc.code}`, 'pending', 'resolved');
}

// ย้อนรายงานที่ "ยืนยันไปแล้ว" (resolved) กลับเป็น "รอดำเนินการ" (pending) พร้อมย้อนผลที่เคยอัปเดตเข้า Stock Balance ไปแล้ว
// ใช้ตอนพบว่ากดยืนยันไปแล้วแต่ข้อมูลที่บันทึก (LOT/Location/จำนวน) ผิด จะได้แก้ไขแล้วยืนยันใหม่ให้ถูกต้อง
// หมายเหตุ: reverseException/editException ไม่ล็อกด้วย isRoundLocked โดยตั้งใจ
// เพราะเป็นเครื่องมือแก้ไข "ความผิดพลาดที่ยืนยันไปแล้ว" ซึ่งอาจถูกพบหลังรอบปิดไปแล้วก็ได้ จึงต้องใช้งานได้เสมอ
async function reverseException(roundId, excId){
  const list = await loadExceptions(roundId);
  const exc = list.find(e=>e.id===excId);
  if(!exc || exc.status!=='resolved') return false;
  const action = (exc.resolution||'').split(' — ')[0];
  if(action==='transfer_location'){
    const rec = BASE.find(i=> i.c===exc.code && i.exp===exc.origExp && i.loc===exc.foundLoc);
    if(rec){ const from=rec.loc; rec.loc = exc.origLoc; await sSet('seed_v1', BASE, true); await logAudit(`ย้อนกลับตำแหน่ง Stock Balance ${exc.code}`, from, exc.origLoc); }
  } else if(action==='add_new_lot'){
    const idx = BASE.findIndex(i=> i.c===exc.code && i.exp===exc.foundExp && i.loc===(exc.foundLoc||exc.origLoc) && i.qty===exc.foundQty && i.lmt==='ปรับปรุง');
    if(idx>=0){ BASE.splice(idx,1); await sSet('seed_v1', BASE, true); await logAudit(`ลบสต็อกที่เพิ่มผิดจาก Unknown LOT ${exc.code}`, `${exc.foundExp||'-'} จำนวน=${exc.foundQty}`, '-'); }
  }
  exc.status = 'pending'; exc.resolution=''; exc.resolvedBy=null; exc.resolvedAt=null;
  await saveExceptions(roundId);
  await logAudit(`ย้อนสถานะรายงานผิดปกติกลับเป็นรอดำเนินการ (แก้ไขข้อมูล) ${exc.code}`, 'resolved', 'pending');
  return true;
}
// แก้ไขข้อมูลที่แจ้งผิด (LOT/Location/จำนวน/หมายเหตุ) — ใช้ได้เฉพาะรายการที่ยังเป็น pending เท่านั้น
async function editException(roundId, excId, updates){
  const list = await loadExceptions(roundId);
  const exc = list.find(e=>e.id===excId);
  if(!exc || exc.status!=='pending') return false;
  const before = `${exc.foundLoc} / ${exc.foundExp||'-'} / ${exc.foundQty}`;
  Object.assign(exc, updates);
  await saveExceptions(roundId);
  await logAudit(`แก้ไขรายงานผิดปกติ ${exc.code}`, before, `${exc.foundLoc} / ${exc.foundExp||'-'} / ${exc.foundQty}`);
  return true;
}

async function approveRound(roundId){
  const detail = await loadDetail(roundId);
  const exceptions = await loadExceptions(roundId);
  const effDetail = applyExceptionMatches(detail, exceptions);
  const unresolved = effDetail.filter(i=>i.effStatus==='mismatch' && !i.reason);
  if(unresolved.length>0){
    toast(`ยังมี ${unresolved.length} รายการที่ไม่ตรง ยังไม่ได้ระบุเหตุผล`, 'error');
    return false;
  }
  const pendingExc = exceptions.filter(e=>e.status==='pending');
  if(pendingExc.length>0){
    toast(`ยังมีรายงานผิดตำแหน่ง/ผิด LOT ที่รอดำเนินการ ${pendingExc.length} รายการ`, 'error');
    return false;
  }
  await setRoundStatus(roundId, 'approved');
  await logAudit(`อนุมัติ & สร้าง ADJUST`, ROUNDS.find(r=>r.id===roundId)?.status, 'approved');
  toast('อนุมัติรอบนับสำเร็จ — สร้างรายการ ADJUST แล้ว', 'success');
  return true;
}

function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
// ป้องกันไม่ให้ตัวเลขในช่อง <input type="number"> เปลี่ยนตอนเลื่อนเมาส์วีล/สครอลผ่านช่องโดยไม่ได้ตั้งใจ
// ใช้วิธี blur() ออกจากช่องตอนสครอล (ไม่ preventDefault) เพื่อให้หน้าเว็บยังเลื่อนได้ปกติ ไม่ค้างอยู่ที่ช่อง
function noWheelChange(input){ if(input) input.addEventListener('wheel', ()=>{ if(document.activeElement===input) input.blur(); }, {passive:true}); }

// ---------------- คลิกหัวตารางเพื่อเรียงลำดับคอลัมน์ (ใช้ร่วมกันได้ทุกหน้า) ----------------
// จำสถานะการเรียง (คอลัมน์ + ทิศทาง) แยกตาม pageKey เพื่อให้แต่ละหน้าเรียงอิสระจากกัน
const SORT_STATE = {};
function getSort(pageKey){ return SORT_STATE[pageKey] || (SORT_STATE[pageKey]={key:null, dir:1}); }
// สร้างสตริง <th> ที่คลิกเรียงได้ — คลิกครั้งแรก = น้อย→มาก, คลิกซ้ำ = มาก→น้อย
function sortableTh(label, colKey, pageKey, numeric){
  const s = getSort(pageKey);
  const active = s.key===colKey;
  const arrow = active ? (s.dir===1?' ▲':' ▼') : ' ⇅';
  return `<th class="${numeric?'num ':''}sortable-th" data-sortkey="${colKey}" data-pagekey="${pageKey}" style="cursor:pointer; user-select:none;">${label}<span style="color:${active?'var(--amber)':'var(--text-faint)'}; font-size:9px;">${arrow}</span></th>`;
}
// ผูกคลิกให้ทุก th.sortable-th ภายใน element ที่กำหนด แล้วเรียก onSortChange (ปกติคือ render() เพื่อวาดหน้าใหม่)
function wireSortableHeaders(rootEl, onSortChange){
  rootEl.querySelectorAll('.sortable-th').forEach(th=>{
    th.onclick = ()=>{
      const pageKey = th.dataset.pagekey, colKey = th.dataset.sortkey;
      const s = getSort(pageKey);
      if(s.key===colKey) s.dir *= -1; else { s.key = colKey; s.dir = 1; }
      onSortChange();
    };
  });
}
// เรียง array ตามสถานะการเรียงปัจจุบันของ pageKey นั้น — getters คือ { colKey: item=>value }
function applySorting(items, pageKey, getters){
  const s = getSort(pageKey);
  if(!s.key || !getters[s.key]) return items;
  const getter = getters[s.key];
  return items.slice().sort((a,b)=>{
    const va = getter(a), vb = getter(b);
    if(va==null && vb==null) return 0;
    if(va==null) return 1*s.dir; if(vb==null) return -1*s.dir;
    if(typeof va === 'string') return va.localeCompare(vb) * s.dir;
    return (va-vb) * s.dir;
  });
}

function filterBase(items){
  return items.filter(i=>{
    if(state.location && i.loc!==state.location) return false;
    if(state.category && i.cat!==state.category) return false;
    return true;
  });
}
function filterDetail(items){
  return items.filter(i=>{
    if(state.location && i.loc!==state.location) return false;
    if(state.category && i.cat!==state.category) return false;
    if(state.status==='counted' && i.status==='uncounted') return false;
    if(state.status==='uncounted' && i.status!=='uncounted') return false;
    if(state.status==='mismatch' && i.status!=='mismatch') return false;
    return true;
  });
}

    track.appendChild(fill); row.appendChild(track); row.appendChild(el('div','hbar-val',money(v))); p.appendChild(row);
  });
  return p;
}

function varianceTable(rows, pageKey){
  pageKey = pageKey || 'variance';
  const wrap = el('div','table-wrap');
  const t = el('table');
  t.innerHTML = `<thead><tr>${sortableTh('Product','code',pageKey)}${sortableTh('ชื่อสินค้า','name',pageKey)}${sortableTh('LOT','exp',pageKey)}${sortableTh('Location','loc',pageKey)}${sortableTh('System Qty','systemQty',pageKey,true)}${sortableTh('Count Qty','effQty',pageKey,true)}${sortableTh('Diff','effDiff',pageKey,true)}${sortableTh('มูลค่าผลต่าง','diffValue',pageKey,true)}<th>สถานะ</th><th>เหตุผล</th></tr></thead>`;
  const tb = el('tbody');
  const sortedRows = applySorting(rows, pageKey, {
    code:i=>i.code, name:i=>i.name, exp:i=>i.exp||'', loc:i=>i.loc, systemQty:i=>i.systemQty,
    effQty:i=>(i.effQty!==undefined?i.effQty:i.finalQty), effDiff:i=>(i.effDiff!==undefined?i.effDiff:i.diff),
    diffValue:i=>(i.effDiff!==undefined?i.effDiff:i.diff)*i.unitCost,
  });
  sortedRows.forEach(i=>{
    // ใช้ยอด/สถานะที่รวม exception แล้วถ้ามี (effQty/effDiff/effStatus) ไม่งั้น fallback เป็นค่าดิบ
    const qty = i.effQty!==undefined ? i.effQty : i.finalQty;
    const diff = i.effDiff!==undefined ? i.effDiff : i.diff;
    const status = i.effStatus!==undefined ? i.effStatus : i.status;
    const diffClass = diff>0?'pos':(diff<0?'neg':'');
    const tr = el('tr');
    const noteHtml = i.exceptionQty>0 ? `<div class="mini" style="color:var(--text-faint); margin-top:2px;">(${num(i.finalQty)} + ${num(i.exceptionQty)} จากตำแหน่งอื่น)</div>` : '';
    tr.innerHTML = `<td class="mono">${i.code}</td><td class="prodname" title="${i.name}">${i.name}</td><td class="mono">${fmtLot(i)}</td><td>${i.loc}</td>
      <td class="num mono">${num(i.systemQty)}</td><td class="num mono">${qty==null?'-':num(qty)}${noteHtml}</td>
      <td class="num mono ${diffClass}">${diff==null?'-':(diff>0?'+':'')+num(diff)}</td>
      <td class="num mono ${diffClass}">${diff==null?'-':money(diff*i.unitCost)}</td><td></td><td class="mini">${i.reason||'—'}</td>`;
    tr.children[8].appendChild(statusBadge(status));
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t);
  wireSortableHeaders(t, render);
  return wrap;
}

// สร้างการ์ดสถานะขนาดใหญ่พร้อมอิโมจิ ✅/⚠️/❌ ให้ผู้บริหารดูปราดเดียวเข้าใจ
function statusChip(level, emoji, label, detail){
  // level: 'ok' (เขียว) | 'warn' (เหลือง) | 'urgent' (แดง)
  const b = el('div','bucket '+level);
  b.appendChild(el('div','n', emoji));
  b.appendChild(el('div','lbl', label));
  b.appendChild(el('div','v', detail));
  return b;
}

    const tbInactive = el('tbody');

    const finalInactive = getSort('value-inactive').key ? sortedInactive : inactiveItems.slice().sort((a,b)=>b.sv-a.sv);
    finalInactive.forEach(i=>{
      const tr=el('tr');
      tr.innerHTML = `<td class="mono">${i.c}</td><td class="prodname" title="${i.n}">${i.n}</td><td>${i.cat||'-'}</td><td>${i.loc}</td><td class="num mono">${num(i.qty)}</td><td>${i.u}</td><td class="num mono">${money(i.sv)}</td>`;
      tbInactive.appendChild(tr);
    });
    tInactive.appendChild(tbInactive); wrapInactive.appendChild(tInactive);

    container.appendChild(el('div','mini','รายการสินค้าไม่ Active (คลิกหัวตารางเพื่อเรียงลำดับ)'));

  g2.appendChild(barPanel('Stock Value by Category', byCat, 'var(--amber)'));
  const byLoc={}; items.forEach(i=>{ byLoc[i.loc]=(byLoc[i.loc]||0)+i.sv; });
  g2.appendChild(barPanel('Stock Value by Location', byLoc, 'var(--blue)'));
  container.appendChild(g2);

  if(ACTIVE_ROUND){
    container.appendChild(el('div','section-title',`มูลค่าตามความคืบหน้าการนับ — รอบ ${ACTIVE_ROUND}<div class="line"></div>`));
    loadDetail(ACTIVE_ROUND).then(async detail=>{
      const exceptions = await loadExceptions(ACTIVE_ROUND);
      detail = applyExceptionMatches(filterDetail(detail), exceptions);
      const counted = detail.filter(i=>i.status!=='uncounted');
      const uncounted = detail.filter(i=>i.status==='uncounted');
      const mismatched = counted.filter(i=>i.effStatus==='mismatch');
      const short = mismatched.filter(i=>i.effDiff<0), over = mismatched.filter(i=>i.effDiff>0);
      const valShort = short.reduce((a,i)=>a+i.effDiff*i.unitCost,0);
      const valOver = over.reduce((a,i)=>a+i.effDiff*i.unitCost,0);
      const grid2 = el('div','kpi-grid');
      grid2.appendChild(kpiCard('มูลค่าที่นับแล้ว', money(counted.reduce((a,i)=>a+i.stockValue,0)),'','blue'));
      grid2.appendChild(kpiCard('มูลค่าที่ยังไม่ได้นับ', money(uncounted.reduce((a,i)=>a+i.stockValue,0))));
      grid2.appendChild(kpiCard('มูลค่าขาด', money(Math.abs(valShort)),'','red'));
      grid2.appendChild(kpiCard('มูลค่าเกิน', money(valOver),'','green'));
      grid2.appendChild(kpiCard('Net Variance', (valShort+valOver>=0?'+':'')+money(valShort+valOver),'', (valShort+valOver)<0?'red':'green'));
      const holder = document.getElementById('value-round-holder');
      if(holder){ holder.innerHTML=''; holder.appendChild(grid2); }
    });
    const holder = el('div',''); holder.id='value-round-holder'; holder.innerHTML='<div class="mini">กำลังโหลด...</div>';
    container.appendChild(holder);
  }
}

let expiryLevelFilter = null; // null = ทั้งหมด, หรือ 'expired'|'d7'|'d30'|'d60'|'d90'

function renderExpiry(container){
  // ทุกประเภทที่มีวันหมดอายุ (LOT = วันหมดอายุ) ยกเว้น "บรรจุภัณฑ์" ที่ไม่ต้องสนใจ LOT/วันหมดอายุ
  const items = filterBase(BASE).filter(i=>i.et);
  container.appendChild(el('div','section-title','Expiry Monitoring <span style="color:var(--text-faint); text-transform:none; font-weight:400;">— ทุกประเภทที่มีวันหมดอายุ (ไม่รวมบรรจุภัณฑ์) · คลิกที่การ์ดเพื่อกรองระดับ</span><div class="line"></div>'));
  const buckets={expired:[],d7:[],d30:[],d60:[],d90:[]};
  items.forEach(i=>{ const d=i.dte; if(d==null) return;
    if(d<0) buckets.expired.push(i); else if(d<=7) buckets.d7.push(i); else if(d<=30) buckets.d30.push(i); else if(d<=60) buckets.d60.push(i); else if(d<=90) buckets.d90.push(i);
  });
  const row = el('div','bucket-row');
  [['expired','urgent','หมดอายุแล้ว',buckets.expired],['d7','urgent','ภายใน 7 วัน',buckets.d7],['d30','warn','ภายใน 30 วัน',buckets.d30],['d60','warn','ภายใน 60 วัน',buckets.d60],['d90','watch','ภายใน 90 วัน',buckets.d90]]
  .forEach(([k,cls,label,arr])=>{
    const b=el('div','bucket '+cls+(expiryLevelFilter===k?' selected':'')); b.appendChild(el('div','n',num(arr.length))); b.appendChild(el('div','lbl',label)); b.appendChild(el('div','v',money(arr.reduce((a,i)=>a+i.sv,0))));
    b.onclick = ()=>{ expiryLevelFilter = (expiryLevelFilter===k) ? null : k; render(); };
    row.appendChild(b);
  });
  container.appendChild(row);
  if(expiryLevelFilter){
    const clearBtn = el('button','print-btn no-print','✕ ล้างตัวกรองระดับ');
    clearBtn.style.marginBottom='14px';
    clearBtn.onclick = ()=>{ expiryLevelFilter=null; render(); };
    container.appendChild(clearBtn);
  }
  let all = expiryLevelFilter ? buckets[expiryLevelFilter] : [...buckets.expired,...buckets.d7,...buckets.d30,...buckets.d60,...buckets.d90];
  all = applySorting(all, 'expiry', {c:i=>i.c,n:i=>i.n,exp:i=>i.exp||'',dte:i=>i.dte,loc:i=>i.loc,qty:i=>i.qty,u:i=>i.u,sv:i=>i.sv});
  if(!getSort('expiry').key) all = all.slice().sort((a,b)=>a.dte-b.dte);
  container.appendChild(el('div','section-title','รายละเอียด <span class="mini" style="text-transform:none; font-weight:400;">คลิกหัวตารางเพื่อเรียงลำดับ</span><div class="line"></div>'));
  const wrap=el('div','table-wrap'); const t=el('table');
  t.innerHTML=`<thead><tr>${sortableTh('รหัส','c','expiry')}${sortableTh('ชื่อสินค้า','n','expiry')}${sortableTh('LOT/วันหมดอายุ','exp','expiry')}${sortableTh('เหลือ(วัน)','dte','expiry',true)}${sortableTh('Location','loc','expiry')}${sortableTh('จำนวน','qty','expiry',true)}${sortableTh('หน่วย','u','expiry')}${sortableTh('มูลค่า','sv','expiry',true)}<th>ระดับ</th></tr></thead>`;
  const tb=el('tbody');
  all.forEach(i=>{
    let lvl='watch',lbl='ปกติ';
    if(i.dte<0){lvl='urgent';lbl='หมดอายุแล้ว';} else if(i.dte<=7){lvl='urgent';lbl=`${i.dte} วัน`;} else if(i.dte<=30){lvl='warn';lbl=`${i.dte} วัน`;} else if(i.dte<=60){lvl='warn';lbl=`${i.dte} วัน`;}
    const tr=el('tr');
    tr.innerHTML=`<td class="mono">${i.c}</td><td class="prodname" title="${i.n}">${i.n}</td><td class="mono">${fmtDateTH(i.exp)}</td><td class="num mono">${i.dte}</td><td>${i.loc}</td><td class="num mono">${num(i.qty)}</td><td>${i.u}</td><td class="num mono">${money(i.sv)}</td><td></td>`;
    const bm={urgent:'badge-red',warn:'badge-amber',watch:'badge-blue'};
    tr.lastElementChild.innerHTML=`<span class="badge ${bm[lvl]}"><span class="dot"></span>${lbl}</span>`;
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); container.appendChild(wrap);
  wireSortableHeaders(t, render);
}

  const tb=el('tbody');
  const sortedInactive = applySorting(inactive, 'nonmoving', {c:i=>i.c,n:i=>i.n,exp:i=>i.exp||'',loc:i=>i.loc,qty:i=>i.qty,u:i=>i.u,uc:i=>i.uc,sv:i=>i.sv,lmd:i=>i.lmd||''});
  sortedInactive.forEach(i=>{ const tr=el('tr'); tr.innerHTML=`<td class="mono">${i.c}</td><td class="prodname" title="${i.n}">${i.n}</td><td class="mono">${fmtLot(i)}</td><td>${i.loc}</td><td class="num mono">${num(i.qty)}</td><td>${i.u}</td><td class="num mono">${money(i.uc)}</td><td class="num mono">${money(i.sv)}</td><td class="mono">${i.lmd} <span style="color:var(--text-faint)">(${i.lmt})</span></td>`; tb.appendChild(tr); });
  t.appendChild(tb); wrap.appendChild(t); container.appendChild(wrap);
  wireSortableHeaders(t, render);
}

        const remainQty = +card.querySelector('.exc-remain').value || 0;

        subBtn.disabled = true; subBtn.textContent = 'กำลังบันทึก...';

          code:item.code, name:item.name, unit:item.unit, cat:item.cat,
          origLoc:item.loc, origExp:item.exp,
          type, foundLoc, foundExp, foundQty, note
        });

      };

      if(locked){
        card.querySelectorAll('input, button, select').forEach(elm=>{ elm.disabled = true; });
        card.style.opacity = '0.65';
      }

      box.appendChild(card);
    });
    if(total>40) box.appendChild(el('div','footer-note',`แสดง 40 จาก ${total} รายการ — พิมพ์ค้นหาให้เจาะจงขึ้นเพื่อดูรายการที่ต้องการ`));
  }
  renderList('','');
  setTimeout(()=>{
    const codeInput = document.getElementById('mobileSearchCode');
    const textInput = document.getElementById('mobileSearchText');
    const keypad = document.getElementById('codeKeypad');
    const openKeypad = ()=>{ keypad.style.display='grid'; };
    const closeKeypad = ()=>{ keypad.style.display='none'; };
    codeInput.addEventListener('click', openKeypad);
    codeInput.addEventListener('focus', openKeypad);
    keypad.querySelectorAll('.kp-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const k = btn.dataset.k;
        if(k==='back') codeInput.value = codeInput.value.slice(0,-1);
        else if(k==='clear') codeInput.value = '';
        else codeInput.value += k;
        renderList(codeInput.value, textInput.value);
      };
    });
    keypad.querySelector('.kp-done').onclick = closeKeypad;
    textInput.oninput = (e)=> renderList(codeInput.value, e.target.value);
  },0);
}

  const counted = detail.filter(i=>i.status!=='uncounted');
  const mismatched = counted.filter(i=>i.effStatus==='mismatch');
  const reasonList = await loadReasonList();

  container.querySelector('.section-title span').appendChild(statusBadge2(round.status));

  const grid = el('div','kpi-grid');

async function renderVariance(container){

  const exceptions = await loadExceptions(ACTIVE_ROUND);
  const detail = applyExceptionMatches(filterDetail(await loadDetail(ACTIVE_ROUND)), exceptions);
  const counted = detail.filter(i=>i.status!=='uncounted');
  const mismatched = counted.filter(i=>i.effStatus==='mismatch');
  const short = mismatched.filter(i=>i.effDiff<0), over = mismatched.filter(i=>i.effDiff>0);
  const matched = counted.filter(i=>i.effStatus==='matched');

  container.appendChild(el('div','section-title','Stock Variance<div class="line"></div>'));
  const grid = el('div','kpi-grid');
  grid.appendChild(kpiCard('รายการตรง', num(matched.length),'','green'));
  grid.appendChild(kpiCard('รายการขาด', num(short.length),'','red'));
  grid.appendChild(kpiCard('รายการเกิน', num(over.length),'','amber'));
  grid.appendChild(kpiCard('ต้องตรวจสอบทั้งหมด', num(mismatched.length)));
  grid.appendChild(kpiCard('มูลค่าของรายการขาด', money(Math.abs(short.reduce((a,i)=>a+i.effDiff*i.unitCost,0))),'','red'));
  grid.appendChild(kpiCard('มูลค่าของรายการเกิน', money(over.reduce((a,i)=>a+i.effDiff*i.unitCost,0)),'','green'));
  const net = mismatched.reduce((a,i)=>a+i.effDiff*i.unitCost,0);
  grid.appendChild(kpiCard('Net Variance', (net>=0?'+':'')+money(net),'', net<0?'red':'green'));
  container.appendChild(grid);

  container.appendChild(el('div','section-title','Variance by Category<div class="line"></div>'));
  const byCat={}; mismatched.forEach(i=>{ byCat[i.cat||'ไม่ระบุ']=(byCat[i.cat||'ไม่ระบุ']||0)+Math.abs(i.effDiff*i.unitCost); });
  container.appendChild(barPanel('มูลค่าผลต่างแยก Category', byCat, 'var(--red)'));

  container.appendChild(el('div','section-title','รายการผลต่างทั้งหมด<div class="line"></div>'));
  container.appendChild(varianceTable(mismatched.slice().sort((a,b)=>Math.abs(b.effDiff*b.unitCost)-Math.abs(a.effDiff*a.unitCost)), 'variance-full'));
}

// IMPORT / EXPORT — shared parse & file helpers
// ============================================================
const EXPECTED_COLUMNS = ['ProductKey','Location','Lot','Lot_Balance','Price/Unit','Unit','Product type','Active','MFG Date','Date','Type','RefID','LogID','Residual value','TotalStock','แจ้งเตือนวันหมดอายุ'];
const REQUIRED_COLUMNS = ['ProductKey','Location','Lot','Lot_Balance','Price/Unit','Unit','Product type'];

function parseThaiDateJS(s){
  if(!s || typeof s!=='string' || !s.trim()) return null;
  const parts = s.trim().split('/');
  if(parts.length!==3) return null;
  const [d,m,yRaw] = parts.map(x=>parseInt(x,10));
  if(!d||!m||!yRaw) return null;
  const y = yRaw>2200 ? yRaw-543 : yRaw; // Buddhist -> Gregorian
  const dt = new Date(y, m-1, d);
  if(isNaN(dt.getTime())) return null;
  return dt;
}
function isoDate(dt){ if(!dt) return null; const p=x=>String(x).padStart(2,'0'); return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}`; }
// แปลงวันที่ ISO (YYYY-MM-DD) เป็น DD/MM/YYYY สำหรับแสดง LOT ทุกหน้า
// ค่าที่เก็บจริง (i.exp) ยังคงเป็น ISO เหมือนเดิม เพื่อให้ sort/เปรียบเทียบ/ผูกกับ exception ได้ถูกต้อง — ฟังก์ชันนี้ใช้ตอนแสดงผลเท่านั้น
function fmtDateTH(iso){
  if(!iso) return iso;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if(!m) return iso;
  return `${m[3]}/${m[2]}/${m[1]}`;
}
// แสดงผลคอลัมน์ LOT ในรายงาน/หน้าจอต่างๆ: ถ้าเป็นวัตถุดิบที่มีวันหมดอายุจริง (exp) ให้โชว์วันที่แบบไทย
// ถ้าไม่ใช่ ให้โชว์รหัส LOT แบบข้อความดิบจากไฟล์ (lotRaw) แทน — เดิมโค้ดใช้ fmtDateTH(i.exp) อย่างเดียว
// ซึ่ง exp เป็น null เสมอถ้าไม่ใช่วัตถุดิบ ทำให้คอลัมน์ LOT ในรายงานไม่โชว์อะไรเลยแม้ไฟล์จะมีรหัส LOT อยู่จริง
function fmtLot(i){
  if(!i) return '-';
  if(i.exp) return fmtDateTH(i.exp);
  if(i.lotRaw) return i.lotRaw;
  return '-';
}
// แปลง ISO เป็น DD/MM/YYYY แบบ พ.ศ. (ปี ค.ศ.+543) — ใช้เฉพาะตอน export กลับไฟล์ AppSheet เพราะไฟล์ต้นฉบับ (Lot/Date) ใช้ปี พ.ศ.
function fmtDateBE(iso){
  if(!iso) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if(!m) return iso;
  return `${m[3]}/${m[2]}/${parseInt(m[1],10)+543}`;
}
function parseNumJS(s){ if(s==null||s==='') return 0; const n = parseFloat(String(s).replace(/[$,]/g,'')); return isNaN(n)?0:n; }
function parseProductKeyJS(s){
  if(!s) return {code:'', name:''};
  const m = /^\*?([A-Za-z0-9-]+)\s*\|\s*(.*)$/.exec(s.trim());
  if(m) return {code:m[1].trim(), name:m[2].trim()};
  return {code:s.trim(), name:''};
}

function csvToRows(text){
  if(window.Papa){
    const res = Papa.parse(text, {header:true, skipEmptyLines:true});
    return res.data;
  }
  // minimal fallback parser (no quoted-comma support)
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  const headers = lines[0].split(',').map(h=>h.trim());
  return lines.slice(1).map(line=>{
    const cells = line.split(',');
    const o = {};
    headers.forEach((h,i)=>o[h]=cells[i]!==undefined?cells[i].trim():'');
    return o;
  });
}

function excelToRows(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, {defval:''});
}

function rowsToItems(rows){
  const today = new Date();
  const items = [];
  const anomalies = [];
  rows.forEach((r,idx)=>{
    const pk = parseProductKeyJS(r['ProductKey']);
    if(!pk.code){ anomalies.push(`แถว ${idx+2}: ไม่มี ProductKey`); return; }
    const qty = parseNumJS(r['Lot_Balance']);
    if(r['Lot_Balance']!==undefined && isNaN(parseFloat(String(r['Lot_Balance']).replace(/[$,]/g,'')))){ anomalies.push(`แถว ${idx+2}: Lot_Balance ไม่ใช่ตัวเลข (${r['Lot_Balance']})`); }
    const uc = parseNumJS(r['Price/Unit']);
    const expDt = parseThaiDateJS(r['Lot']);
    const lmDt = parseThaiDateJS(r['Date']);
    const cat = (r['Product type']||'').trim();
    const et = cat !== 'บรรจุภัณฑ์' && !!expDt;
    const dte = et && expDt ? Math.round((expDt - today)/86400000) : null;
    const dsm = lmDt ? Math.round((today - lmDt)/86400000) : null;
    const sv = r['Residual value']!==undefined && r['Residual value']!=='' ? parseNumJS(r['Residual value']) : qty*uc;
    // คอลัมน์ Active (Y/N): ถ้าไฟล์ไม่มีคอลัมน์นี้ (undefined) ให้ถือว่า active=true เพื่อไม่กระทบข้อมูลเดิม
    const activeRaw = r['Active'];
    const active = activeRaw===undefined || activeRaw===null || activeRaw==='' ? true : String(activeRaw).trim().toUpperCase()==='Y';
    // lotKey = ตัวระบุ LOT จริงสำหรับใช้กันแถวซ้ำ (Product+LOT+Location) — ต้องไม่ผูกกับ "et"
    // (et ใช้เฉพาะเป็น flag แจ้งเตือนวันหมดอายุของวัตถุดิบเท่านั้น) เดิมโค้ดใช้ exp (=null เสมอถ้าไม่ใช่วัตถุดิบ)
    // เป็น key ทำให้ทุก LOT ของสินค้าที่ไม่ใช่วัตถุดิบในโลเคชันเดียวกันถูกยุบรวมเหลือแถวเดียว ข้อมูลจึงหายไปตอนนำเข้า
    // ยกเว้น "บรรจุภัณฑ์" — ไม่ต้องยึด LOT เป็น key เลย ให้ยึดแค่รหัส+โลเคชันแล้วรวมยอดเข้าด้วยกัน (lotKey ว่าง)
    const lotKey = cat === 'บรรจุภัณฑ์' ? '' : (expDt ? isoDate(expDt) : (r['Lot']!=null ? String(r['Lot']).trim() : ''));
    // lotRaw = รหัส LOT แบบข้อความดิบไว้ "แสดงผล" ในรายงาน (เช่น LOT ที่เป็นรหัสข้อความ ไม่ใช่วันที่)
    // ไม่ตั้งให้บรรจุภัณฑ์เพราะยอดถูกรวมข้าม LOT แล้ว จึงไม่มี LOT เดียวที่เป็นตัวแทนได้ถูกต้อง
    const lotRaw = cat === 'บรรจุภัณฑ์' ? '' : (r['Lot']!=null ? String(r['Lot']).trim() : '');
    items.push({
      c: pk.code, n: pk.name, cat: cat, u: (r['Unit']||'').trim(), loc: (r['Location']||'').trim(),
      exp: et ? isoDate(expDt) : null, et, dte, lotKey, lotRaw,
      qty, uc, sv, active,
      lmd: lmDt ? isoDate(lmDt) : null, lmt: (r['Type']||'').trim(), dsm,
    });
  });
  const rawCount = items.length;
  const deduped = dedupLatestByKey(items);
  return {items: deduped, anomalies, rawItemCount: rawCount};
}

// ไฟล์รายเดือนบางไฟล์เป็น log เคลื่อนไหวสะสม จึงอาจมีหลายแถวต่อ Product+LOT+Location เดียวกัน
// (คนละวันที่/RefID) — เมื่อรหัสสินค้า+LOT+Location ซ้ำกันจริง ให้ "รวมยอด" Lot_Balance (และ Residual value)
// ของทุกแถวที่ซ้ำกันเข้าด้วยกัน (ไม่ใช่เลือกเก็บแค่แถวเดียว) ส่วนข้อมูลอื่น (วันที่/ประเภทล่าสุด ฯลฯ)
// ยึดจากแถวที่มีวันที่เคลื่อนไหวล่าสุด ถ้าไม่มีวันที่ให้เทียบเลยก็ยึดแถวหลังสุดในไฟล์
function dedupLatestByKey(items){
  const map = new Map();
  items.forEach(it=>{
    const key = it.c+'|'+(it.lotKey||'')+'|'+it.loc;
    const existing = map.get(key);
    if(!existing){ map.set(key, {...it}); return; }
    const a = existing.lmd ? new Date(existing.lmd) : null;
    const b = it.lmd ? new Date(it.lmd) : null;
    const useNewAsBase = (b && (!a || b >= a)) || (!b && !a);
    // ยอดรวม: บวก Lot_Balance และ Residual value ของทุกแถวที่ key ซ้ำกันเข้าด้วยกันเสมอ
    const mergedQty = existing.qty + it.qty;
    const mergedSv = existing.sv + it.sv;
    const base = useNewAsBase ? {...it} : existing;
    map.set(key, {...base, qty: mergedQty, sv: mergedSv});
  });
  return Array.from(map.values());
}

function downloadBlob(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportCSV(filename, headers, rows){
  const esc = v => { const s = v==null?'':String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [headers.map(esc).join(','), ...rows.map(r=>r.map(esc).join(','))];
  downloadBlob(filename, '\uFEFF'+lines.join('\r\n'), 'text/csv;charset=utf-8;');
}
function exportXLSX(filename, headers, rows, sheetName){
  const aoa = [headers, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName||'Report');
  XLSX.writeFile(wb, filename);
}

function handleImportFile(file){
  importState = {rows:null, headers:[], items:null, anomalies:[], mode:'replace', filename:file.name};
  const ext = file.name.split('.').pop().toLowerCase();
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      let rows;
      if(ext==='csv'){ rows = csvToRows(e.target.result); }
      else { rows = excelToRows(e.target.result); }
      if(!rows || rows.length===0){ toast('ไม่พบข้อมูลในไฟล์ หรือไฟล์ว่างเปล่า','error'); return; }
      importState.rows = rows;
      importState.headers = Object.keys(rows[0]);
      const {items, anomalies, rawItemCount} = rowsToItems(rows);
      importState.rawItemCount = rawItemCount;
      importState.items = items;
      importState.anomalies = anomalies;
      renderImportPreview();
    }catch(err){
      toast('อ่านไฟล์ไม่สำเร็จ: '+err.message,'error');
    }
  };
  if(ext==='csv') reader.readAsText(file, 'utf-8'); else reader.readAsArrayBuffer(file);
}
