async function doImport(){
  const before = BASE.length;
  let added=0, updated=0;
  if(importState.mode==='replace'){
    const oldKeys = new Set(BASE.map(i=>i.c+'|'+(i.lotKey||'')+'|'+i.loc));
    BASE = importState.items.map(i=>({...i}));
    BASE.forEach(i=>{ const k=i.c+'|'+(i.lotKey||'')+'|'+i.loc; if(oldKeys.has(k)) updated++; else added++; });
  } else {
    const key = i => i.c+'|'+(i.lotKey||'')+'|'+i.loc;
    const map = new Map(BASE.map(i=>[key(i), i]));
    importState.items.forEach(ni=>{
      const k = key(ni);
      if(map.has(k)) updated++; else added++;
      map.set(k, ni);
    });
    BASE = Array.from(map.values());
  }
  await sSet('seed_v1', BASE, true);
  SEED_META = {filename: importState.filename, importedAt: nowStr(), importedBy: currentUser, itemCount: BASE.length, mode: importState.mode};
  await sSet('seed_meta', SEED_META, true);
  IMPORT_HISTORY.unshift({id: Math.random().toString(36).slice(2,9), ...SEED_META, rawRows: importState.rows.length, added, updated});
  if(IMPORT_HISTORY.length>100) IMPORT_HISTORY = IMPORT_HISTORY.slice(0,100);
  await sSet('import_history', IMPORT_HISTORY, true);
  await logAudit('นำเข้าข้อมูล ('+importState.mode+')', before+' รายการ', BASE.length+' รายการ ('+importState.filename+')');
  const modeMsg = importState.mode==='replace'
    ? `แทนที่ข้อมูลสำเร็จ — ยอดคงเหลือปัจจุบัน ${BASE.length} รายการ (${added} รายการใหม่, ${updated} รายการที่มีอยู่แล้วถูกอัปเดต)`
    : `นำเข้าสำเร็จ — เพิ่มใหม่ ${added} รายการ, อัปเดต ${updated} รายการ`;
  toast(modeMsg, 'success');
  populateFilters();
  importState = {rows:null, headers:[], items:null, anomalies:[], mode:'replace', filename:''};
  render();
  renderImportSuccessCTA();
}

function renderImportSuccessCTA(){
  const content = document.getElementById('content');
  if(!content || state.tab!=='import') return;
  const box = el('div','confirm-box');
  box.style.marginTop = '18px';
  box.innerHTML = `<div class="ct">✅ นำเข้าข้อมูลเรียบร้อยแล้ว</div>
    <div class="cd">ยอดคงเหลือใหม่พร้อมใช้กับ Dashboard และหน้ามูลค่าสต็อกแล้ว — ถ้าต้องการเปิดรอบนับสต็อกเดือนนี้จากยอดล่าสุดนี้ กดปุ่มด้านล่างได้เลย</div>`;
  const btn = el('button','btn btn-primary','+ ไปสร้างรอบนับใหม่จากยอดนี้');
  btn.style.marginTop = '10px';
  btn.onclick = ()=>{ state.tab='counts'; render(); };
  box.appendChild(btn);
  content.querySelector('.section')?.appendChild(box);
}

function reportStockCount(){
  const rawDetail = ACTIVE_ROUND ? (DETAIL_CACHE[ACTIVE_ROUND]||[]) : [];
  const exceptions = ACTIVE_ROUND ? (EXC_CACHE[ACTIVE_ROUND]||[]) : [];
  const detail = applyExceptionMatches(filterDetail(rawDetail), exceptions);
  const headers = ['ลำดับ','Product Code','ชื่อสินค้า','LOT','Location','System Qty','Count Qty','Final Qty (รวม exception)','Diff','สถานะ','นับโดย','เวลา'];
  const rows = detail.map((i,idx)=>[idx+1,i.code,i.name,fmtLot(i),i.loc,i.systemQty,i.countQty1??'-',i.effQty??'-',i.effDiff??'-',statusLabelTH(i.effStatus||i.status),i.countedBy||'-',i.countedAt||'-']);
  return {headers, rows, title:`Stock Count Report — ${ACTIVE_ROUND||''}`};
}
function reportVariance(){
  const rawDetail = ACTIVE_ROUND ? (DETAIL_CACHE[ACTIVE_ROUND]||[]) : [];
  const exceptions = ACTIVE_ROUND ? (EXC_CACHE[ACTIVE_ROUND]||[]) : [];
  const mismatched = applyExceptionMatches(filterDetail(rawDetail), exceptions).filter(i=>i.effStatus==='mismatch');
  const headers = ['ลำดับ','Product Code','ชื่อสินค้า','LOT','Location','System Qty','Final Qty (รวม exception)','Diff','มูลค่าผลต่าง','เหตุผล'];
  const rows = mismatched.map((i,idx)=>[idx+1,i.code,i.name,fmtLot(i),i.loc,i.systemQty,i.effQty,i.effDiff,Math.round(i.effDiff*i.unitCost),i.reason||'-']);
  return {headers, rows, title:`Variance Report — ${ACTIVE_ROUND||''}`};
}
function reportExpiry(){
  const items = filterBase(BASE).filter(i=>i.et && i.dte!=null).sort((a,b)=>a.dte-b.dte);
  const headers = ['ลำดับ','Product Code','ชื่อสินค้า','LOT/วันหมดอายุ','เหลือ (วัน)','Location','จำนวน','หน่วย','มูลค่า'];
  const rows = items.map((i,idx)=>[idx+1,i.c,i.n,fmtDateTH(i.exp),i.dte,i.loc,i.qty,i.u,Math.round(i.sv)]);
  return {headers, rows, title:'Expiry Report'};
}
function reportNonMoving(){
  const items = filterBase(BASE).filter(i=>i.active===false).sort((a,b)=>b.sv-a.sv);
  const headers = ['ลำดับ','Product Code','ชื่อสินค้า','LOT','Location','Stock Qty','หน่วย','Unit Cost','Stock Value','Last Movement'];
  const rows = items.map((i,idx)=>[idx+1,i.c,i.n,fmtLot(i),i.loc,i.qty,i.u,i.uc,Math.round(i.sv),i.lmd||'-']);
  return {headers, rows, title:'Non-Moving Stock Report'};
}
function reportValuation(){
  const items = filterBase(BASE).sort((a,b)=>b.sv-a.sv);
  const headers = ['ลำดับ','Product Code','ชื่อสินค้า','Category','LOT','Location','Qty','หน่วย','Unit Cost','Stock Value'];
  const rows = items.map((i,idx)=>[idx+1,i.c,i.n,i.cat,fmtLot(i),i.loc,i.qty,i.u,i.uc,Math.round(i.sv)]);
  return {headers, rows, title:'Stock Valuation Report'};
}
function statusLabelTH(s){ return {matched:'ตรง', mismatch:'ไม่ตรง', uncounted:'ยังไม่ได้นับ'}[s]||s; }

// รหัส Location ตามเทมเพลต AppSheet "Check Stock" (คอลัมน์ LocationKey/LocationName ในไฟล์ต้นฉบับ)
// ต้องส่ง Location เป็น "รหัส" (เช่น 002) ไม่ใช่ชื่อเต็ม เพราะ AppSheet ผูก dropdown Location กับรหัสนี้
const LOCATION_CODE_MAP = {
  'อินโนว่าชั้น1':'001', 'อินโนว่าชั้น2':'002', 'โกดัง':'003',
  'อินโนว่า ตู้คอนเทนเนอร์':'004', 'อินโนว่า ห้องชิว':'005', 'อินโนว่า ห้องแช่แข็ง':'006',
  'อินโนว่า  ห้องคุกกี้':'007', 'เนย์คิริน ตู้แช่เย็น':'008', 'อินโนว่าชั้น3':'009',
  'คอนเทนเนอร์ไร่ขิง42':'010', 'ตู้คอนเนอร์ โกดัง66/2':'011',
};
function locationCode(name){ return LOCATION_CODE_MAP[name] || name; }
function randomCountKey(){ return Math.random().toString(16).slice(2,10); }

// สร้างไฟล์ตามเทมเพลต "ส่งออกไป AppSheet_Check Stock" ที่ผู้ใช้ให้มา
// คอลัมน์: COUNTKey, Date, ProductKey, LOT, Location(รหัส), QtyCount, Unit, Timestamp
// ดึง 2 ส่วนมารวมกัน เพื่อให้ได้ "จำนวนที่นับได้จริง" ตาม LOT/Location จริงครบทุกจุด:
//   1) แถวนับปกติจาก round_detail — ยอดที่เหลือจริง ณ LOT/Location เดิมตามระบบ (อาจเป็น 0 ถ้าของทั้งหมดย้ายไปที่อื่น)
//   2) แถวจากรายงานผิดตำแหน่ง/ผิด LOT (exceptions) — ยอดที่ "เจอจริง" ณ LOT/Location ที่ถูกต้องจริง (ซึ่งอาจไม่ตรงกับที่ระบบคาดไว้)
// รวมกันแล้วจะได้ภาพที่ตรงความจริงที่สุด ให้ AppSheet เห็นทั้ง 2 ตำแหน่งแยกกันตามที่นับได้จริง
function reportAppSheetCheckStock(){
  const rawDetail = ACTIVE_ROUND ? (DETAIL_CACHE[ACTIVE_ROUND]||[]) : [];
  const exceptions = ACTIVE_ROUND ? (EXC_CACHE[ACTIVE_ROUND]||[]) : [];
  const counted = filterDetail(rawDetail).filter(i=>i.status!=='uncounted' && i.finalQty!=null);
  const headers = ['COUNTKey','Date','ProductKey','LOT','Location','QtyCount','Unit','Timestamp'];
  const rows = counted.map(i=>{
    const ts = i.countedAt || nowStr();
    const dateOnly = ts.split(' ')[0];
    return [randomCountKey(), dateOnly, '*'+i.code, i.exp?fmtDateBE(i.exp):'', locationCode(i.loc), i.finalQty, i.unit, ts];
  });
  filterDetail(exceptions.map(e=>({...e, loc:e.foundLoc}))).forEach(exc=>{
    const ts = exc.reportedAt || nowStr();
    const dateOnly = ts.split(' ')[0];
    rows.push([randomCountKey(), dateOnly, '*'+exc.code, exc.foundExp?fmtDateBE(exc.foundExp):'', locationCode(exc.foundLoc), exc.foundQty, exc.unit, ts]);
  });
  return {headers, rows, title:`AppSheet_CheckStock_Export_${ACTIVE_ROUND||''}`};
}

const REPORTS = [
  {id:'count', name:'Stock Count Report', desc:'สถานะการนับรายรายการของรอบที่เลือก', fn:reportStockCount, needsRound:true},
  {id:'variance', name:'Variance Report', desc:'รายการที่ผลต่างไม่ตรงของรอบที่เลือก พร้อมเหตุผล', fn:reportVariance, needsRound:true},
  {id:'expiry', name:'Expiry Report', desc:'สินค้าใกล้หมดอายุ/หมดอายุแล้ว ทั้งหมด', fn:reportExpiry, needsRound:false},
  {id:'nonmoving', name:'Non-Moving Stock Report', desc:'สินค้าไม่เคลื่อนไหว (Active=N) เรียงตามมูลค่า', fn:reportNonMoving, needsRound:false},
  {id:'valuation', name:'Stock Valuation Report', desc:'มูลค่าสต็อกทั้งหมดรายรายการ', fn:reportValuation, needsRound:false},
  {id:'appsheet', name:'Export to AppSheet (Check Stock)', desc:'ไฟล์ตามเทมเพลต AppSheet Check Stock (COUNTKey/Date/ProductKey/LOT/Location/QtyCount/Unit/Timestamp) ของรอบที่เลือก — นำเข้ากลับ AppSheet ได้โดยตรง', fn:reportAppSheetCheckStock, needsRound:true},
];

async function renderExport(container){
  // โหลด detail + exceptions ของรอบที่ใช้งานอยู่เข้า cache ก่อนเสมอ
  // (ถ้าไม่ทำตรงนี้ EXC_CACHE อาจยังว่างหากเข้าหน้านี้เป็นหน้าแรกของ session ทำให้ยอดที่มาจากรายงานผิดตำแหน่ง/ผิด LOT หายไปจากรายงาน เช่น *P-0002 ขึ้น 0)
  if(ACTIVE_ROUND){ await loadDetail(ACTIVE_ROUND); await loadExceptions(ACTIVE_ROUND); }
  container.appendChild(el('div','section-title','เลือกรายงานที่ต้องการ Export<div class="line"></div>'));
  if(!ACTIVE_ROUND){
    container.appendChild(el('div','footer-note','ยังไม่มีรอบนับที่เลือกอยู่ — รายงาน Stock Count / Variance จะว่างเปล่าจนกว่าจะสร้างรอบนับ'));
  }
  const grid = el('div','report-grid');
  REPORTS.forEach(rep=>{
    const card = el('div','report-card');
    card.innerHTML = `<div class="rt">📄 ${rep.name}</div><div class="rd">${rep.desc}</div>`;
    const {rows} = rep.fn();
    card.appendChild(el('div','rrow',`${rows.length} แถว ${rep.needsRound && ACTIVE_ROUND ? '· รอบ '+ACTIVE_ROUND : ''}`));
    const actions = el('div','report-actions');
    const btnCsv = el('button','btn','CSV');
    const btnXlsx = el('button','btn','Excel');
    const btnPdfP = el('button','btn','📄 PDF แนวตั้ง');
    const btnPdfL = el('button','btn','📄 PDF แนวนอน');
    btnCsv.onclick = ()=>{ const {headers,rows,title} = rep.fn(); if(rows.length===0){toast('ไม่มีข้อมูลสำหรับ export','error'); return;} exportCSV(title.replace(/\s+/g,'_')+'.csv', headers, rows); logAudit('Export CSV', '-', title); toast('ดาวน์โหลด CSV แล้ว','success'); };
    btnXlsx.onclick = ()=>{
      if(!window.XLSX){ toast('ไลบรารี Excel ยังโหลดไม่เสร็จ ลองใหม่อีกครั้ง','error'); return; }
      const {headers,rows,title} = rep.fn(); if(rows.length===0){toast('ไม่มีข้อมูลสำหรับ export','error'); return;}
      exportXLSX(title.replace(/\s+/g,'_')+'.xlsx', headers, rows, rep.name.slice(0,28));
      logAudit('Export Excel', '-', title); toast('ดาวน์โหลด Excel แล้ว','success');
    };
    btnPdfP.onclick = ()=>{ const {headers,rows,title} = rep.fn(); if(rows.length===0){toast('ไม่มีข้อมูลสำหรับ export','error'); return;} exportPrintPDF(title, headers, rows, 'portrait'); logAudit('Export PDF (แนวตั้ง)', '-', title); };
    btnPdfL.onclick = ()=>{ const {headers,rows,title} = rep.fn(); if(rows.length===0){toast('ไม่มีข้อมูลสำหรับ export','error'); return;} exportPrintPDF(title, headers, rows, 'landscape'); logAudit('Export PDF (แนวนอน)', '-', title); };
    actions.appendChild(btnCsv); actions.appendChild(btnXlsx); actions.appendChild(btnPdfP); actions.appendChild(btnPdfL);
    card.appendChild(actions);
    grid.appendChild(card);
  });
  container.appendChild(grid);
  container.appendChild(el('div','footer-note','<b>หมายเหตุ:</b> ทุกรายงานมีคอลัมน์ "ลำดับ" (เลขที่แถว) ให้อัตโนมัติ · ปุ่ม "PDF แนวตั้ง/แนวนอน" จะเปิดหน้าต่างใหม่พร้อมเปิดกล่องพิมพ์ของเบราว์เซอร์ให้อัตโนมัติ ตั้งขนาดกระดาษเป็น A4 ตามแนวที่เลือก — เลือกปลายทางเป็น "Save as PDF" เพื่อบันทึกเป็นไฟล์ PDF (วิธีนี้แสดงผลภาษาไทยได้ถูกต้อง 100% ต่างจากการสร้าง PDF ตรงๆ ที่มักมีปัญหาฟอนต์ภาษาไทย)'));
}

function renderNav(){
  const el2 = document.getElementById('nav'); el2.innerHTML='';
  NAV.forEach(g=>{
    el2.appendChild(el('div','nav-group-label',g.group));
    g.items.forEach(it=>{
      const d = el('div','nav-item'+(state.tab===it.id?' active':''), `<span class="dot"></span><span>${it.label}</span>`);
      d.onclick = ()=>{ state.tab = it.id; closeDrawer(); render(); };
      el2.appendChild(d);
    });
  });
}
function openDrawer(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('navOverlay').classList.add('show'); }
function closeDrawer(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('navOverlay').classList.remove('show'); }
function setupDrawer(){
  document.getElementById('hamburgerBtn').onclick = ()=>{
    const sb = document.getElementById('sidebar');
    sb.classList.contains('open') ? closeDrawer() : openDrawer();
  };
  document.getElementById('navOverlay').onclick = closeDrawer;
}

async function render(){
  renderNav();
  document.getElementById('fLocation').value = state.location;
  document.getElementById('fCategory').value = state.category;
  document.getElementById('fStatus').value = state.status;
  const [title,sub] = TITLES[state.tab];
  document.getElementById('pageTitle').innerHTML = title + `<span class="sub">${sub}</span>`;
  const content = document.getElementById('content');
  content.innerHTML = '';
  const section = el('div','section active');
  content.appendChild(section);
  const fn = {dashboard:renderDashboard, value:renderValue, expiry:renderExpiry, nonmoving:renderNonMoving,
    counts:renderCounts, mobile:renderMobile, review:renderReview, variance:renderVariance, audit:renderAudit,
    import:renderImport, export:renderExport, exec:renderExecSummary}[state.tab];
  await fn(section);
  renderIdentityBar();
}
