// ตรวจหารหัสทรัพย์สินที่ซ้ำกัน แยกตามหมวดหมู่ -> { categoryKey: [{code, count}, ...] }
function findDuplicateCodesByCategory(list){
  const counts = {};
  (list||[]).forEach(i => {
    const code = String(i.code||'').trim();
    if(!code) return;
    const cat = i.category || '-';
    counts[cat] = counts[cat] || {};
    counts[cat][code] = (counts[cat][code] || 0) + 1;
  });
  const dupes = {};
  Object.keys(counts).forEach(cat => {
    const codes = Object.keys(counts[cat]).filter(c => counts[cat][c] > 1)
      .map(c => ({ code: c, count: counts[cat][c] }));
    if(codes.length) dupes[cat] = codes;
  });
  return dupes;
}

function formatDuplicateCodesMessage(dupes){
  return Object.keys(dupes).map(cat => {
    const lines = dupes[cat].map(d => `  • ${d.code} (ซ้ำ ${d.count} รายการ)`).join('\n');
    return `[${catLabel(cat)}]\n${lines}`;
  }).join('\n\n');
}

function readAndResizeImage(file, maxDim){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('โหลดรูปไม่สำเร็จ'));
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else { width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

const CSV_HEADERS = ['หมวดหมู่','รหัสทรัพย์สิน','ชื่อรายการ','สถานที่','วันที่ซื้อ','จำนวน','มูลค่า','ยี่ห้อ','รุ่น','เลขซีเรียล','ผู้จำหน่าย','ผู้รับผิดชอบ','หมายเหตุ'];

function csvEscape(val){
  const s = (val === null || val === undefined) ? '' : String(val);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function downloadCsvTemplate(){
  const exampleRows = CATEGORIES.map(cat => ([
    cat.label, '', 'ตัวอย่าง เช่น เก้าอี้สำนักงาน', 'ตัวอย่าง เช่น ชั้น 2', '2026-01-15', '1', '1500', '', '', '', '', '', ''
  ]));
  const lines = [CSV_HEADERS.join(',')].concat(exampleRows.map(r => r.map(csvEscape).join(',')));
  const csvContent = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `เท็มเพลทนำเข้าทรัพย์สิน_${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function parseCSV(text){
  // Strip BOM
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\r'){ /* ignore, handled by \n */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => String(f).trim() !== ''));
}

function findCategoryKey(raw){
  const val = String(raw || '').trim();
  if(!val) return null;
  const byKey = CATEGORIES.find(c => c.key === val);
  if(byKey) return byKey.key;
  const byLabel = CATEGORIES.find(c => c.label === val || c.label.trim() === val);
  if(byLabel) return byLabel.key;
  const byPrefix = CATEGORIES.find(c => c.prefix === val);
  if(byPrefix) return byPrefix.key;
  return null;
}

  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    reader.onload = () => resolve(reader.result);
    reader.readAsText(file, 'UTF-8');
  });
}

async function handleCsvImport(file){
  let text;
  try{ text = await readTextFile(file); }
  catch(e){ alert('อ่านไฟล์ไม่สำเร็จ'); return; }

  const rows = parseCSV(text);
  if(rows.length < 2){ alert('ไม่พบข้อมูลในไฟล์ CSV'); return; }

  const header = rows[0].map(h => String(h).trim());
  const idx = {};
  CSV_HEADERS.forEach(h => { idx[h] = header.indexOf(h); });

    return;
  }

  // track next auto-code counter per category so a batch of rows without
  // an explicit code each get a unique, sequential code
  const codeCounters = {};
  CATEGORIES.forEach(cat => {
    let max = 0;
    items.filter(i => i.category === cat.key).forEach(i => {
      const m = (i.code||'').match(new RegExp('^' + cat.prefix + '-(\\d+)$'));
      if(m) max = Math.max(max, parseInt(m[1], 10));
    });
    codeCounters[cat.key] = max;
  });

  const newItems = [];
  const errors = [];
  rows.slice(1).forEach((r, n) => {
    const get = (h) => idx[h] !== -1 && idx[h] !== undefined ? (r[idx[h]] || '').trim() : '';
    const catRaw = get('หมวดหมู่');
    const name = get('ชื่อรายการ');
    const category = findCategoryKey(catRaw);
    if(!category){ errors.push(`แถวที่ ${n+2}: ไม่พบหมวดหมู่ "${catRaw}"`); return; }
    if(!name){ errors.push(`แถวที่ ${n+2}: ไม่ได้ระบุชื่อรายการ`); return; }
    const qtyRaw = get('จำนวน');
    const valueRaw = get('มูลค่า');
    let code = get('รหัสทรัพย์สิน');
    if(!code){
      const cat = CATEGORIES.find(c => c.key === category);
      codeCounters[category] = (codeCounters[category] || 0) + 1;
      code = `${cat.prefix}-${String(codeCounters[category]).padStart(4,'0')}`;
    }
    newItems.push({
      id: uid(),
      createdAt: todayStr(),
      category,
      code,
      name,
      location: get('สถานที่') || null,
      purchaseDate: get('วันที่ซื้อ') || null,
      qty: qtyRaw ? Number(qtyRaw) : null,
      value: valueRaw ? Number(valueRaw.replace(/,/g,'')) : null,
      brand: get('ยี่ห้อ') || null,
      model: get('รุ่น') || null,
      serialNo: get('เลขซีเรียล') || null,
      supplier: get('ผู้จำหน่าย') || null,
      responsible: get('ผู้รับผิดชอบ') || null,
      note: get('หมายเหตุ') || null
    });
  });

  if(newItems.length === 0){
    alert('ไม่สามารถนำเข้าข้อมูลได้:\n' + errors.join('\n'));
    return;
  }

  items = items.concat(newItems);
  await saveItems();
  render();

  let msg = `นำเข้าสำเร็จ ${newItems.length.toLocaleString('th-TH')} รายการ`;
  if(errors.length) msg += `\n\nข้ามไป ${errors.length} แถว:\n` + errors.join('\n');

  const dupes = findDuplicateCodesByCategory(items);
  if(Object.keys(dupes).length){
    msg += `\n\n⚠ พบรหัสทรัพย์สินซ้ำกัน กรุณาตรวจสอบและแก้ไข แยกตามหมวดหมู่:\n\n${formatDuplicateCodesMessage(dupes)}`;
  }
  alert(msg);
}

async function loadData(){
  await loadCategories();
  try{
    const r = await window.storage.get(STORAGE_KEY_ITEMS);
    items = r ? JSON.parse(r.value) : [];
  }catch(e){ items = []; }
  await loadImages();
  await loadDocs();
  render();
}
async function loadImages(){
  images = {};
  try{
    const listing = await window.storage.list(IMAGE_KEY_PREFIX, false);
    const keys = (listing && listing.keys) || [];
    await Promise.all(keys.map(async (key) => {
      try{
        const doc = await window.storage.get(key);
        if(doc) images[key.slice(IMAGE_KEY_PREFIX.length)] = doc.value;
      }catch(e){ /* skip missing/broken image doc */ }
    }));
  }catch(e){ console.error('load images failed', e); }
}
async function loadDocs(){
  docs = {};
  try{
    const listing = await window.storage.list(DOC_KEY_PREFIX, false);
    const keys = (listing && listing.keys) || [];
    await Promise.all(keys.map(async (key) => {
      try{
        const rec = await window.storage.get(key);
        if(rec) docs[key.slice(DOC_KEY_PREFIX.length)] = JSON.parse(rec.value);
      }catch(e){ /* skip missing/broken attachment */ }
    }));
  }catch(e){ console.error('load docs failed', e); }
}
async function saveItems(){
  try{ await window.storage.set(STORAGE_KEY_ITEMS, JSON.stringify(items), false); }
  catch(e){ console.error('save items failed', e); }
}
async function saveItemImage(itemId, dataUrl){
  try{
    await window.storage.set(IMAGE_KEY_PREFIX + itemId, dataUrl, false);
    images[itemId] = dataUrl;
  }catch(e){ console.error('save image failed', e); }
}
async function deleteItemImage(itemId){
  try{ await window.storage.delete(IMAGE_KEY_PREFIX + itemId, false); }
  catch(e){ /* ignore if already missing */ }
  delete images[itemId];
}
async function saveItemDoc(itemId, name, dataUrl){
  try{
    await window.storage.set(DOC_KEY_PREFIX + itemId, JSON.stringify({ name, dataUrl }), false);
    docs[itemId] = { name, dataUrl };
  }catch(e){ console.error('save doc failed', e); }
}
async function deleteItemDoc(itemId){
  try{ await window.storage.delete(DOC_KEY_PREFIX + itemId, false); }
  catch(e){ /* ignore if already missing */ }
  delete docs[itemId];
}

async function importFromExcel(){
  const importBtn = document.getElementById('btnImportEquipment');
  const hasExisting = items.length > 0;
  const confirmMsg = hasExisting
    ? `การนำเข้าข้อมูลจะลบรายการทรัพย์สินเดิมทั้งหมด (${items.length.toLocaleString('th-TH')} รายการ รวมรูปภาพและเอกสารแนบ) แล้วแทนที่ด้วยข้อมูลใหม่ ${EQUIPMENT_SEED.length.toLocaleString('th-TH')} รายการ ต้องการดำเนินการต่อหรือไม่?`
    : `ต้องการนำเข้าข้อมูล ${EQUIPMENT_SEED.length.toLocaleString('th-TH')} รายการหรือไม่?`;
  if(!confirm(confirmMsg)) return;

  const oldItems = items.slice();
  const oldBtnLabel = importBtn ? importBtn.textContent : '';
  if(importBtn){ importBtn.disabled = true; importBtn.textContent = 'กำลังนำเข้าข้อมูล...'; }

  try{
    // แทนที่รายการทันที (บันทึกครั้งเดียว) เพื่อให้เห็นผลเร็ว ไม่ต้องรอลบรูป/เอกสารเก่าก่อน
    const rows = EQUIPMENT_SEED.map(row => ({ id: uid(), importSource: IMPORT_SOURCE_TAG, createdAt: todayStr(), ...row }));
    items = rows;
    await saveItems();
    render();

    // เคลียร์รูปภาพ/เอกสารแนบของรายการเดิมแบบทำงานเบื้องหลัง ไม่บล็อก UI
    // (ถ้ามีรายการเก่าจำนวนมาก การลบทีละรายการอาจใช้เวลานาน จึงไม่ await ตรงนี้)
    if(oldItems.length){
      Promise.all(oldItems.map(i => Promise.all([deleteItemImage(i.id), deleteItemDoc(i.id)])))
        .catch(e => console.error('ล้างรูป/เอกสารเก่าไม่สำเร็จบางส่วน', e));
    }

    const dupes = findDuplicateCodesByCategory(items);
    if(Object.keys(dupes).length){
      alert(`นำเข้าข้อมูลสำเร็จ ${items.length.toLocaleString('th-TH')} รายการ\n\n⚠ พบรหัสทรัพย์สินซ้ำกัน กรุณาตรวจสอบและแก้ไข แยกตามหมวดหมู่:\n\n${formatDuplicateCodesMessage(dupes)}`);
    } else {
      alert(`นำเข้าข้อมูลสำเร็จ ${items.length.toLocaleString('th-TH')} รายการ ไม่พบรหัสทรัพย์สินซ้ำ`);
    }
  }catch(e){
    console.error('นำเข้าข้อมูลไม่สำเร็จ', e);
    alert('เกิดข้อผิดพลาดระหว่างนำเข้าข้อมูล กรุณาลองใหม่อีกครั้ง\n\n' + (e && e.message ? e.message : e));
    render();
  }
}

function go(name, params){
  view = { name, params: params||{} };
  render();
}

function render(){
  const app = document.getElementById('app');

  // เก็บสถานะโฟกัส/เคอร์เซอร์ของ input ที่กำลังพิมพ์อยู่ไว้ก่อน
  // เพราะ innerHTML ด้านล่างจะสร้าง element ใหม่ทั้งหมด ทำให้เสียโฟกัส
  const active = document.activeElement;
  let focusInfo = null;
  if (active && app.contains(active) && active.id) {
    focusInfo = {
      id: active.id,
      selectionStart: (typeof active.selectionStart === 'number') ? active.selectionStart : null,
      selectionEnd: (typeof active.selectionEnd === 'number') ? active.selectionEnd : null
    };
  }

  app.innerHTML = `<div id="stickyHeader" style="position:sticky;top:0;z-index:100;background:#fff;box-shadow:0 1px 0 var(--line);">${topbarHtml()}${categoryTabsHtml()}</div>` + bodyHtml();
  attachHandlers();
  positionListHeader();

  // คืนโฟกัส/ตำแหน่งเคอร์เซอร์กลับไปที่ element เดิม (เช่น ช่องค้นหา)
  if (focusInfo) {
    const el = document.getElementById(focusInfo.id);
    if (el) {
      el.focus();
      if (focusInfo.selectionStart !== null && typeof el.setSelectionRange === 'function') {
        try { el.setSelectionRange(focusInfo.selectionStart, focusInfo.selectionEnd); } catch(e) {}
      }
    }
  }
}

function positionListHeader(){

        <div class="field">
          <label>ยี่ห้อ</label>
          <input type="text" name="brand" placeholder="เช่น SINMAG" value="${escapeAttr(editing?.brand||'')}">
        </div>
        <div class="field">
          <label>รุ่น</label>
          <input type="text" name="model" placeholder="เช่น SM-25" value="${escapeAttr(editing?.model||'')}">
        </div>
        <div class="field">
          <label>เลขซีเรียล</label>
          <input type="text" name="serialNo" placeholder="Serial number" value="${escapeAttr(editing?.serialNo||'')}">
        </div>
        <div class="field">
          <label>จำนวน</label>
          <input type="number" name="qty" placeholder="1" value="${escapeAttr(editing?.qty ?? '1')}">
        </div>
        <div class="field">
          <label>วันที่ซื้อ</label>
          <input type="date" name="purchaseDate" value="${escapeAttr(editing?.purchaseDate||'')}">
        </div>
        <div class="field">
          <label>มูลค่า (บาท)</label>
          <input type="number" name="value" placeholder="0" value="${escapeAttr(editing?.value||'')}">
          ${cat === 'ทรัพย์สินที่ไม่ลงทะเบียน' ? `<p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">หมวดนี้ควรมีมูลค่าต่ำกว่า 10,000 บาท</p>` : ''}
        </div>
        <div class="field full">
          <label>หมายเหตุ</label>
          <input type="text" name="note" placeholder="ข้อมูลเพิ่มเติม เช่น ผู้จำหน่าย ผู้รับผิดชอบ" value="${escapeAttr(editing?.note||'')}">
        </div>
      </div>

      <div class="form-actions">
        ${editing ? `<button type="button" class="btn btn-danger" id="btnDeleteItem">ลบรายการ</button>` : ''}
        <button type="button" class="btn" data-nav="dashboard" data-cat="${escapeAttr(cat)}">ยกเลิก</button>
        <button type="submit" class="btn btn-primary">${editing ? 'บันทึกการแก้ไข' : 'บันทึกรายการ'}</button>
      </div>
    </form>
  </div>`;
}

// ---------- ITEM DETAIL ----------

  if(!i) return `<p>ไม่พบรายการ</p>`;

  const kvRows = `
    <div><span class="k">รหัสทรัพย์สิน</span><span class="v">${escapeHtml(i.code||'-')}</span></div>
    <div><span class="k">หมวดหมู่</span><span class="v">${escapeHtml(catLabel(i.category))}</span></div>
    <div><span class="k">สถานที่</span><span class="v">${escapeHtml(i.location||'-')}</span></div>
    <div><span class="k">ยี่ห้อ / รุ่น</span><span class="v">${escapeHtml(i.brand||'-')} / ${escapeHtml(i.model||'-')}</span></div>
    <div><span class="k">เลขซีเรียล</span><span class="v">${escapeHtml(i.serialNo||'-')}</span></div>
    <div><span class="k">จำนวน</span><span class="v">${escapeHtml(i.qty ?? '-')}</span></div>
    <div><span class="k">วันที่ซื้อ</span><span class="v">${fmtDate(i.purchaseDate)}</span></div>
    <div><span class="k">มูลค่า</span><span class="v">${fmtMoney(i.value)}</span></div>
  `;

  return `
  <div class="back-row"><button class="btn-ghost" data-nav="dashboard" data-cat="${escapeAttr(i.category)}">← กลับแดชบอร์ด</button></div>
  <div class="card">
    <div class="detail-head">
      <div style="display:flex;gap:14px;align-items:flex-start;">
        ${images[i.id] ? `<img src="${images[i.id]}" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex-shrink:0;">` : ''}
        <div>
          <h2>${escapeHtml(i.name||'(ไม่ระบุชื่อ)')}</h2>
          <p>${escapeHtml(catLabel(i.category))}</p>
        </div>
      </div>
      <div class="detail-actions">
        <button class="btn" data-edit-item="${i.id}">แก้ไขข้อมูล</button>
      </div>
    </div>

    <div class="kv">${kvRows}</div>
    ${i.note ? `<p style="font-size:13px;color:var(--ink-soft);margin:-6px 0 0;">หมายเหตุ: ${escapeHtml(i.note)}</p>` : ''}
    ${docs[i.id] ? `<p style="font-size:13px;margin:10px 0 0;"><a href="${docs[i.id].dataUrl}" download="${escapeAttr(docs[i.id].name)}" style="color:var(--brand,#2563eb);text-decoration:underline;">📎 ดาวน์โหลดไฟล์แนบ: ${escapeHtml(docs[i.id].name)}</a></p>` : ''}
  </div>`;
}

// ---------- HELPERS ----------
function sortItems(list, sortKey, sortDir){
  const key = sortKey || 'code';
  const dir = sortDir === 'desc' ? -1 : 1;
  const isNumeric = key === 'qty' || key === 'value';
  const getVal = (i) => {
    switch(key){
      case 'name': return i.code || '';
      case 'brand': return `${i.brand||''} ${i.model||''}`.trim();
      case 'qty': return i.qty;
      case 'location': return i.location || '';
      case 'purchaseDate': return i.purchaseDate || '';
      case 'value': return i.value;
      case 'note': return i.note || '';
      default: return i.code || '';
    }
  };
  return list.slice().sort((a, b) => {
    const va = getVal(a), vb = getVal(b);
    if(isNumeric){
      const na = (va===null || va===undefined || va==='') ? null : Number(va);
      const nb = (vb===null || vb===undefined || vb==='') ? null : Number(vb);
      if(na===null && nb===null) return 0;
      if(na===null) return 1;
      if(nb===null) return -1;
      return (na - nb) * dir;
    }
    const sa = String(va||'');
    const sb = String(vb||'');
    if(!sa && sb) return 1;
    if(sa && !sb) return -1;
    if(!sa && !sb) return 0;
    return sa.localeCompare(sb, 'th', { numeric: true, sensitivity: 'base' }) * dir;
  });
}
function escapeHtml(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

// ---------- EVENT HANDLERS ----------
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => {
      const name = el.getAttribute('data-nav');
      const itemId = el.getAttribute('data-item');
      const cat = el.getAttribute('data-cat') || currentCat();
      go(name, itemId ? { itemId, cat } : { cat });
    });
  });
  document.querySelectorAll('[data-select-cat]').forEach(btn => {
    btn.addEventListener('click', () => go('dashboard', { cat: btn.getAttribute('data-select-cat') }));
  });
  const btnAddCategory = document.getElementById('btnAddCategory');
  if(btnAddCategory) btnAddCategory.addEventListener('click', () => addCategory());

  const btnAddItem = document.getElementById('btnAddItem');
  if(btnAddItem) btnAddItem.addEventListener('click', () => go('itemForm', { cat: currentCat() }));
  const btnAddItemEmpty = document.getElementById('btnAddItemEmpty');
  if(btnAddItemEmpty) btnAddItemEmpty.addEventListener('click', () => go('itemForm', { cat: currentCat() }));
  const btnImportEquipment = document.getElementById('btnImportEquipment');
  if(btnImportEquipment) btnImportEquipment.addEventListener('click', () => importFromExcel());
  const btnExportExcel = document.getElementById('btnExportExcel');
  if(btnExportExcel) btnExportExcel.addEventListener('click', () => exportItemsToExcel());
  const btnCsvTemplate = document.getElementById('btnCsvTemplate');
  if(btnCsvTemplate) btnCsvTemplate.addEventListener('click', () => downloadCsvTemplate());
  const btnCsvImport = document.getElementById('btnCsvImport');
  const csvImportInput = document.getElementById('csvImportInput');
  if(btnCsvImport && csvImportInput){
    btnCsvImport.addEventListener('click', () => csvImportInput.click());
    csvImportInput.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if(file) await handleCsvImport(file);
      csvImportInput.value = '';
    });
  }

  const imageInput = document.getElementById('imageInput');
  if(imageInput){
    imageInput.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      try{
        const dataUrl = await readAndResizeImage(file, 480);
        formImageState = { action: 'replace', dataUrl };
        const preview = document.getElementById('imagePreview');
        if(preview) preview.innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover;">`;
      }catch(err){ console.error('image resize failed', err); }
    });
  }
  const btnRemoveImage = document.getElementById('btnRemoveImage');
  if(btnRemoveImage){
    btnRemoveImage.addEventListener('click', () => {
      formImageState = { action: 'remove', dataUrl: null };
      const preview = document.getElementById('imagePreview');
      if(preview) preview.innerHTML = `<span style="font-size:11px;color:var(--ink-faint);">ไม่มีรูป</span>`;
      btnRemoveImage.remove();
    });
  }

  const docInput = document.getElementById('docInput');
  if(docInput){
    docInput.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      if(file.size > 4*1024*1024){
        alert('ไฟล์มีขนาดใหญ่เกินไป (จำกัดไม่เกิน 4MB ต่อไฟล์)');
        docInput.value = '';
        return;
      }
      try{
        const dataUrl = await readFileAsDataUrl(file);
        formDocState = { action: 'replace', name: file.name, dataUrl };
        const preview = document.getElementById('docPreview');
        if(preview) preview.textContent = `📎 ${file.name}`;
      }catch(err){ console.error('read doc failed', err); }
    });
  }
  const btnRemoveDoc = document.getElementById('btnRemoveDoc');
  if(btnRemoveDoc){
    btnRemoveDoc.addEventListener('click', () => {
      formDocState = { action: 'remove', name: null, dataUrl: null };
      const preview = document.getElementById('docPreview');
      if(preview) preview.textContent = 'ยังไม่มีไฟล์แนบ';
      btnRemoveDoc.remove();
    });
  }

  document.querySelectorAll('[data-open-item]').forEach(tr => {
    tr.addEventListener('click', () => go('itemDetail', { itemId: tr.getAttribute('data-open-item'), cat: currentCat() }));
  });

  document.querySelectorAll('[data-sort-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.getAttribute('data-sort-key');
      const defaultDir = th.getAttribute('data-default-dir') || 'asc';
      const curKey = (view.params && view.params.sortKey) || 'code';
      const curDir = (view.params && view.params.sortDir) || 'desc';
      const newDir = (curKey === key) ? (curDir === 'asc' ? 'desc' : 'asc') : defaultDir;
      go('dashboard', { ...(view.params||{}), sortKey: key, sortDir: newDir });
    });
  });

  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.addEventListener('input', () => {
      go('dashboard', { ...(view.params||{}), q: searchInput.value });
    });
  }

  const itemForm = document.getElementById('itemForm');
  if(itemForm){
    itemForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(itemForm);
      const data = Object.fromEntries(fd.entries());
      const editingId = view.params && view.params.itemId;
      const itemId = editingId || uid();
      if(editingId){
        const idx = items.findIndex(x => x.id === editingId);
        items[idx] = { ...items[idx], ...data };
      } else {
        items.push({ id: itemId, createdAt: todayStr(), ...data });
      }
      await saveItems();
      if(formImageState.action === 'replace'){
        await saveItemImage(itemId, formImageState.dataUrl);
      } else if(formImageState.action === 'remove'){
        await deleteItemImage(itemId);
      }
      if(formDocState.action === 'replace'){
        await saveItemDoc(itemId, formDocState.name, formDocState.dataUrl);
      } else if(formDocState.action === 'remove'){
        await deleteItemDoc(itemId);
      }
      formImageState = { action: 'keep', dataUrl: null };
      formDocState = { action: 'keep', name: null, dataUrl: null };
      go('dashboard', { cat: data.category });
    });
  }
  const btnDeleteItem = document.getElementById('btnDeleteItem');
  if(btnDeleteItem){
    btnDeleteItem.addEventListener('click', async () => {
      const editingId = view.params && view.params.itemId;
      const cat = view.params && view.params.cat;
      items = items.filter(x => x.id !== editingId);
      await saveItems();
      await deleteItemImage(editingId);
      await deleteItemDoc(editingId);
      go('dashboard', { cat });
    });
  }

  document.querySelectorAll('[data-edit-item]').forEach(btn => {
    btn.addEventListener('click', () => go('itemForm', { itemId: btn.getAttribute('data-edit-item'), cat: currentCat() }));
  });
}

loadData();
</script>
