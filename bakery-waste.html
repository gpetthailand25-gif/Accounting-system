<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakery Waste Manifest — ระบบบันทึกของเสีย</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #171310; --surface: #211A15; --surface-2: #2A211A; --border: #3A2E22;
    --text: #F1E8DD; --text-muted: #A6968A; --accent: #C98A4B; --accent-dim: #5B4127;
    --money: #E0B65C; --warn: #D08A3E; --danger: #B2554A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans Thai', sans-serif;
    background: #0E0B09;
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px;
  }
  .wt-mono { font-family: 'IBM Plex Mono', monospace; }

  #app { max-width: 1180px; margin: 0 auto; background: var(--bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }

  .wt-header { padding: 22px 24px 16px; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, #1D1712 0%, #171310 100%); }
  .wt-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: var(--accent); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .wt-eyebrow::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .wt-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; margin: 4px 0 14px; }
  .wt-tabs { display: flex; gap: 6px; }
  .wt-tab { font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 7px 7px 0 0; background: transparent; border: 1px solid transparent; color: var(--text-muted); cursor: pointer; font-family: inherit; }
  .wt-tab.active { color: var(--text); background: var(--surface); border-color: var(--border); border-bottom-color: var(--surface); }
  .wt-tab:hover:not(.active) { color: var(--text); }

  .wt-body { padding: 20px 24px 28px; background: var(--surface); }

  .wt-entry-grid { display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
  @media (max-width: 780px) { .wt-entry-grid { grid-template-columns: 1fr; } }

  .wt-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .wt-card h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; margin: 0 0 14px; border-left: 3px solid var(--accent); padding-left: 9px; }
  .wt-field { margin-bottom: 12px; }
  .wt-field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; font-weight: 500; }
  .wt-field input, .wt-field select, .wt-field textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 9px 10px; font-size: 14px; font-family: 'IBM Plex Sans Thai', sans-serif; outline: none; }
  .wt-field input:focus, .wt-field select:focus, .wt-field textarea:focus { border-color: var(--accent); }
  .wt-field input:disabled { opacity: 0.6; }
  .wt-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .wt-link { color: var(--accent); cursor: pointer; text-decoration: underline; background: none; border: none; padding: 0; font-size: 11px; font-family: inherit; }
  .wt-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .wt-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .wt-error { font-size: 12.5px; color: var(--warn); margin: -4px 0 10px; min-height: 1px; }

  .wt-total-box { background: var(--bg); border: 1px dashed var(--accent-dim); border-radius: 7px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .wt-total-box .lbl { font-size: 12.5px; color: var(--text-muted); }
  .wt-total-box .val { font-family: 'IBM Plex Mono', monospace; font-size: 18px; color: var(--money); font-weight: 600; }

  .wt-photo-zone { border: 1.5px dashed var(--border); border-radius: 8px; padding: 12px; text-align: center; background: var(--bg); margin-bottom: 4px; }
  .wt-photo-zone input[type=file] { display: none; }
  .wt-photo-label { display: inline-block; font-size: 13px; color: var(--accent); cursor: pointer; font-weight: 600; border: 1px solid var(--accent-dim); padding: 6px 14px; border-radius: 6px; }
  .wt-photo-label:hover { background: var(--accent-dim); }
  .wt-photo-preview-list { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; justify-content: center; min-height: 0; }
  .wt-photo-preview { position: relative; display: inline-block; }
  .wt-photo-preview img { width: 78px; height: 78px; object-fit: cover; border-radius: 6px; border: 3px solid var(--surface); outline: 1px solid var(--border); transform: rotate(-1.5deg); box-shadow: 0 3px 8px rgba(0,0,0,0.35); }
  .wt-photo-preview:nth-child(even) img { transform: rotate(1.5deg); }
  .wt-photo-remove { position: absolute; top: -8px; right: -8px; background: var(--danger); color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; cursor: pointer; line-height: 1; }

  .wt-submit { width: 100%; background: var(--accent); color: #1D1508; font-weight: 700; border: none; border-radius: 7px; padding: 11px; font-size: 14.5px; cursor: pointer; margin-top: 4px; font-family: inherit; }
  .wt-submit:hover { filter: brightness(1.1); }
  .wt-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .wt-save-state { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 8px; font-family: 'IBM Plex Mono', monospace; min-height: 14px; }

  .wt-ledger-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .wt-filter-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .wt-filter-row input[type=date] { width: auto; min-width: 128px; }
  .wt-search-input { flex: 1; min-width: 140px; }
  .wt-filter-sep { color: var(--text-muted); font-size: 12px; }
  .wt-csv-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); border-radius: 6px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; }
  .wt-csv-btn:hover { color: var(--text); border-color: var(--accent); }
  .wt-csv-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .wt-table-wrap { overflow-x: auto; max-height: 560px; overflow-y: auto; }
  table.wt-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.wt-table thead th { text-align: left; font-weight: 600; color: var(--text-muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 8px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface-2); }
  table.wt-table td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.wt-table tr:hover td { background: rgba(255,255,255,0.02); }
  .wt-tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .wt-thumb { width: 34px; height: 34px; object-fit: cover; border-radius: 5px; cursor: pointer; border: 1px solid var(--border); }
  .wt-thumb-wrap { position: relative; width: 34px; height: 34px; }
  .wt-thumb-badge { position: absolute; bottom: -4px; right: -4px; background: var(--accent); color: #1D1508; font-size: 9px; font-weight: 700; border-radius: 8px; padding: 1px 4px; line-height: 1.3; font-family: 'IBM Plex Mono', monospace; }
  .wt-thumb-empty { width: 34px; height: 34px; border-radius: 5px; border: 1px dashed var(--border); color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .wt-del { background: transparent; border: 1px solid var(--border); color: var(--text-muted); border-radius: 5px; width: 24px; height: 24px; cursor: pointer; font-size: 12px; }
  .wt-del:hover { color: var(--danger); border-color: var(--danger); }
  .wt-edit-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); border-radius: 5px; padding: 4px 9px; cursor: pointer; font-size: 11.5px; font-family: inherit; }
  .wt-edit-btn:hover { color: var(--accent); border-color: var(--accent); }
  .wt-empty { color: var(--text-muted); font-size: 13.5px; text-align: center; padding: 30px 0; }
  .wt-prod-code { color: var(--text-muted); font-size: 11px; }
  .wt-run-no { color: var(--accent); font-weight: 600; white-space: nowrap; }
  .wt-rootcause-cell { max-width: 220px; white-space: normal; font-size: 12px; line-height: 1.5; color: var(--text); }

  .wt-stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
  @media (max-width: 700px) { .wt-stat-row { grid-template-columns: 1fr; } }
  .wt-stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .wt-stat .lbl { font-size: 11.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; font-family: 'IBM Plex Mono', monospace; }
  .wt-stat .val { font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 700; margin-top: 4px; color: var(--money); }
  .wt-stat .val span { font-size: 15px; color: var(--text-muted); font-family: 'IBM Plex Sans Thai', sans-serif; font-weight: 500; margin-left: 4px; }
  .wt-stat .sub { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }

  .wt-range-toggle { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .wt-range-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 14px; border-radius: 20px; font-size: 12.5px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; }
  .wt-range-btn.active { background: var(--accent-dim); color: var(--text); border-color: var(--accent); }

  .wt-dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 800px) { .wt-dash-grid { grid-template-columns: 1fr; } }

  .wt-gauges { display: flex; flex-direction: column; gap: 11px; }
  .wt-gauge-row { display: flex; align-items: center; gap: 10px; }
  .wt-gauge-label { width: 150px; font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
  .wt-gauge-track { flex: 1; height: 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 3px; overflow: hidden; background-image: repeating-linear-gradient(90deg, transparent, transparent 9px, rgba(255,255,255,0.04) 9px, rgba(255,255,255,0.04) 10px); }
  .wt-gauge-fill { height: 100%; border-radius: 2px; }
  .wt-gauge-val { width: 90px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 12px; flex-shrink: 0; }

  .wt-source-table { width: 100%; font-size: 13px; border-collapse: collapse; }
  .wt-source-table td { padding: 7px 4px; border-bottom: 1px solid var(--border); }
  .wt-source-table .name-cell { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wt-source-bar-track { background: var(--bg); border-radius: 3px; height: 8px; overflow: hidden; border: 1px solid var(--border); }
  .wt-source-bar-fill { height: 100%; background: var(--money); }

  .wt-trend { display: flex; align-items: flex-end; gap: 4px; height: 160px; padding-top: 10px; }
  .wt-trend-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .wt-trend-bar { width: 100%; max-width: 22px; background: var(--money); border-radius: 3px 3px 0 0; min-height: 2px; }
  .wt-trend-label { font-size: 9px; color: var(--text-muted); margin-top: 5px; font-family: 'IBM Plex Mono', monospace; writing-mode: vertical-rl; transform: rotate(180deg); height: 34px; }

  .wt-loading, .wt-empty-page { padding: 60px; text-align: center; color: var(--text-muted); }
  .wt-lightbox { position: fixed; inset: 0; background: rgba(10,7,5,0.85); display: flex; align-items: center; justify-content: center; z-index: 999; cursor: zoom-out; }
  .wt-lightbox img { max-width: 90%; max-height: 85%; border-radius: 8px; border: 4px solid var(--surface-2); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  .wt-lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: #fff; border: none; width: 42px; height: 42px; border-radius: 50%; font-size: 22px; cursor: pointer; }
  .wt-lb-prev { left: 24px; }
  .wt-lb-next { right: 24px; }
  .wt-lb-count { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.5); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; }

  .wt-settings-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
  .wt-settings-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 800px) { .wt-settings-row { grid-template-columns: 1fr; } }
  .wt-chip-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; min-height: 20px; }
  .wt-chip { display: flex; align-items: center; gap: 7px; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 6px 8px 6px 13px; font-size: 12.5px; }
  .wt-chip-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .wt-chip button { background: transparent; border: none; color: var(--text-muted); cursor: pointer; width: 18px; height: 18px; border-radius: 50%; font-size: 11px; }
  .wt-chip button:hover { color: var(--danger); }
  .wt-inline-add { display: flex; gap: 8px; margin-top: 12px; }
  .wt-inline-add input { flex: 1; }
  .wt-inline-add button { background: var(--accent); color: #1D1508; border: none; border-radius: 6px; padding: 0 16px; font-weight: 700; cursor: pointer; font-size: 13px; font-family: inherit; }
  .wt-prod-form-row { display: grid; grid-template-columns: 1fr 1.4fr 0.8fr 0.9fr auto; gap: 8px; align-items: end; margin-bottom: 6px; }
  @media (max-width: 700px) { .wt-prod-form-row { grid-template-columns: 1fr 1fr; } }
  .wt-cancel-link { background: none; border: none; color: var(--text-muted); text-decoration: underline; cursor: pointer; font-size: 12px; margin-top: 6px; font-family: inherit; }
  .wt-note { font-size: 11.5px; color: var(--text-muted); margin: 10px 0 0; line-height: 1.6; }
</style>
</head>

<script>
(function () {
  "use strict";

  // ---------- constants ----------
  var TYPE_COLOR_PALETTE = ["#C98A4B", "#B2554A", "#9C7A3F", "#6F8FA6", "#8A9A6E", "#8B7E72", "#7C6C9C", "#4C9A85", "#A6684F", "#6B8E6E"];
  var ROLE_STORAGE_KEY = "bakery_waste_role_v1";
  var ACCESS_CODES = {
    "acc-741": { role: "accounting", label: "ฝ่ายบัญชี" },
    "pd-852":  { role: "production", label: "ฝ่ายโปรดักชั่น" }
  };
  // tabs each role is allowed to see ("accounting" sees everything)
  var ROLE_ALLOWED_TABS = {
    accounting: ["entry", "dashboard", "settings"],
    production: ["entry", "dashboard"]
  };
  var ROLE_LABELS = { accounting: "ฝ่ายบัญชี", production: "ฝ่ายโปรดักชั่น" };
  var DEFAULT_SETTINGS = {
    products: [],
    lines: ["ไลน์ขนมปัง", "ไลน์เค้ก", "ไลน์คุกกี้"],
    methods: ["ทิ้ง/กำจัด", "บริจาค", "นำไปเป็นอาหารสัตว์", "นำกลับมาผลิตใหม่", "อื่นๆ"],
    units: ["ชิ้น", "กก.", "ถาด", "โหล", "ก้อน", "แผ่น", "ถุง"],
    wasteTypes: [
      { id: "overprod", label: "ผลิตเกินความต้องการ", color: "#C98A4B" },
      { id: "expired",  label: "หมดอายุ/ตกรุ่น",       color: "#B2554A" },
      { id: "defect",   label: "ตำหนิ/เสียรูปทรง",     color: "#9C7A3F" },
      { id: "transport", label: "เสียหายระหว่างขนส่ง",  color: "#6F8FA6" },
      { id: "returned", label: "คืนจากหน้าร้าน",       color: "#8A9A6E" },
      { id: "other",    label: "อื่นๆ",                color: "#8B7E72" }
    ],
    company: {
      nameTh: "บริษัท อินโนว่า ฟู้ด แอนด์ เบค จำกัด",
      nameEn: "INNOVA FOOD & BAKE CO., LTD.",
      address: "(สำนักงานใหญ่) 66/358 หมู่ 12 ต.ไร่ขิง อ.สามพราน จ.นครปฐม 73210",
      tel: "(66)-2811-9988-89",
      fax: "(66)-2811-9990",
      email: "INNOVAFOODANDBAKE@GMAIL.COM"
    }
  };
  // ---------- state ----------
  var state = {
    role: null,
    roleLabel: "",
    loginError: "",
    entries: [],
    settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),
    tab: "entry",
    range: "30d",
    editingProductId: null,
    editingEntryId: null,
    lightboxEntryId: null,
    lightboxIndex: 0,
    pendingPhotos: [],
    photoBusy: false,
    formDefaults: { date: todayStr(), type: DEFAULT_SETTINGS.wasteTypes[0].id, line: "", method: "" },
    printModalOpen: false,
    printDefaults: null,
    ledgerSearch: "",
    ledgerDateFrom: "",
    ledgerDateTo: "",
    rangeStart: daysAgo(29),
    rangeEnd: todayStr()
  };

  function findWasteType(id) {
    var t = state.settings.wasteTypes.find(function (x) { return x.id === id; });
    return t || { id: id, label: id || "ไม่ระบุ", color: "#8B7E72" };
  }

  // ---------- utils ----------
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function daysAgo(n) { var d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
  function fmtNum(n) { return (n || 0).toLocaleString("th-TH", { maximumFractionDigits: 2 }); }
  function fmtBaht(n) { return (n || 0).toLocaleString("th-TH", { maximumFractionDigits: 2 }); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function nextAutoCode() { return "BK-" + String(state.settings.products.length + 1).padStart(4, "0"); }
  function getRangeBounds(rangeKey) {
    var end = todayStr();
    var start = rangeKey === "7d" ? daysAgo(6) : rangeKey === "30d" ? daysAgo(29) : "0000-00-00";
    if (rangeKey === "all" && state.entries.length) {
      var earliest = state.entries.reduce(function (min, e) { return e.date < min ? e.date : min; }, end);
      start = earliest;
    }
    return { start: start, end: end };
  }

  function fileToCompressedDataUrl(file, maxDim, quality) {
    maxDim = maxDim || 480; quality = quality || 0.55;
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error("อ่านไฟล์ไม่สำเร็จ")); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error("โหลดรูปภาพไม่สำเร็จ")); };
        img.onload = function () {
          var width = img.width, height = img.height;
          if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
          var canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ---------- persistence (Firebase Firestore + Storage) ----------
  var saveState = "idle", settingsSaveState = "idle";
  var entriesCol = fbDb.collection("entries");
  var settingsDocRef = fbDb.collection("meta").doc("settings");
  var entriesLoaded = false, settingsLoaded = false;
  var firestoreSyncStarted = false;

  function startAppAfterLogin() {
    if (entriesLoaded && settingsLoaded) { render(); return; }
    document.getElementById("app").innerHTML = '<div class="wt-empty-page">กำลังเชื่อมต่อฐานข้อมูล…</div>';
    if (firestoreSyncStarted) return; // listeners already attached; render() fires once data arrives
    firestoreSyncStarted = true;
    firebase.auth().signInAnonymously().then(function () {
      initFirestoreSync();
    }).catch(function (err) {
      console.error("auth failed", err);
      document.getElementById("app").innerHTML = '<div class="wt-empty-page">เข้าสู่ระบบ Firebase ไม่สำเร็จ: ' + esc(err.message) + "</div>";
    });
  }

  function initFirestoreSync() {
    settingsDocRef.onSnapshot(function (doc) {
      if (doc.exists) {
        state.settings = Object.assign({}, DEFAULT_SETTINGS, doc.data());
      } else {
        state.settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
        settingsDocRef.set(state.settings).catch(function (err) { console.error("seed settings failed", err); });
      }
      settingsLoaded = true;
      maybeRenderReady();
    }, function (err) {
      console.error("settings sync error", err);
      document.getElementById("app").innerHTML = '<div class="wt-empty-page">เชื่อมต่อฐานข้อมูลไม่สำเร็จ: ' + esc(err.message) + "</div>";
    });

    entriesCol.onSnapshot(function (snapshot) {
      state.entries = snapshot.docs.map(function (d) {
        var data = d.data();
        data.id = d.id;
        if (!data.photos) data.photos = data.photo ? [data.photo] : [];
        return data;
      });
      entriesLoaded = true;
      maybeRenderReady();
    }, function (err) {
      console.error("entries sync error", err);
      document.getElementById("app").innerHTML = '<div class="wt-empty-page">เชื่อมต่อฐานข้อมูลไม่สำเร็จ: ' + esc(err.message) + "</div>";
    });
  }
  function maybeRenderReady() {
    if (entriesLoaded && settingsLoaded) render();
  }

  function saveSettings() {
    settingsSaveState = "saving";
    updateSaveIndicator();
    settingsDocRef.set(state.settings)
      .then(function () { settingsSaveState = "saved"; updateSaveIndicator(); })
      .catch(function (err) { console.error(err); settingsSaveState = "error"; updateSaveIndicator(); });
  }

  function persistEntry(entry) {
    saveState = "saving";
    updateSaveIndicator();
    return entriesCol.doc(entry.id).set(entry)
      .then(function () { saveState = "saved"; updateSaveIndicator(); })
      .catch(function (err) { saveState = "error"; updateSaveIndicator(); throw err; });
  }
  function deleteEntryRemote(id) {
    saveState = "saving";
    updateSaveIndicator();
    entriesCol.doc(id).delete()
      .then(function () { saveState = "saved"; updateSaveIndicator(); })
      .catch(function (err) { console.error(err); saveState = "error"; updateSaveIndicator(); });
  }
  function updateSaveIndicator() {
    var el = document.getElementById("saveIndicator");
    if (el) {
      el.textContent = saveState === "saving" ? "กำลังบันทึก…" :
        saveState === "saved" ? "บันทึกแล้ว ✓" :
        saveState === "error" ? "บันทึกไม่สำเร็จ — พื้นที่จัดเก็บอาจเต็ม" : "ข้อมูลจะถูกบันทึกอัตโนมัติในเบราว์เซอร์นี้";
    }
    var el2 = document.getElementById("settingsSaveIndicator");
    if (el2) {
      el2.textContent = settingsSaveState === "saving" ? "กำลังบันทึกการตั้งค่า…" :
        settingsSaveState === "saved" ? "บันทึกการตั้งค่าแล้ว ✓" :
        settingsSaveState === "error" ? "บันทึกการตั้งค่าไม่สำเร็จ" : "";
    }
  }

  // ---------- auth (access code) ----------
  function handleSubmitLogin(e) {
    e.preventDefault();
    var input = document.getElementById("loginCodeField");
    var code = (input && input.value || "").trim().toLowerCase();
    var match = ACCESS_CODES[code];
    if (!match) {
      state.loginError = "รหัสไม่ถูกต้อง กรุณาลองใหม่";
      render();
      return;
    }
    state.role = match.role;
    state.roleLabel = match.label;
    state.loginError = "";
    try { localStorage.setItem(ROLE_STORAGE_KEY, match.role); } catch (err) { /* ignore */ }
    if (ROLE_ALLOWED_TABS[state.role].indexOf(state.tab) === -1) state.tab = "entry";
    startAppAfterLogin();
  }
  function handleLogout() {
    state.role = null;
    state.roleLabel = "";
    // NOTE: intentionally NOT clearing state.entries / entriesLoaded / settingsLoaded here.
    // The Firestore onSnapshot listeners stay subscribed in the background and only fire
    // again when the underlying data changes — clearing these flags on logout meant the
    // "connecting..." screen never got re-rendered after switching accounts (needed a
    // hard refresh to re-trigger the listeners). Keeping the cached data means the next
    // login just calls render() immediately via startAppAfterLogin().
    try { localStorage.removeItem(ROLE_STORAGE_KEY); } catch (err) { /* ignore */ }
    render();
  }
  function renderLogin() {
    return (
      '<div class="wt-empty-page" style="padding:40px 16px;">' +
        '<div class="wt-card" style="max-width:340px;margin:0 auto;text-align:left;">' +
          '<h3>เข้าสู่ระบบ</h3>' +
          '<form id="loginForm" data-action="submitLogin">' +
            '<div class="wt-field"><label>รหัสผ่านเข้าใช้งาน</label>' +
              '<input id="loginCodeField" type="password" placeholder="กรอกรหัสผ่าน" autofocus>' +
            "</div>" +
            '<div class="wt-error">' + esc(state.loginError) + "</div>" +
            '<button class="wt-submit" type="submit">เข้าสู่ระบบ</button>' +
          "</form>" +
          '<a href="index.html" class="wt-cancel-link" style="display:block;text-align:center;width:100%;margin-top:10px;">← กลับหน้าหลัก</a>' +
        "</div>" +
      "</div>"
    );
  }

  // ================= RENDER =================
  function render() {
    var app = document.getElementById("app");
    if (!state.role) { app.innerHTML = renderLogin(); return; }
    if (ROLE_ALLOWED_TABS[state.role].indexOf(state.tab) === -1) state.tab = "entry";
    app.innerHTML =
      renderHeader() +
      '<div class="wt-body">' +
        (state.tab === "entry" ? renderEntryTab() :
         state.tab === "dashboard" ? renderDashboardTab() : renderSettingsTab()) +
      "</div>" +
      renderLightbox() +
      renderPrintModal();
    updateSaveIndicator();
  }

  function renderHeader() {
    function tabBtn(id, label) {
      if (ROLE_ALLOWED_TABS[state.role].indexOf(id) === -1) return "";
      return '<button class="wt-tab ' + (state.tab === id ? "active" : "") + '" data-action="setTab" data-tab="' + id + '">' + label + "</button>";
    }
    return (
      '<div class="wt-header">' +
        '<div class="wt-eyebrow" style="justify-content:space-between;display:flex;">' +
          '<span>โรงงานเบเกอรี่ · ระบบบันทึกของเสีย</span>' +
          '<span class="wt-mono" style="color:var(--text-muted);display:flex;align-items:center;gap:10px;">' +
            (state.role !== "production" ? '<a href="index.html" class="wt-link" style="text-decoration:none;">← กลับหน้าหลัก</a>' : "") +
            esc(state.roleLabel) +
            '<button type="button" class="wt-link" data-action="logout" style="text-decoration:none;">ออกจากระบบ</button>' +
          "</span>" +
        "</div>" +
        '<div class="wt-title">Bakery Waste Manifest</div>' +
        '<div class="wt-tabs">' +
          tabBtn("entry", "บันทึกข้อมูล") +
          tabBtn("dashboard", "แดชบอร์ด &amp; รายงาน") +
          tabBtn("settings", "⚙ ตั้งค่า") +
        "</div>" +
      "</div>"
    );
  }

  function renderLightbox() {
    if (!state.lightboxEntryId) return "";
    var entry = state.entries.find(function (e) { return e.id === state.lightboxEntryId; });
    if (!entry) return "";
    var photos = entry.photos || [];
    if (!photos.length) return "";
    var idx = Math.max(0, Math.min(state.lightboxIndex, photos.length - 1));
    var nav = photos.length > 1
      ? '<button class="wt-lb-nav wt-lb-prev" data-action="lightboxPrev">‹</button>' +
        '<button class="wt-lb-nav wt-lb-next" data-action="lightboxNext">›</button>' +
        '<div class="wt-lb-count">' + (idx + 1) + " / " + photos.length + "</div>"
      : "";
    return '<div class="wt-lightbox" data-action="closeLightbox">' +
      '<img src="' + photos[idx] + '" alt="รูปของเสีย">' + nav +
      "</div>";
  }

  function renderPrintModal() {
    if (!state.printModalOpen) return "";
    var d = state.printDefaults || {};
    return (
      '<div class="wt-lightbox" data-action="closePrintModal" style="align-items:flex-start;padding-top:60px;">' +
        '<div class="wt-card" style="width:340px;max-width:90vw;text-align:left;">' +
          "<h3>สร้างรายงานสำหรับพิมพ์</h3>" +
          '<div class="wt-field"><label>จากวันที่</label><input type="date" id="printStartDate" value="' + esc(d.start) + '"></div>' +
          '<div class="wt-field"><label>ถึงวันที่</label><input type="date" id="printEndDate" value="' + esc(d.end) + '"></div>' +
          '<div class="wt-field"><label>เลขที่เอกสาร</label><input id="printDocNumber" value="' + esc(d.docNumber) + '"></div>' +
          '<button class="wt-submit" type="button" data-action="generatePrint">🖨 สร้าง &amp; พิมพ์รายงาน</button>' +
          '<button class="wt-cancel-link" type="button" data-action="closePrintModal" style="display:block;text-align:center;width:100%;margin-top:10px;">ยกเลิก</button>' +
        "</div>" +
      "</div>"
    );
  }

  function getFilteredLedgerEntries() {
    var q = state.ledgerSearch.trim().toLowerCase();
    var from = state.ledgerDateFrom, to = state.ledgerDateTo;
    return state.entries
      .filter(function (e) {
        if (from && e.date < from) return false;
        if (to && e.date > to) return false;
        if (q) {
          var hay = [e.productName, e.productCode, e.note, e.line, e.method].join(" ").toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      })
      .sort(function (a, b) { return (b.date + b.createdAt).localeCompare(a.date + a.createdAt); });
  }

  function getEntryStatus(entry) {
    var hasRootCause = entry.rootCause && entry.rootCause.trim();
    return hasRootCause
      ? { label: "เสร็จสมบูรณ์", color: "#6FA37A" }
      : { label: "รอ PD Confirm", color: "#D08A3E" };
  }

  function computeEntryRunNumbers() {
    var byDateOrder = state.entries.slice().sort(function (a, b) { return a.createdAt - b.createdAt; });
    var counters = {};
    var map = {};
    byDateOrder.forEach(function (e) {
      counters[e.date] = (counters[e.date] || 0) + 1;
      map[e.id] = e.date.replace(/-/g, "") + "-" + String(counters[e.date]).padStart(3, "0");
    });
    return map;
  }

  function renderLedgerRowsHtml(list) {
    if (list.length === 0) return '<div class="wt-empty">ไม่พบรายการที่ตรงกับตัวกรอง</div>';
    var runNumbers = computeEntryRunNumbers();
    return '<table class="wt-table"><thead><tr><th>เลขที่รายการ</th><th>รูป</th><th>วันที่</th><th>สินค้า</th><th>ประเภท</th><th>จำนวน</th><th>มูลค่า</th><th>สาเหตุ &amp; แนวทางแก้ไข</th><th>สถานะ</th><th></th></tr></thead><tbody>' +
      list.map(function (e) {
        var t = findWasteType(e.type);
        var status = getEntryStatus(e);
        var ePhotos = e.photos || [];
        var thumb = ePhotos.length
          ? '<div class="wt-thumb-wrap"><img class="wt-thumb" src="' + ePhotos[0] + '" alt="" data-action="openLightbox" data-id="' + e.id + '">' +
            (ePhotos.length > 1 ? '<span class="wt-thumb-badge">' + ePhotos.length + "</span>" : "") + "</div>"
          : '<div class="wt-thumb-empty">–</div>';
        var rootCauseCell = (e.rootCause && e.rootCause.trim())
          ? '<div class="wt-rootcause-cell">' + esc(e.rootCause) + "</div>"
          : '<span class="wt-prod-code">–</span>';
        return "<tr>" +
          '<td class="wt-mono wt-run-no">' + esc(runNumbers[e.id] || "-") + "</td>" +
          "<td>" + thumb + "</td>" +
          '<td class="wt-mono">' + esc(e.date) + "</td>" +
          "<td>" + esc(e.productName) + (e.productCode ? '<div class="wt-prod-code wt-mono">' + esc(e.productCode) + "</div>" : "") + "</td>" +
          '<td><span class="wt-tag" style="background:' + t.color + '26;color:' + t.color + '">' + esc(t.label) + "</span></td>" +
          '<td class="wt-mono">' + fmtNum(e.quantity) + " " + esc(e.unit) + "</td>" +
          '<td class="wt-mono" style="color:var(--money)">' + fmtBaht(e.totalAmount) + "</td>" +
          "<td>" + rootCauseCell + "</td>" +
          '<td><span class="wt-tag" style="background:' + status.color + '26;color:' + status.color + '">' + status.label + "</span></td>" +
          '<td style="display:flex;gap:6px;"><button class="wt-edit-btn" data-action="editEntry" data-id="' + e.id + '">แก้ไข</button>' +
          '<button class="wt-del" data-action="deleteEntry" data-id="' + e.id + '" title="ลบ">✕</button></td>' +
          "</tr>";
      }).join("") +
      "</tbody></table>";
  }

  function updateLedgerTable() {
    var filtered = getFilteredLedgerEntries();
    var wrap = document.getElementById("ledgerTableWrap");
    if (wrap) wrap.innerHTML = renderLedgerRowsHtml(filtered);
    var countEl = document.getElementById("ledgerCountText");
    if (countEl) countEl.textContent = "พบ " + filtered.length + " จากทั้งหมด " + state.entries.length + " รายการ";
  }

  function renderPhotoPreviewsHtml() {
    return state.pendingPhotos.map(function (dataUrl, i) {
      return '<div class="wt-photo-preview"><img src="' + dataUrl + '" alt="ตัวอย่างของเสีย"><button type="button" class="wt-photo-remove" data-action="removePhoto" data-index="' + i + '">✕</button></div>';
    }).join("");
  }

  // ---------------- ENTRY TAB ----------------
  function findMatchingProductId(entry) {
    var byCode = state.settings.products.find(function (p) { return entry.productCode && p.code === entry.productCode; });
    if (byCode) return byCode.id;
    var byName = state.settings.products.find(function (p) { return p.name === entry.productName; });
    return byName ? byName.id : "";
  }

    var fd = editingEntry ? { date: editingEntry.date, type: editingEntry.type, line: editingEntry.line, method: editingEntry.method } : state.formDefaults;
    var matchedProductId = editingEntry ? findMatchingProductId(editingEntry) : "";

    var initialQty = editingEntry ? editingEntry.quantity : "";
    var initialPrice = editingEntry ? editingEntry.unitPrice : "";
    var initialTotal = editingEntry ? editingEntry.totalAmount : 0;

      }).join("");

      state.settings.lines.map(function (l) { return '<option value="' + esc(l) + '"' + (l === fd.line ? " selected" : "") + ">" + esc(l) + "</option>"; }).join("");

              '<div class="wt-photo-zone" id="photoZone">' +
                '<label class="wt-photo-label" for="photoInput"><span id="photoLabelText">' + (state.photoBusy ? "กำลังประมวลผลรูป…" : (state.pendingPhotos.length ? "📎 เพิ่มรูปภาพ" : "📎 แนบรูปภาพ")) + "</span></label>" +

            '<input type="text" id="ledgerSearchField" class="wt-search-input" placeholder="🔎 ค้นหาสินค้า รหัส หมายเหตุ..." value="' + esc(state.ledgerSearch) + '">' +
            '<input type="date" id="ledgerDateFromField" value="' + esc(state.ledgerDateFrom) + '" title="จากวันที่">' +
            '<span class="wt-filter-sep">–</span>' +

  // ---------------- DASHBOARD TAB ----------------
  function renderDashboardTab() {
    var today = todayStr(), wk = daysAgo(6), monthPrefix = today.slice(0, 7);
    var t = 0, w = 0, m = 0, tC = 0, wC = 0, mC = 0;
    state.entries.forEach(function (e) {
      if (e.date === today) { t += e.totalAmount; tC++; }
      if (e.date >= wk) { w += e.totalAmount; wC++; }
      if (e.date.slice(0, 7) === monthPrefix) { m += e.totalAmount; mC++; }
    });

    var filtered = state.entries.filter(function (e) { return e.date >= state.rangeStart && e.date <= state.rangeEnd; });
    var filteredTotal = filtered.reduce(function (s, e) { return s + e.totalAmount; }, 0);

    var typeSums = {};
    filtered.forEach(function (e) { typeSums[e.type] = (typeSums[e.type] || 0) + e.totalAmount; });
    var byType = state.settings.wasteTypes.map(function (tp) { return { id: tp.id, label: tp.label, color: tp.color, value: typeSums[tp.id] || 0 }; }).filter(function (x) { return x.value > 0; });
    var maxByType = Math.max.apply(null, [1].concat(byType.map(function (x) { return x.value; })));

    var methodSums = {};
    filtered.forEach(function (e) { methodSums[e.method] = (methodSums[e.method] || 0) + e.totalAmount; });
    var byMethod = Object.keys(methodSums).map(function (k) { return { method: k, value: methodSums[k] }; }).filter(function (x) { return x.value > 0; });
    var maxByMethod = Math.max.apply(null, [1].concat(byMethod.map(function (x) { return x.value; })));

    var prodSums = {};
    filtered.forEach(function (e) {
      var key = e.productName;
      if (!prodSums[key]) prodSums[key] = { name: e.productName, code: e.productCode, value: 0 };
      prodSums[key].value += e.totalAmount;
    });
    var byProduct = Object.values(prodSums).sort(function (a, b) { return b.value - a.value; }).slice(0, 8);
    var maxProd = byProduct.length ? byProduct[0].value : 1;

    var trend = [];
    for (var i = 13; i >= 0; i--) {
      var d = daysAgo(i);
      var sum = state.entries.filter(function (e) { return e.date === d; }).reduce(function (s, e) { return s + e.totalAmount; }, 0);
      trend.push({ date: d.slice(5), value: sum });
    }
    var maxTrend = Math.max.apply(null, [1].concat(trend.map(function (x) { return x.value; })));

      '<div class="wt-stat-row">' +
        '<div class="wt-stat"><div class="lbl">มูลค่าของเสียวันนี้</div><div class="val wt-mono">' + fmtBaht(t) + "<span>บาท</span></div><div class=\"sub\">" + tC + " รายการ</div></div>" +
        '<div class="wt-stat"><div class="lbl">7 วันล่าสุด</div><div class="val wt-mono">' + fmtBaht(w) + "<span>บาท</span></div><div class=\"sub\">" + wC + " รายการ</div></div>" +

      '<div class="wt-dash-grid">' +
        '<div class="wt-card"><h3>มูลค่าตามสาเหตุของเสีย</h3>' +

            '<div class="wt-gauges">' + byType.map(function (x) {

  function updateTotalDisplay() {

  function showFormError(msg) { var el = document.getElementById("formError"); if (el) el.textContent = msg; }
  function showProductFormError(msg) { var el = document.getElementById("productFormError"); if (el) el.textContent = msg; }

  function handleSelectProduct(select) {
    var product = state.settings.products.find(function (p) { return p.id === select.value; });
    var unitField = document.getElementById("unitField");
    var priceField = document.getElementById("unitPriceField");

    else { unitField.value = ""; priceField.value = ""; }

  function handleSubmitEntry(e) {
    e.preventDefault();
    var date = document.getElementById("dateField").value;
    var type = document.getElementById("typeField").value;
    var productId = document.getElementById("productField").value;
    var product = state.settings.products.find(function (p) { return p.id === productId; });
    var quantity = parseFloat(document.getElementById("quantityField").value) || 0;
    var unitPrice = parseFloat(document.getElementById("unitPriceField").value) || 0;
    var line = document.getElementById("lineField").value;
    var method = document.getElementById("methodField").value;
    var note = document.getElementById("noteField").value.trim();
    var rootCause = document.getElementById("rootCauseField").value.trim();

    showFormError("");
    if (!date) return showFormError("กรุณาระบุวันที่");
    if (!product) return showFormError("กรุณาเลือกสินค้า");
    if (!quantity || quantity <= 0) return showFormError("กรุณาระบุจำนวนของเสียมากกว่า 0");
    if (unitPrice < 0) return showFormError("ราคาต้องไม่ติดลบ");
    if (!method) return showFormError("กรุณาเลือกวิธีการจัดการ");

    var isEditing = !!state.editingEntryId;
    var entryId = isEditing ? state.editingEntryId : uid();
    var createdAt = isEditing ? state.entries.find(function (x) { return x.id === state.editingEntryId; }).createdAt : Date.now();
    var photos = state.pendingPhotos.slice();

    var entry = {
      id: entryId,
      date: date, productName: product.name, productCode: product.code,
      type: type, quantity: quantity, unit: product.unit, unitPrice: unitPrice,
      totalAmount: quantity * unitPrice, line: line, method: method, note: note, rootCause: rootCause,
      photos: photos,
      createdAt: createdAt
    };

    // Firestore documents are capped at ~1MB; photos are embedded directly in the
    // document now (no separate Storage upload step to fail silently), so guard
    // against an oversized batch instead of letting the save fail with a cryptic error.
    var approxBytes = JSON.stringify(entry).length;
    if (approxBytes > 900000) {
      return showFormError("แนบรูปรวมกันใหญ่เกินไป กรุณาลดจำนวนรูป หรือแนบทีละ 2-3 รูป");
    }

    var submitBtn = document.querySelector("#entryForm .wt-submit");
    if (submitBtn) submitBtn.disabled = true;
    showFormError("กำลังบันทึก…");

    // Firestore applies this write to its local cache immediately and fires the
    // entries listener right away (before the server even acknowledges it), so the
    // photo and the rest of the record appear together, instantly — we only need
    // to wait on the promise below to catch a real failure after the fact.
    persistEntry(entry).catch(function (err) {
      console.error(err);
      showFormError("บันทึกไม่สำเร็จ: " + (err && err.message ? err.message : "ลองใหม่อีกครั้ง"));
      if (submitBtn) submitBtn.disabled = false;
    });

    state.formDefaults = { date: date, type: type, line: line, method: method };
    state.pendingPhotos = [];
    state.editingEntryId = null;
    showFormError("");
    if (submitBtn) submitBtn.disabled = false;
    render();
  }

  function handlePhotoChange(input) {
    var files = input.files ? Array.prototype.slice.call(input.files) : [];
    if (!files.length) return;
    state.photoBusy = true;
    var label = document.getElementById("photoLabelText");
    if (label) label.textContent = "กำลังประมวลผลรูป…";

    var promises = files.map(function (file) { return fileToCompressedDataUrl(file); });
    Promise.all(promises).then(function (dataUrls) {
      state.pendingPhotos = state.pendingPhotos.concat(dataUrls);
      state.photoBusy = false;
      var wrap = document.getElementById("photoPreviewWrap");
      if (wrap) wrap.innerHTML = renderPhotoPreviewsHtml();
      var lbl = document.getElementById("photoLabelText");
      if (lbl) lbl.textContent = "📎 เพิ่มรูปภาพ";
      if (input) input.value = "";
    }).catch(function () {
      state.photoBusy = false;
      showFormError("แนบรูปภาพไม่สำเร็จ ลองอีกครั้ง");
      var lbl = document.getElementById("photoLabelText");
      if (lbl) lbl.textContent = state.pendingPhotos.length ? "📎 เพิ่มรูปภาพ" : "📎 แนบรูปภาพ";
    });
  }

  function handleRemovePhoto(index) {
    state.pendingPhotos.splice(index, 1);

    var lbl = document.getElementById("photoLabelText");

  function handleSubmitProduct(e) {
    e.preventDefault();
    var code = document.getElementById("productCodeField").value.trim();
    var name = document.getElementById("productNameField").value.trim();
    var unit = document.getElementById("productUnitField").value;
    var price = parseFloat(document.getElementById("productPriceField").value) || 0;
    showProductFormError("");
    if (!name) return showProductFormError("กรุณาระบุชื่อสินค้า");
    var finalCode = code || nextAutoCode();
    if (state.editingProductId) {
      var idx = state.settings.products.findIndex(function (p) { return p.id === state.editingProductId; });
      if (idx > -1) state.settings.products[idx] = Object.assign({}, state.settings.products[idx], { code: finalCode, name: name, unit: unit, price: price });
    } else {
      state.settings.products.push({ id: uid(), code: finalCode, name: name, unit: unit, price: price });
    }
    saveSettings();
    state.editingProductId = null;
    render();
  }

  function handleSubmitCompany(e) {
    e.preventDefault();
    state.settings.company = {
      nameTh: document.getElementById("companyNameThField").value.trim(),
      nameEn: document.getElementById("companyNameEnField").value.trim(),
      address: document.getElementById("companyAddressField").value.trim(),
      tel: document.getElementById("companyTelField").value.trim(),
      fax: document.getElementById("companyFaxField").value.trim(),
      email: document.getElementById("companyEmailField").value.trim()
    };
    saveSettings();
    render();
  }

  function addWasteType() {
    var input = document.getElementById("typeInputField");
    var v = (input.value || "").trim();
    if (!v) return;
    var exists = state.settings.wasteTypes.some(function (t) { return t.label === v; });
    if (exists) { input.value = ""; return; }
    var color = TYPE_COLOR_PALETTE[state.settings.wasteTypes.length % TYPE_COLOR_PALETTE.length];
    state.settings.wasteTypes.push({ id: uid(), label: v, color: color });
    saveSettings();
    render();
  }

  function addListItem(key, inputId) {
    var input = document.getElementById(inputId);
    var v = (input.value || "").trim();
    if (!v) return;
    if (state.settings[key].indexOf(v) !== -1) { input.value = ""; return; }
    state.settings[key].push(v);
    saveSettings();
    render();
  }

  // ---------------- event delegation ----------------
  document.getElementById("app").addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    switch (action) {
      case "setTab":
        var wantTab = el.getAttribute("data-tab");
        if (ROLE_ALLOWED_TABS[state.role].indexOf(wantTab) === -1) break;
        state.tab = wantTab; render(); break;
      case "logout": handleLogout(); break;
      case "setRange":
        state.range = el.getAttribute("data-range");
        var b = getRangeBounds(state.range);
        state.rangeStart = b.start === "0000-00-00" ? todayStr() : b.start;
        state.rangeEnd = b.end;
        render(); break;
      case "deleteEntry":
        var delId = el.getAttribute("data-id");
        if (state.editingEntryId === delId) { state.editingEntryId = null; state.pendingPhotos = []; }
        state.entries = state.entries.filter(function (x) { return x.id !== delId; });
        render();
        deleteEntryRemote(delId);
        break;
      case "editEntry":
        var editTarget = state.entries.find(function (x) { return x.id === el.getAttribute("data-id"); });
        if (editTarget) {
          state.editingEntryId = editTarget.id;
          state.pendingPhotos = editTarget.photos ? editTarget.photos.slice() : [];
          showFormError("");
          render();
          var card = document.querySelector(".wt-entry-grid .wt-card");
          if (card && card.scrollIntoView) card.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        break;
      case "cancelEditEntry":
        state.editingEntryId = null;
        state.pendingPhotos = [];
        render(); break;
      case "openLightbox": state.lightboxEntryId = el.getAttribute("data-id"); state.lightboxIndex = 0; render(); break;
      case "closeLightbox": if (e.target === el) { state.lightboxEntryId = null; render(); } break;
      case "lightboxPrev": case "lightboxNext":
        var lbEntry = state.entries.find(function (x) { return x.id === state.lightboxEntryId; });
        if (lbEntry && lbEntry.photos && lbEntry.photos.length) {
          var len = lbEntry.photos.length;
          state.lightboxIndex = action === "lightboxPrev" ? (state.lightboxIndex - 1 + len) % len : (state.lightboxIndex + 1) % len;
          render();
        }
        break;
      case "removePhoto": handleRemovePhoto(parseInt(el.getAttribute("data-index"), 10)); break;
      case "exportCsv": exportCsv(); break;
      case "clearLedgerFilter":
        state.ledgerSearch = ""; state.ledgerDateFrom = ""; state.ledgerDateTo = "";
        render(); break;
      case "editProduct": state.editingProductId = el.getAttribute("data-id"); render(); break;
      case "cancelEditProduct": state.editingProductId = null; render(); break;
      case "deleteProduct":
        var pid = el.getAttribute("data-id");
        state.settings.products = state.settings.products.filter(function (p) { return p.id !== pid; });
        saveSettings();
        if (state.editingProductId === pid) state.editingProductId = null;
        render(); break;
      case "removeLine":
        state.settings.lines = state.settings.lines.filter(function (l) { return l !== el.getAttribute("data-value"); });
        saveSettings(); render(); break;
      case "removeMethod":
        state.settings.methods = state.settings.methods.filter(function (m) { return m !== el.getAttribute("data-value"); });
        saveSettings(); render(); break;
      case "removeUnit":
        state.settings.units = state.settings.units.filter(function (u) { return u !== el.getAttribute("data-value"); });
        saveSettings(); render(); break;
      case "removeType":
        state.settings.wasteTypes = state.settings.wasteTypes.filter(function (t) { return t.id !== el.getAttribute("data-value"); });
        saveSettings(); render(); break;
      case "addLine": addListItem("lines", "lineInputField"); break;
      case "addMethod": addListItem("methods", "methodInputField"); break;
      case "addUnit": addListItem("units", "unitInputField"); break;
      case "addType": addWasteType(); break;
      case "openPrintModal":
        state.printDefaults = {
          start: state.rangeStart,
          end: state.rangeEnd,
          docNumber: "WR-" + todayStr().replace(/-/g, "") + "-" + String(state.entries.length + 1).padStart(3, "0")
        };
        state.printModalOpen = true;
        render(); break;
      case "closePrintModal": if (e.target === el) { state.printModalOpen = false; render(); } break;
      case "generatePrint": handleGeneratePrint(); break;
      case "printDashboard": buildAndOpenDashboardPrint(state.rangeStart, state.rangeEnd); break;
    }
  });

  document.getElementById("app").addEventListener("submit", function (e) {
    var form = e.target;
    if (form.id === "loginForm") handleSubmitLogin(e);
    else if (form.id === "entryForm") handleSubmitEntry(e);
    else if (form.id === "productForm") handleSubmitProduct(e);
    else if (form.id === "companyForm") handleSubmitCompany(e);
  });

  document.getElementById("app").addEventListener("change", function (e) {
    if (e.target.id === "productField") handleSelectProduct(e.target);
    else if (e.target.id === "photoInput") handlePhotoChange(e.target);
    else if (e.target.id === "ledgerDateFromField") { state.ledgerDateFrom = e.target.value; render(); }
    else if (e.target.id === "ledgerDateToField") { state.ledgerDateTo = e.target.value; render(); }
    else if (e.target.id === "dashStartField") { state.rangeStart = e.target.value; state.range = "custom"; render(); }
    else if (e.target.id === "dashEndField") { state.rangeEnd = e.target.value; state.range = "custom"; render(); }
  });

  document.getElementById("app").addEventListener("input", function (e) {
    if (e.target.hasAttribute("data-live-total")) updateTotalDisplay();
    if (e.target.hasAttribute("data-live-status")) updateStatusPreview();
    if (e.target.id === "ledgerSearchField") { state.ledgerSearch = e.target.value; updateLedgerTable(); }
  });

  document.getElementById("app").addEventListener("keydown", function (e) {
    var actionKey = e.target.getAttribute && e.target.getAttribute("data-enter-action");
    if (actionKey && e.key === "Enter") {
      e.preventDefault();
      if (actionKey === "addLine") addListItem("lines", "lineInputField");
      if (actionKey === "addMethod") addListItem("methods", "methodInputField");
      if (actionKey === "addUnit") addListItem("units", "unitInputField");

    }
  });

  function handleGeneratePrint() {
    var start = document.getElementById("printStartDate").value;

    if (!start || !end) { alert("กรุณาระบุช่วงวันที่"); return; }

      .sort(function (a, b) { return (a.date + a.createdAt).localeCompare(b.date + b.createdAt); });
    var total = rows.reduce(function (s, e) { return s + e.totalAmount; }, 0);

    var runNumbers = computeEntryRunNumbers();
    var bodyRows = rows.map(function (e, i) {
      var t = findWasteType(e.type).label;

    var methodSums = {};
    filtered.forEach(function (e) { methodSums[e.method] = (methodSums[e.method] || 0) + e.totalAmount; });
    var byMethod = Object.keys(methodSums).map(function (k) { return { label: k, value: methodSums[k] }; }).filter(function (x) { return x.value > 0; }).sort(function (a, b) { return b.value - a.value; });

      ".pr-stat-box .val { font-size: 20px; font-weight: 700; }" +
      "</style></head><body>" +

      printHeaderHtml(c) +
      '<div class="pr-meta">ช่วงวันที่ : ' + esc(start) + " ถึง " + esc(end) + "</div>" +
      '<div class="pr-title">สรุปรายงานของเสีย (แดชบอร์ด)</div>' +

      '<div class="pr-stat-row">' +
        '<div class="pr-stat-box"><div class="lbl">มูลค่าของเสียรวม</div><div class="val">' + fmtBaht(total) + " บาท</div></div>" +
        '<div class="pr-stat-box"><div class="lbl">จำนวนรายการ</div><div class="val">' + filtered.length + "</div></div>" +
      "</div>" +

      breakdownTable("มูลค่าตามสาเหตุของเสีย", byType) +
      breakdownTable("วิธีการจัดการ", byMethod) +

      (byProduct.length ?
        '<div class="pr-subtitle">สินค้าที่เสียมูลค่าสูงสุด</div>' +
        '<table class="pr-table"><thead><tr><th style="width:6%;">ลำดับ</th><th>สินค้า</th><th style="width:16%;">จำนวนรวม</th><th style="width:16%;">มูลค่ารวม (บาท)</th></tr></thead><tbody>' +
        productRows + "</tbody></table>" : "") +

      '<div class="pr-noprint"><button onclick="window.print()">🖨 พิมพ์เอกสารนี้</button></div>' +
      "</body></html>";

    var win = window.open("", "_blank");
    if (!win) { alert("เบราว์เซอร์บล็อกหน้าต่างป็อปอัป กรุณาอนุญาตป็อปอัปสำหรับหน้านี้แล้วลองอีกครั้ง"); return; }
    win.document.open(); win.document.write(html); win.document.close();
  }

  function exportCsv() {
    var sorted = getFilteredLedgerEntries();
    var header = "เลขที่รายการ,วันที่,รหัสสินค้า,ชื่อสินค้า,ประเภท,จำนวน,หน่วย,ราคาต่อหน่วย,มูลค่ารวม,ไลน์ผลิต,วิธีจัดการ,หมายเหตุ,สาเหตุ&แนวทางแก้ไข,สถานะ\n";
    var runNumbers = computeEntryRunNumbers();
    var rows = sorted.map(function (e) {
      var t = findWasteType(e.type).label;
      var status = getEntryStatus(e).label;
      return [runNumbers[e.id] || "", e.date, e.productCode, e.productName, t, e.quantity, e.unit, e.unitPrice, e.totalAmount, e.line, e.method, e.note, e.rootCause, status]
        .map(function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\n");
    var blob = new Blob(["\uFEFF" + header + rows], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "bakery-waste-" + todayStr() + ".csv"; a.click();
    URL.revokeObjectURL(url);
  }

  // ---------------- init ----------------
  (function initApp() {
    var savedRole = null;
    try { savedRole = localStorage.getItem(ROLE_STORAGE_KEY); } catch (err) { /* ignore */ }
    if (savedRole && ROLE_LABELS[savedRole]) {
      state.role = savedRole;
      state.roleLabel = ROLE_LABELS[savedRole];
      startAppAfterLogin();
    } else {
      render();
    }
  })();
})();
</script>
</body>
</html>
