    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function firstDayOfMonthStr(){
    const now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10);
  }
  function firstDayOfQuarterStr(){
    const now = new Date();
    const q = Math.floor(now.getMonth() / 3);
    return new Date(now.getFullYear(), q * 3, 1).toISOString().slice(0,10);
  }
  function firstDayOfYearStr(){
    const now = new Date();
    return new Date(now.getFullYear(), 0, 1).toISOString().slice(0,10);
  }
  function fmtDate(d){
    try {
      const dt = new Date(d + 'T00:00:00');
      return dt.toLocaleDateString('th-TH', {day:'2-digit', month:'short', year:'2-digit'});
    } catch(e){ return d; }
  }
  function fmtMoney(n){
    return Number(n||0).toLocaleString('th-TH', {minimumFractionDigits:0, maximumFractionDigits:2});
  }
  function itemById(id){ return state.items.find(i => i.id === id); }
  function itemName(id){ const it = itemById(id); return it ? it.name : '(ถูกลบแล้ว)'; }
  function itemUnit(id){ const it = itemById(id); return it ? it.unit : ''; }
  function itemCode(id){ const it = itemById(id); return it ? (it.code || '—') : '—'; }

      {id: uid('item'), code:'OFF-003', name:'แฟ้มเอกสารสันกว้าง', unit:'เล่ม', qty:8, minQty:10, price:65},
    ];
    state.transactions = [
      {id: uid('tx'), itemId: state.items[0].id, type:'in', qty:24, date: now, note:'สต็อกเริ่มต้น'},
      {id: uid('tx'), itemId: state.items[1].id, type:'in', qty:60, date: now, note:'สต็อกเริ่มต้น'},
      {id: uid('tx'), itemId: state.items[2].id, type:'in', qty:10, date: now, note:'สต็อกเริ่มต้น'},
      {id: uid('tx'), itemId: state.items[2].id, type:'out', qty:2, date: now, note:'เบิกใช้แผนกบัญชี', requester:'สมชาย (บัญชี)'},
    ];
    state.requesters = [{id: uid('req'), name:'สมชาย (บัญชี)'}];
  }

  function ensureRequestersIncludeHistory(){
    if (!Array.isArray(state.requesters)) state.requesters = [];
    const known = new Set(state.requesters.map(r => r.name.toLowerCase()));
    state.transactions.forEach(t => {
      const name = (t.requester || '').trim();
      if (!name) return;
      const key = name.toLowerCase();
      if (!known.has(key)) {
        known.add(key);
        state.requesters.push({id: uid('req'), name});
      }
    });
  }

  const FIRESTORE_COLLECTION = 'stockroom';
  const FIRESTORE_DOC = 'main';
  let db = null;
  let firebaseReady = false;

  function initFirebase(){
    try {
      const cfg = window.__FIREBASE_CONFIG__;
      if (!window.firebase || !cfg || !cfg.apiKey || cfg.apiKey.indexOf('วางค่า') === 0) return false;
      if (!firebase.apps.length) firebase.initializeApp(cfg);
      db = firebase.firestore();
      firebaseReady = true;
      return true;
    } catch(e){ return false; }
  }

  function docRef(){ return db.collection(FIRESTORE_COLLECTION).doc(FIRESTORE_DOC); }

  async function loadData(){
    const ok = initFirebase();
    state.configured = ok;
    if (!ok) { state.loading = false; render(); return; }
    try {
      const snap = await docRef().get();
      if (snap.exists) {
        const data = snap.data() || {};
        state.items = (data.items || []).map(i => ({price:0, code:'', image:'', ...i}));
        state.transactions = data.transactions || [];
        state.requesters = data.requesters || [];
        ensureRequestersIncludeHistory();
      } else {
        seedDefault();
        try { await saveData(); } catch(e2){ /* doc will be created on next successful save */ }
      }
    } catch(e){
      state.loading = false;
      showToast('เชื่อมต่อฐานข้อมูลไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตหรือการตั้งค่า Firebase', 'warn');
      render();
      return;
    }
    state.loading = false;
    render();
  }

  async function saveData(){
    if (!firebaseReady) throw new Error('ยังไม่ได้เชื่อมต่อฐานข้อมูล');
    await docRef().set({
      items: state.items,
      transactions: state.transactions,
      requesters: state.requesters,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }

  async function refreshData(){
    state.loading = true;
    render();
    await loadData();
    showToast('ดึงข้อมูลล่าสุดแล้ว');
  }

  function showToast(msg, kind){
    state.toast = {msg, kind: kind || 'ok'};

    clearTimeout(window.__srToastTimer);

  function nextAutoCode(){
    let n = state.items.length + 1;
    let code;
    do { code = 'OFF-' + String(n).padStart(3, '0'); n++; }

  async function addItem(name, unit, minQty, price, code, image){
    name = (name || '').trim();
    if (!name) { showToast('กรุณากรอกชื่อวัสดุ', 'warn'); return; }
    if (state.items.some(i => i.name.toLowerCase() === name.toLowerCase())) {
      showToast('มีรายการนี้อยู่แล้ว', 'warn'); return;

      showToast('รหัสนี้ถูกใช้แล้ว กรุณาใช้รหัสอื่น', 'warn'); return;
    }
    if (!code) code = nextAutoCode();
    state.items.push({
      id: uid('item'), code, name, unit: (unit || 'ชิ้น').trim(),
      qty: 0, minQty: Number(minQty) || 0, price: Number(price) || 0,

  function readAndResizeImage(file, maxSize){
    return new Promise((resolve, reject) => {
      if (!file || !file.type || file.type.indexOf('image/') !== 0) { reject(new Error('not an image')); return; }
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          const scale = Math.min(1, maxSize / Math.max(w, h));
          w = Math.max(1, Math.round(w * scale));
          h = Math.max(1, Math.round(h * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.78));
        };
        img.onerror = () => reject(new Error('image load failed'));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error('read failed'));
      reader.readAsDataURL(file);
    });
  }

  async function deleteItem(id){
    const it = itemById(id);
    if (!it) return;
    if (!confirm('ลบ "' + it.name + '" ออกจากคลัง? ประวัติการรับ-จ่ายของรายการนี้จะถูกลบด้วย')) return;
    state.items = state.items.filter(i => i.id !== id);
    state.transactions = state.transactions.filter(t => t.itemId !== id);

    catch(e){ showToast('บันทึกไม่สำเร็จ', 'warn'); }
    render();
  }

  async function addRequesterName(name){
    name = (name || '').trim();
    if (!name) return null;
    const existing = state.requesters.find(r => r.name.toLowerCase() === name.toLowerCase());
    if (existing) return existing;
    const req = {id: uid('req'), name};
    state.requesters.push(req);
    try { await saveData(); } catch(e){ showToast('บันทึกรายชื่อไม่สำเร็จ', 'warn'); }

  async function moveStock(itemId, type, qty, date, note, requester){
    qty = Number(qty);
    const item = itemById(itemId);
    if (!item) { showToast('กรุณาเลือกรายการวัสดุ', 'warn'); return; }
    if (!qty || qty <= 0) { showToast('กรุณากรอกจำนวนให้ถูกต้อง', 'warn'); return; }
    if (type === 'out' && qty > item.qty) { showToast('จำนวนคงเหลือไม่พอสำหรับตัดออก', 'warn'); return; }
    if (type === 'out' && !(requester || '').trim()) { showToast('กรุณากรอกชื่อคนเบิก', 'warn'); return; }
    item.qty += (type === 'in' ? qty : -qty);
    const requesterName = type === 'out' ? (requester || '').trim() : '';
    state.transactions.unshift({
      id: uid('tx'), itemId, type, qty,
      date: date || todayStr(), note: (note || '').trim(),
      requester: requesterName
    });
    if (type === 'out' && requesterName) {
      const exists = state.requesters.some(r => r.name.toLowerCase() === requesterName.toLowerCase());
      if (!exists) state.requesters.push({id: uid('req'), name: requesterName});
    }
    try {
      await saveData();
      showToast(type === 'in' ? 'บันทึกรับเข้าแล้ว' : 'บันทึกตัดออกแล้ว');
    } catch(e){ showToast('บันทึกไม่สำเร็จ', 'warn'); }
    render();
  }

  async function deleteTransaction(txId){
    const tx = state.transactions.find(t => t.id === txId);
    if (!tx) return;
    if (!confirm('ลบรายการนี้? ยอดคงเหลือจะถูกปรับกลับอัตโนมัติ')) return;
    const item = itemById(tx.itemId);
    if (item) {
      item.qty += (tx.type === 'in' ? -tx.qty : tx.qty);
      if (item.qty < 0) item.qty = 0;
    }
    state.transactions = state.transactions.filter(t => t.id !== txId);
    try { await saveData(); showToast('ลบรายการเรียบร้อย'); }
    catch(e){ showToast('บันทึกไม่สำเร็จ', 'warn'); }
    render();
  }

  const __scriptCache = {};
  function loadScript(src){
    if (__scriptCache[src]) return __scriptCache[src];
    __scriptCache[src] = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => resolve();
      s.onerror = () => { delete __scriptCache[src]; reject(new Error('load failed')); };
      document.head.appendChild(s);
    });
    return __scriptCache[src];
  }

  // ---------- report dashboard ----------

  function inRange(dateStr, from, to){
    if (from && dateStr < from) return false;
    if (to && dateStr > to) return false;
    return true;
  }

  function computeReportData(from, to){
    const asOfDate = to || todayStr();
    const perItem = state.items.map(it => {
      let receivedQty = 0, receivedValue = 0, issuedQty = 0, issuedValue = 0, balanceQty = 0;
      state.transactions.forEach(t => {
        if (t.itemId !== it.id) return;
        if (t.date <= asOfDate) balanceQty += (t.type === 'in' ? t.qty : -t.qty);
        if (inRange(t.date, from, to)) {
          if (t.type === 'in') { receivedQty += t.qty; receivedValue += t.qty * (it.price || 0); }
          else { issuedQty += t.qty; issuedValue += t.qty * (it.price || 0); }
        }
      });
      balanceQty = Math.max(0, balanceQty);
      return { item: it, receivedQty, receivedValue, issuedQty, issuedValue, balanceQty, balanceValue: balanceQty * (it.price || 0) };
    });
    const totals = perItem.reduce((acc, r) => {
      acc.receivedQty += r.receivedQty; acc.receivedValue += r.receivedValue;
      acc.issuedQty += r.issuedQty; acc.issuedValue += r.issuedValue;
      acc.balanceQty += r.balanceQty; acc.balanceValue += r.balanceValue;
      return acc;
    }, {receivedQty:0, receivedValue:0, issuedQty:0, issuedValue:0, balanceQty:0, balanceValue:0});
    const lowCount = perItem.filter(r => r.balanceQty <= r.item.minQty).length;
    return { perItem, totals, lowCount, asOfDate };
  }

  function reportRowsForDisplay(perItem){
    return perItem.filter(r => r.receivedQty !== 0 || r.issuedQty !== 0 || r.balanceQty !== 0);
  }

  function renderReport(){
    const from = state.reportFrom || '';
    const to = state.reportTo || '';
    const data = computeReportData(from, to);

    const filterBar =
      '<div class="report-filter">' +
        '<div class="field"><label>ตั้งแต่วันที่</label><input type="date" data-role="report-from" value="' + from + '"/></div>' +
        '<div class="field"><label>ถึงวันที่</label><input type="date" data-role="report-to" value="' + to + '"/></div>' +
        '<button type="button" class="btn" data-action="report-quick-month">เดือนนี้</button>' +

  function computeRequesterData(from, to, search){
    const q = (search || '').trim().toLowerCase();
    const groups = {};
    state.transactions.forEach(t => {
      if (t.type !== 'out') return;
      if (!inRange(t.date, from, to)) return;
      const name = (t.requester || '').trim() || 'ไม่ระบุ';
      const key = name.toLowerCase();
      if (q && !key.includes(q)) return;
      if (!groups[key]) groups[key] = { label: name, items: {}, totalQty: 0, totalValue: 0 };
      const g = groups[key];
      const it = itemById(t.itemId);
      const price = it ? (it.price || 0) : 0;
      const value = t.qty * price;
      if (!g.items[t.itemId]) g.items[t.itemId] = { itemId: t.itemId, qty: 0, value: 0 };
      g.items[t.itemId].qty += t.qty;
      g.items[t.itemId].value += value;
      g.totalQty += t.qty;
      g.totalValue += value;
    });
    const list = Object.keys(groups).map(key => {
      const g = groups[key];
      return {
        label: g.label,
        totalQty: g.totalQty,
        totalValue: g.totalValue,
        items: Object.values(g.items).sort((a, b) => b.value - a.value)
      };
    }).sort((a, b) => b.totalValue - a.totalValue);
    const totals = list.reduce((acc, g) => {
      acc.qty += g.totalQty; acc.value += g.totalValue; return acc;
    }, { qty: 0, value: 0 });
    return { list, totals, requesterCount: list.length };
  }

  function computeExecutiveData(from, to){
    const reportData = computeReportData(from, to);
    const requesterData = computeRequesterData(from, to, '');
    const topIssuedItems = reportData.perItem
      .filter(r => r.issuedValue > 0)
      .slice()
      .sort((a, b) => b.issuedValue - a.issuedValue)
      .slice(0, 5);
    const topReceivedItems = reportData.perItem
      .filter(r => r.receivedValue > 0)
      .slice()
      .sort((a, b) => b.receivedValue - a.receivedValue)
      .slice(0, 5);
    const lowStockItems = state.items
      .filter(i => i.qty <= i.minQty)
      .slice()
      .sort((a, b) => (a.qty - a.minQty) - (b.qty - b.minQty));
    const topRequesters = requesterData.list.slice(0, 5);
    const netValue = reportData.totals.receivedValue - reportData.totals.issuedValue;
    const currentBalanceValue = state.items.reduce((s, i) => s + i.qty * (i.price || 0), 0);
    return { reportData, requesterData, topIssuedItems, topReceivedItems, lowStockItems, topRequesters, netValue, currentBalanceValue };
  }

  function executiveHighlights(data){
    const list = [];
    if (state.items.length > 0) {
      const mostValuable = state.items.slice().sort((a, b) => (b.qty*(b.price||0)) - (a.qty*(a.price||0)))[0];
      if (mostValuable && mostValuable.qty * (mostValuable.price||0) > 0) {
        list.push('วัสดุที่มีมูลค่าคงเหลือสูงสุด: ' + mostValuable.name + ' (฿' + fmtMoney(mostValuable.qty*(mostValuable.price||0)) + ')');
      }
    }
    if (data.lowStockItems.length > 0) {
      const worst = data.lowStockItems[0];
      list.push('รายการที่ใกล้หมดมากที่สุด: ' + worst.name + ' (คงเหลือ ' + worst.qty + ' ' + worst.unit + ', ขั้นต่ำ ' + worst.minQty + ')');
    }
    if (data.topRequesters.length > 0) {
      const top = data.topRequesters[0];
      list.push('ผู้เบิกที่มีมูลค่าการเบิกสูงสุดในช่วงนี้: ' + top.label + ' (฿' + fmtMoney(top.totalValue) + ')');

    if (data.topIssuedItems.length > 0) {
      const topOut = data.topIssuedItems[0];
      list.push('วัสดุที่ถูกเบิกออกมากที่สุดในช่วงนี้: ' + topOut.item.name + ' (' + topOut.issuedQty + ' ' + escapeHtml(topOut.item.unit) + ', ฿' + fmtMoney(topOut.issuedValue) + ')');
    }
    if (data.reportData.totals.receivedValue > 0 || data.reportData.totals.issuedValue > 0) {
      const net = data.netValue;
      list.push('มูลค่าสุทธิในช่วงนี้ (รับเข้า − เบิกออก): ' + (net >= 0 ? '+' : '') + '฿' + fmtMoney(net));

    if (list.length === 0) list.push('ยังไม่มีข้อมูลเพียงพอสำหรับสรุปในช่วงเวลานี้');

        '</div>'
      );
    }).join('');
  }

  async function saveTxEdit(id){
    const row = document.querySelector('[data-edit-tx-row="' + id + '"]');
    const tx = state.transactions.find(t => t.id === id);
    if (!row || !tx) return;
    const get = (f) => { const el = row.querySelector('[data-field="' + f + '"]'); return el ? el.value : ''; };

    const newItemId = get('itemId');
    const newType = get('type');
    const newQty = Math.max(0, Math.round(Number(get('qty')) || 0));
    const newDate = get('date') || todayStr();
    const newNote = (get('note') || '').trim();
    const newRequester = (get('requester') || '').trim();

    if (!newItemId || !itemById(newItemId)) { showToast('กรุณาเลือกรายการวัสดุ', 'warn'); return; }
    if (!newQty || newQty <= 0) { showToast('กรุณากรอกจำนวนให้ถูกต้อง', 'warn'); return; }
    if (newType === 'out' && !newRequester) { showToast('กรุณากรอกชื่อคนเบิก', 'warn'); return; }

    const oldItem = itemById(tx.itemId);
    if (oldItem) oldItem.qty += (tx.type === 'in' ? -tx.qty : tx.qty);

    const newItem = itemById(newItemId);
    if (newType === 'out' && newQty > newItem.qty) {
      if (oldItem) oldItem.qty += (tx.type === 'in' ? tx.qty : -tx.qty);
      showToast('จำนวนคงเหลือไม่พอสำหรับตัดออก', 'warn');
      return;
    }
    newItem.qty += (newType === 'in' ? newQty : -newQty);
    if (newItem.qty < 0) newItem.qty = 0;

    tx.itemId = newItemId;
    tx.type = newType;
    tx.qty = newQty;
    tx.date = newDate;
    tx.note = newNote;
    tx.requester = newType === 'out' ? newRequester : '';

    if (newType === 'out' && newRequester) {
      const exists = state.requesters.some(r => r.name.toLowerCase() === newRequester.toLowerCase());
      if (!exists) state.requesters.push({id: uid('req'), name: newRequester});
    }

    state.editingTxId = null;
    try { await saveData(); showToast('บันทึกการแก้ไขแล้ว'); }
    catch(e){ showToast('บันทึกไม่สำเร็จ', 'warn'); }
    render();
  }

  async function saveItemEdit(id){
    const row = document.querySelector('[data-edit-row="' + id + '"]');
    const item = itemById(id);
    if (!row || !item) return;
    const get = (f) => { const el = row.querySelector('[data-field="' + f + '"]'); return el ? el.value : ''; };

    const name = (get('name') || '').trim();
    if (!name) { showToast('กรุณากรอกชื่อวัสดุ', 'warn'); return; }
    if (state.items.some(i => i.id !== id && i.name.toLowerCase() === name.toLowerCase())) {
      showToast('มีชื่อวัสดุนี้อยู่แล้ว', 'warn'); return;
    }
    const code = (get('code') || '').trim();
    if (code && state.items.some(i => i.id !== id && i.code.toLowerCase() === code.toLowerCase())) {
      showToast('รหัสนี้ถูกใช้แล้ว กรุณาใช้รหัสอื่น', 'warn'); return;
    }

    item.code = code;
    item.name = name;

    item.price = Math.max(0, Number(get('price')) || 0);
    item.qty = Math.max(0, Math.round(Number(get('qty')) || 0));

  }

  function sortItems(items){
    const field = state.sortField;
    if (!field) return items;
    const dir = state.sortDir === 'desc' ? -1 : 1;
    const arr = items.slice();
    arr.sort((a, b) => {
      let av, bv;
      switch(field){
        case 'code': av = (a.code||'').toLowerCase(); bv = (b.code||'').toLowerCase(); break;
        case 'name': av = a.name.toLowerCase(); bv = b.name.toLowerCase(); break;
        case 'unit': av = (a.unit||'').toLowerCase(); bv = (b.unit||'').toLowerCase(); break;
        case 'price': av = a.price || 0; bv = b.price || 0; break;
        case 'qty': av = a.qty; bv = b.qty; break;
        case 'value': av = a.qty * (a.price||0); bv = b.qty * (b.price||0); break;
        case 'status': av = (a.qty <= a.minQty) ? 0 : 1; bv = (b.qty <= b.minQty) ? 0 : 1; break;
        case 'urgency': av = a.qty - a.minQty; bv = b.qty - b.minQty; break;
        default: return 0;
      }
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return 0;
    });
    return arr;
  }

  function computeVisibleHistory(){
    const q = (state.historySearch || '').trim().toLowerCase();
    const from = state.historyFrom || '';
    const to = state.historyTo || '';
    return state.transactions.filter(t => {
      if (from && t.date < from) return false;
      if (to && t.date > to) return false;
      if (!q) return true;
      const haystack = [
        itemName(t.itemId), itemCode(t.itemId), itemUnit(t.itemId),
        t.requester || '', t.note || '', (t.type === 'in' ? 'รับเข้า' : 'ตัดออก')
      ].join(' ').toLowerCase();
      return haystack.includes(q);
    });
  }

  function setupRequesterCombobox(form){
    const input = form.querySelector('[data-role="requester-search"]');
    const results = form.querySelector('[data-role="requester-results"]');
    const clearBtn = form.querySelector('[data-role="requester-clear-btn"]');
    if (!input || !results) return;

    let editingId = null;

    function syncClear(){ if (clearBtn) clearBtn.style.display = input.value ? 'flex' : 'none'; }
    function open(query){ results.innerHTML = comboRequesterOptionsHTML(query, editingId); results.hidden = false; }
    function close(){ results.hidden = true; }

    input.addEventListener('focus', () => open(input.value));
    input.addEventListener('click', () => open(input.value));
    input.addEventListener('input', () => { editingId = null; syncClear(); open(input.value); });
    input.addEventListener('keydown', (e) => { if (e.key === 'Escape'){ close(); input.blur(); } });
    input.addEventListener('blur', (e) => {
      const next = e.relatedTarget;
      if (next && results.contains(next)) return;
      setTimeout(() => {
        if (results.contains(document.activeElement)) return;
        close();
      }, 150);
    });
    syncClear();

    if (clearBtn) {
      clearBtn.addEventListener('mousedown', (e) => e.preventDefault());
      clearBtn.addEventListener('click', () => {
        input.value = '';
        syncClear();
        open('');
        input.focus();
      });
    }

    results.addEventListener('mousedown', async (e) => {
      const addOpt = e.target.closest('[data-action="add-requester"]');
      const editBtn = e.target.closest('[data-action="edit-requester-name"]');
      const saveBtn = e.target.closest('[data-action="save-requester-name"]');
      const cancelBtn = e.target.closest('[data-action="cancel-requester-edit"]');
      const opt = e.target.closest('.combo-option:not(.combo-option-edit):not(.combo-add)');

      if (addOpt) {
        e.preventDefault();
        const name = addOpt.getAttribute('data-name');
        const req = await addRequesterName(name);
        if (req) input.value = req.name;
        editingId = null;
        close();
        syncClear();
        return;
      }
      if (editBtn) {
        e.preventDefault();
        editingId = editBtn.getAttribute('data-id');
        open(input.value);
        const editInput = results.querySelector('[data-role="requester-edit-input"]');
        if (editInput) { editInput.focus(); editInput.select(); }
        return;
      }
      if (saveBtn) {
        e.preventDefault();
        const id = saveBtn.getAttribute('data-id');
        const editInput = results.querySelector('[data-role="requester-edit-input"]');
        const newName = editInput ? editInput.value : '';
        const oldReq = state.requesters.find(r => r.id === id);
        const wasSelected = oldReq && input.value.trim().toLowerCase() === oldReq.name.toLowerCase();
        const ok = await renameRequester(id, newName);
        if (ok && wasSelected) {
          const updated = state.requesters.find(r => r.id === id);
          if (updated) input.value = updated.name;
        }
        editingId = null;
        open(input.value);
        return;
      }
      if (cancelBtn) {
        e.preventDefault();
        editingId = null;
        open(input.value);
        return;
      }
      if (opt) {
        e.preventDefault();
        input.value = opt.getAttribute('data-name');
        close();
        syncClear();
      }
    });
  }

  function setupCombobox(form){
    const input = form.querySelector('[data-role="item-search"]');
    const hidden = form.querySelector('[data-role="item-id-hidden"]');
    const results = form.querySelector('[data-role="item-results"]');
    if (!input || !hidden || !results) return;

    function open(query){ results.innerHTML = comboOptionsHTML(query); results.hidden = false; }
    function close(){ results.hidden = true; }

    input.addEventListener('focus', () => open(input.value));
    input.addEventListener('click', () => open(input.value));
    input.addEventListener('input', () => { hidden.value = ''; open(input.value); });
    input.addEventListener('keydown', (e) => { if (e.key === 'Escape'){ close(); input.blur(); } });
    input.addEventListener('blur', () => { setTimeout(close, 150); });

    results.addEventListener('mousedown', (e) => {
      const opt = e.target.closest('.combo-option');
      if (!opt) return;
      e.preventDefault();
      const item = itemById(opt.getAttribute('data-id'));
      if (item) {
        hidden.value = item.id;
        input.value = item.name + ' [' + (item.code || '—') + ']';
      }
      close();
    });
  }

  function wireHistoryRows(root){
    root.querySelectorAll('[data-action="delete-tx"]').forEach(btn => {
      btn.addEventListener('click', () => deleteTransaction(btn.getAttribute('data-id')));
    });
    root.querySelectorAll('[data-action="edit-tx"]').forEach(btn => {
      btn.addEventListener('click', () => enterEditTx(btn.getAttribute('data-id')));
    });
    root.querySelectorAll('[data-action="save-tx"]').forEach(btn => {
      btn.addEventListener('click', () => saveTxEdit(btn.getAttribute('data-id')));
    });
    root.querySelectorAll('[data-action="cancel-tx-edit"]').forEach(btn => {
      btn.addEventListener('click', cancelTxEdit);
    });
  }

  function wireOverviewRows(root){
    root.querySelectorAll('[data-action="quick-in"]').forEach(btn => {
      btn.addEventListener('click', () => setTab('receive', btn.getAttribute('data-id')));
    });
    root.querySelectorAll('[data-action="quick-out"]').forEach(btn => {
      btn.addEventListener('click', () => setTab('issue', btn.getAttribute('data-id')));
    });
    root.querySelectorAll('[data-action="delete-item"]').forEach(btn => {
      btn.addEventListener('click', () => deleteItem(btn.getAttribute('data-id')));
    });
    root.querySelectorAll('[data-action="edit-item"]').forEach(btn => {
      btn.addEventListener('click', () => enterEditMode(btn.getAttribute('data-id')));
    });
    root.querySelectorAll('[data-action="save-item"]').forEach(btn => {
      btn.addEventListener('click', () => saveItemEdit(btn.getAttribute('data-id')));
    });
    root.querySelectorAll('[data-action="cancel-edit"]').forEach(btn => {
      btn.addEventListener('click', cancelEdit);
    });
    root.querySelectorAll('[data-action="upload-image"]').forEach(fileInput => {
      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try {
          const dataUrl = await readAndResizeImage(file, 240);
          await updateItemImage(fileInput.getAttribute('data-id'), dataUrl);
        } catch(err){ showToast('อัปโหลดรูปไม่สำเร็จ', 'warn'); }
      });
    });
  }

  function attachHandlers(){
    const app = document.getElementById('app');

    app.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => setTab(btn.getAttribute('data-tab')));
    });

    const refreshBtn = app.querySelector('[data-action="refresh-data"]');
    if (refreshBtn) refreshBtn.addEventListener('click', refreshData);

    wireOverviewRows(app);

    const searchInput = app.querySelector('[data-role="overview-search"]');
    if (searchInput) {
      searchInput.addEventListener('input', () => {
        state.searchQuery = searchInput.value;
        const tbody = app.querySelector('[data-role="overview-tbody"]');
        if (tbody) {
          tbody.innerHTML = overviewRowsHTML(computeVisibleItems());
          wireOverviewRows(tbody);
        }
      });
    }

    const historySearchInput = app.querySelector('[data-role="history-search"]');
    const historyClearSearchBtn = app.querySelector('[data-role="history-clear-btn"]');
    function refreshHistoryList(){
      const tbody = app.querySelector('[data-role="history-tbody"]');
      if (tbody) {
        tbody.innerHTML = historyRowsHTML(computeVisibleHistory());
        wireHistoryRows(tbody);
      }
      if (historyClearSearchBtn) historyClearSearchBtn.style.display = state.historySearch ? 'flex' : 'none';
    }
    if (historySearchInput) {
      historySearchInput.addEventListener('input', () => {
        state.historySearch = historySearchInput.value;
        refreshHistoryList();
      });
    }
    if (historyClearSearchBtn) historyClearSearchBtn.addEventListener('click', () => {
      state.historySearch = '';
      if (historySearchInput) historySearchInput.value = '';
      refreshHistoryList();
    });
    const historyFromInput = app.querySelector('[data-role="history-from"]');
    if (historyFromInput) historyFromInput.addEventListener('change', () => {
      state.historyFrom = historyFromInput.value; render();
    });
    const historyToInput = app.querySelector('[data-role="history-to"]');
    if (historyToInput) historyToInput.addEventListener('change', () => {
      state.historyTo = historyToInput.value; render();
    });
    const historyClearRangeBtn = app.querySelector('[data-action="history-clear-range"]');
    if (historyClearRangeBtn) historyClearRangeBtn.addEventListener('click', () => {
      state.historyFrom = ''; state.historyTo = ''; render();
    });

    app.querySelectorAll('[data-sort-field]').forEach(th => {
      th.addEventListener('click', () => handleSortClick(th.getAttribute('data-sort-field')));
    });
    const sortUrgencyBtn = app.querySelector('[data-action="sort-urgency"]');
    if (sortUrgencyBtn) sortUrgencyBtn.addEventListener('click', sortByUrgency);
    const clearSortBtn = app.querySelector('[data-action="clear-sort"]');
    if (clearSortBtn) clearSortBtn.addEventListener('click', clearSort);

    const exportExcelBtn = app.querySelector('[data-action="export-excel"]');
    if (exportExcelBtn) exportExcelBtn.addEventListener('click', exportExcel);
    const exportPdfBtn = app.querySelector('[data-action="export-pdf"]');
    if (exportPdfBtn) exportPdfBtn.addEventListener('click', exportPdf);

    const showAddBtn = app.querySelector('[data-action="show-add-item"]');
    if (showAddBtn) showAddBtn.addEventListener('click', () => { state.showAddItem = true; render(); });
    const cancelAddBtn = app.querySelector('[data-action="cancel-add-item"]');
    if (cancelAddBtn) cancelAddBtn.addEventListener('click', () => { state.showAddItem = false; render(); });

    const addForm = app.querySelector('[data-form="add-item"]');
    if (addForm) addForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(addForm);
      addItem(fd.get('name'), fd.get('unit'), fd.get('minQty'), fd.get('price'), fd.get('code'), fd.get('image'));
    });

    const moveForm = app.querySelector('[data-form="move"]');
    if (moveForm) {
      setupCombobox(moveForm);
      setupRequesterCombobox(moveForm);
      moveForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const fd = new FormData(moveForm);
        const type = moveForm.getAttribute('data-type');
        moveStock(fd.get('itemId'), type, fd.get('qty'), fd.get('date'), fd.get('note'), fd.get('requester'));
      });
    }

    const newItemFile = app.querySelector('[data-role="new-item-file"]');
    if (newItemFile) newItemFile.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        const dataUrl = await readAndResizeImage(file, 240);
        const thumbLabel = app.querySelector('[data-role="new-item-thumb"]');
        const hiddenImg = app.querySelector('[data-role="new-item-image-hidden"]');
        if (hiddenImg) hiddenImg.value = dataUrl;
        if (thumbLabel) {
          const placeholder = thumbLabel.querySelector('.item-thumb-placeholder');
          if (placeholder) placeholder.outerHTML = '<img src="' + dataUrl + '"/>';
        }
      } catch(err){ showToast('อัปโหลดรูปไม่สำเร็จ', 'warn'); }
    });

    wireHistoryRows(app);

    const reportFromInput = app.querySelector('[data-role="report-from"]');
    if (reportFromInput) reportFromInput.addEventListener('change', () => { state.reportFrom = reportFromInput.value; render(); });
    const reportToInput = app.querySelector('[data-role="report-to"]');
    if (reportToInput) reportToInput.addEventListener('change', () => { state.reportTo = reportToInput.value; render(); });

    const reportQuickMonth = app.querySelector('[data-action="report-quick-month"]');
    if (reportQuickMonth) reportQuickMonth.addEventListener('click', () => {
      state.reportFrom = firstDayOfMonthStr(); state.reportTo = todayStr(); render();
    });
    const reportQuick7d = app.querySelector('[data-action="report-quick-7d"]');
    if (reportQuick7d) reportQuick7d.addEventListener('click', () => {
      const d = new Date(); d.setDate(d.getDate() - 6);
      state.reportFrom = d.toISOString().slice(0,10); state.reportTo = todayStr(); render();
    });
    const reportClearRange = app.querySelector('[data-action="report-clear-range"]');
    if (reportClearRange) reportClearRange.addEventListener('click', () => {
      state.reportFrom = ''; state.reportTo = ''; render();
    });
    const reportExportExcelBtn = app.querySelector('[data-action="report-export-excel"]');
    if (reportExportExcelBtn) reportExportExcelBtn.addEventListener('click', exportReportExcel);
    const reportExportPdfBtn = app.querySelector('[data-action="report-export-pdf"]');
    if (reportExportPdfBtn) reportExportPdfBtn.addEventListener('click', exportReportPdf);

    const reqFromInput = app.querySelector('[data-role="req-from"]');
    if (reqFromInput) reqFromInput.addEventListener('change', () => { state.reqFrom = reqFromInput.value; render(); });
    const reqToInput = app.querySelector('[data-role="req-to"]');
    if (reqToInput) reqToInput.addEventListener('change', () => { state.reqTo = reqToInput.value; render(); });
    const reqQuickMonth = app.querySelector('[data-action="req-quick-month"]');
    if (reqQuickMonth) reqQuickMonth.addEventListener('click', () => {
      state.reqFrom = firstDayOfMonthStr(); state.reqTo = todayStr(); render();
    });
    const reqQuick7d = app.querySelector('[data-action="req-quick-7d"]');
    if (reqQuick7d) reqQuick7d.addEventListener('click', () => {
      const d = new Date(); d.setDate(d.getDate() - 6);
      state.reqFrom = d.toISOString().slice(0,10); state.reqTo = todayStr(); render();
    });
    const reqClearFilter = app.querySelector('[data-action="req-clear-filter"]');
    if (reqClearFilter) reqClearFilter.addEventListener('click', () => {
      state.reqFrom = ''; state.reqTo = ''; state.reqSearch = ''; render();
    });

    function wireRequesterBody(root){
      const exportExcelBtn = root.querySelector('[data-action="req-export-excel"]');
      if (exportExcelBtn) exportExcelBtn.addEventListener('click', exportRequesterExcel);
      const exportPdfBtn = root.querySelector('[data-action="req-export-pdf"]');
      if (exportPdfBtn) exportPdfBtn.addEventListener('click', exportRequesterPdf);
    }
    const reqBodyContainer = app.querySelector('[data-role="requester-body"]');
    if (reqBodyContainer) wireRequesterBody(reqBodyContainer);

    const reqSearchInput = app.querySelector('[data-role="req-search"]');
    if (reqSearchInput) {
      reqSearchInput.addEventListener('input', () => {
        state.reqSearch = reqSearchInput.value;
        const data = computeRequesterData(state.reqFrom, state.reqTo, state.reqSearch);
        if (reqBodyContainer) {
          reqBodyContainer.innerHTML = requesterBodyHTML(data);
          wireRequesterBody(reqBodyContainer);
        }
      });
    }

    const execOrgInput = app.querySelector('[data-role="exec-org"]');
    if (execOrgInput) execOrgInput.addEventListener('input', () => { state.execOrgName = execOrgInput.value; });
    const execPreparedByInput = app.querySelector('[data-role="exec-prepared-by"]');
    if (execPreparedByInput) execPreparedByInput.addEventListener('input', () => { state.execPreparedBy = execPreparedByInput.value; });
    const execFromInput = app.querySelector('[data-role="exec-from"]');
    if (execFromInput) execFromInput.addEventListener('change', () => { state.execFrom = execFromInput.value; render(); });
    const execToInput = app.querySelector('[data-role="exec-to"]');
    if (execToInput) execToInput.addEventListener('change', () => { state.execTo = execToInput.value; render(); });
    const execQuickMonth = app.querySelector('[data-action="exec-quick-month"]');
    if (execQuickMonth) execQuickMonth.addEventListener('click', () => {
      state.execFrom = firstDayOfMonthStr(); state.execTo = todayStr(); render();
    });
    const execQuickQuarter = app.querySelector('[data-action="exec-quick-quarter"]');
    if (execQuickQuarter) execQuickQuarter.addEventListener('click', () => {
      state.execFrom = firstDayOfQuarterStr(); state.execTo = todayStr(); render();
    });
    const execQuickYear = app.querySelector('[data-action="exec-quick-year"]');
    if (execQuickYear) execQuickYear.addEventListener('click', () => {
      state.execFrom = firstDayOfYearStr(); state.execTo = todayStr(); render();
    });
    const execClearFilter = app.querySelector('[data-action="exec-clear-filter"]');
    if (execClearFilter) execClearFilter.addEventListener('click', () => {
      state.execFrom = ''; state.execTo = ''; render();
    });
    const execExportPdfBtn = app.querySelector('[data-action="exec-export-pdf"]');
    if (execExportPdfBtn) execExportPdfBtn.addEventListener('click', exportExecutivePdf);

    const resetBtn = app.querySelector('[data-action="reset-all"]');
    if (resetBtn) resetBtn.addEventListener('click', resetAll);

    const showImportBtn = app.querySelector('[data-action="show-import"]');
    if (showImportBtn) showImportBtn.addEventListener('click', () => { state.showImport = true; render(); });
    const cancelImportBtn = app.querySelector('[data-action="cancel-import"]');
    if (cancelImportBtn) cancelImportBtn.addEventListener('click', () => { state.showImport = false; render(); });
    const doImportBtn = app.querySelector('[data-action="do-import"]');
    if (doImportBtn) doImportBtn.addEventListener('click', () => {
      const ta = app.querySelector('[data-role="import-textarea"]');
      importLegacyData(ta ? ta.value : '');
    });
  }

  loadData();
})();
</script>

</body>
